# The studio: the spec's own checks, the type check and the automated suite. The studio's store is a
# GitHub branch (R-11-21); here every test and command runs on the fake GitHub API, in memory, seeded
# from content-configurations/. No TH_CONTENT_REPO is set, so nothing reaches a real repository.
name: studio
on:
  push:
    paths: [studio/**, spec/**, content-configurations/**, .github/workflows/studio.yml]
  pull_request:
    paths: [studio/**, spec/**, content-configurations/**]
  workflow_dispatch:
# Least privilege: the token reads the repository and nothing else.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Spec checks
        working-directory: spec
        run: |
          pip install PyYAML==6.0.3 jsonschema==4.26.0 referencing==0.37.0
          python3 tools/validate.py
          python3 tools/mutation_tests.py
      - name: Install
        working-directory: studio
        run: npm ci
      - name: Type check
        working-directory: studio
        run: npm run typecheck
      - name: Test
        working-directory: studio
        run: npm test
      - name: Studio checks
        working-directory: studio
        run: npm run studio -- check
      - name: Bank folders (content-configurations/banks)
        working-directory: studio
        run: |
          for bank in dib adib enbd fab; do
            npm run studio -- check --bank "$bank"
            npm run studio -- test --bank "$bank"
          done
      - name: The seeded content is current (R-11-25)
        working-directory: studio
        run: npm run studio -- seed-content
