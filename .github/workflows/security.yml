# Security gates on every push and pull request (spec R-09-28, R-09-61, Issue I-67): a secret scan of the whole history, the
# static check that no binding, configuration or package carries a literal secret (L37), dependency audits of the studio's
# runtime dependencies, the runtime's NuGet packages and the Temporal SQL Server plugin's Go modules, and a check that every
# action of every workflow is pinned to a full commit SHA. A finding fails the build.
name: security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pinned: the version and the SHA-256 of its release archive, from the release's checksums file.
      GITLEAKS_VERSION: "8.21.2"
      GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          rm gitleaks.tgz
      - name: Secret scan of the whole history
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
      - name: Secret scan of the working tree
        run: ./gitleaks dir --redact --no-banner --exit-code 1 .

  literal-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: No literal secret in a binding, configuration or package (L37), with the spec's other checks
        working-directory: spec
        run: |
          pip install PyYAML==6.0.3 jsonschema==4.26.0 referencing==0.37.0
          python3 tools/validate.py

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install
        working-directory: studio
        run: npm ci
      - name: Audit the studio's runtime dependencies
        working-directory: studio
        run: npm audit --omit=dev --audit-level=high

  dotnet-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - name: Audit the runtime's NuGet packages, transitive ones included
        working-directory: runtime
        run: |
          dotnet restore TransactHub.Runtime.slnx -v q
          dotnet list TransactHub.Runtime.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::A runtime package has a known vulnerability (see above)"
            exit 1
          fi

  go-vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: runtime/temporal-mssql/go.mod
          cache-dependency-path: runtime/temporal-mssql/go.sum
      - name: Known vulnerabilities in the Temporal SQL Server plugin's modules, as its code reaches them
        working-directory: runtime/temporal-mssql
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...

  pinned-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Every action is pinned to a full commit SHA, and every workflow names its token's permissions (R-09-61)
        run: |
          bad=$(grep -nE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]' .github/workflows/*.yml | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [ -n "$bad" ]; then echo "::error::Actions not pinned to a commit SHA:"; echo "$bad"; exit 1; fi
          for f in .github/workflows/*.yml; do
            grep -qE '^permissions:' "$f" || { echo "::error::$f does not name its token's permissions"; exit 1; }
          done
