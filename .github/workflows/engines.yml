# The engines: the studio's black-box suites in the browser and on deployed packages; the conformance kit
# on Temporal, DTFx, Elsa and Flowable; and the store matrix, the WPS salary file deployed on each runtime
# engine against PostgreSQL and SQL Server (plan N4, P3), and the WPS parity suite on DTFx and Elsa (plan P3).
# Flowable runs as its own server there, the Flowable REST server (plan D3), with the runtime's binding as its
# external worker. Heavier: on pushes to the runtime or the engines, and by hand.
name: engines
on:
  push:
    paths: [runtime/**, studio/engines/**, studio/src/**, spec/**, content-configurations/**, .github/workflows/engines.yml]
  workflow_dispatch:
jobs:
  blackbox:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install the studio and Playwright
        working-directory: studio
        run: |
          npm ci
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          npm run web:build
      - name: Temporal's test server (Maven Central)
        run: runtime/tools/temporal-test-server/setup.sh
      - name: Pull the database images once
        run: |
          docker pull mcr.microsoft.com/mssql/server:2022-latest
          docker pull postgres:16-alpine
      # The studio servers run on the fake GitHub API the suites start in memory (R-11-21); the kit
      # runners read an in-memory one seeded from content-configurations/.
      - name: Black-box suites (the narrated videos are left out)
        working-directory: studio
        run: npx vitest run --config vitest.blackbox.config.ts --exclude test/blackbox/demo-videos.test.ts --exclude test/blackbox/e2e-wps-engines-store.test.ts --exclude test/blackbox/e2e-wps-flowable-production.test.ts
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        engine: [temporal, dtfx, elsa, flowable]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      TH_KIT_TIMEOUT_MIN: "90"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"   # the Flowable harness compiles for 21; Temporal's test server runs on it too
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install
        working-directory: studio
        run: npm ci
      - name: Temporal's test server
        if: matrix.engine == 'temporal'
        run: runtime/tools/temporal-test-server/setup.sh
      - name: Flowable's harness (Maven Central)
        if: matrix.engine == 'flowable'
        run: studio/engines/flowable/setup.sh
      - name: Conformance kit on ${{ matrix.engine }}
        working-directory: studio
        run: npx tsx engines/${{ matrix.engine }}/run-kit.ts
  store:
    # Each runtime engine x each database: the payment settles, is accepted into the ISO 20022 tables, and
    # every payload the engine ran on rebuilds from its facts with an unbroken chain.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [temporal, dtfx, elsa, flowable]
        database: [PostgreSql, SqlServer]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install
        working-directory: studio
        run: npm ci
      - name: Temporal's test server
        if: matrix.engine == 'temporal'
        run: runtime/tools/temporal-test-server/setup.sh
      - name: The Flowable REST server's image (the test starts it as a container, its async executor off)
        if: matrix.engine == 'flowable'
        run: docker pull flowable/flowable-rest:7.1.0@sha256:b7ae287502cd5c243b577a0ca2894172e1c18cd75aea4fd67dc7d58f1b40db44
      - name: WPS on ${{ matrix.engine }} with the store on ${{ matrix.database }}
        working-directory: studio
        run: |
          if [ "${{ matrix.engine }}" = temporal ]; then
            npx vitest run --config vitest.blackbox.config.ts test/blackbox/e2e-wps-temporal.test.ts -t "database on ${{ matrix.database }}"
          else
            npx vitest run --config vitest.blackbox.config.ts test/blackbox/e2e-wps-engines-store.test.ts -t "${{ matrix.engine }} on ${{ matrix.database }}"
          fi
  flowable-production:
    # Flowable in production mode (Issues I-53 to I-55): the REST server's async executor on, in real time,
    # the runtime's binding a pure external worker. The WPS salary file on the store (PostgreSQL and SQL
    # Server) with its waits shortened by parameters, a timeout on a real timer against the virtual run's
    # trace, a job whose worker crashed handed out again when its lock expires, and a dead letter.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install
        working-directory: studio
        run: npm ci
      - name: Pull the images once
        run: |
          docker pull flowable/flowable-rest:7.1.0@sha256:b7ae287502cd5c243b577a0ca2894172e1c18cd75aea4fd67dc7d58f1b40db44
          docker pull mcr.microsoft.com/mssql/server:2022-latest
          docker pull postgres:16-alpine
      - name: WPS on Flowable in production mode
        working-directory: studio
        run: npx vitest run --config vitest.blackbox.config.ts test/blackbox/e2e-wps-flowable-production.test.ts
  wps-parity:
    # The WPS parity suite on DTFx and Elsa (plan P3): the scenarios e2e-wps-temporal runs on Temporal, each
    # compared with the studio interpreter's trace; first on the studio's engine harnesses, then on the
    # runtime's builds with the store on PostgreSQL; then the source's Central Bank SIF writer, imported
    # and published through the studio, on the engine (e2e-wps-source-slice, steps 1, 2 and 6 or 7).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [dtfx, elsa]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: Th-Test-Only-1234   # a test-only password, as in the store tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      TH_PARITY_ENGINES: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install
        working-directory: studio
        run: npm ci
      - name: Temporal's test server (the slice's steps run beside it)
        run: runtime/tools/temporal-test-server/setup.sh
      - name: WPS parity on ${{ matrix.engine }}, the studio's harness
        working-directory: studio
        run: npx vitest run --config vitest.blackbox.config.ts test/blackbox/e2e-wps-parity.test.ts
      - name: WPS parity on ${{ matrix.engine }}, the runtime's harness with the store on PostgreSQL
        working-directory: studio
        env:
          TH_STORE_PROVIDER: PostgreSql
          TH_STORE_CONNECTION: Host=127.0.0.1;Port=5432;Username=postgres;Password=Th-Test-Only-1234;Database=th_parity
        run: npx vitest run --config vitest.blackbox.config.ts test/blackbox/e2e-wps-parity.test.ts
      - name: The source's SIF writer on ${{ matrix.engine }}
        working-directory: studio
        run: |
          step=$([ "${{ matrix.engine }}" = dtfx ] && echo 6 || echo 7)
          npx vitest run --config vitest.blackbox.config.ts test/blackbox/e2e-wps-source-slice.test.ts -t "^the source WPS outward flow, through the north-star path (1|2|$step)\. "
  temporal-sqlserver:
    # Temporal's persistence on SQL Server (plan W5, P4): build the plugin (runtime/temporal-mssql), run
    # Temporal's own persistence suites against SQL Server 2022, start the server on SQL Server, prove a
    # workflow survives a server kill, then run the full conformance kit and the WPS salary file on it.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Th-Test-Only-1234   # a test-only password, as in the store tests
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Th-Test-Only-1234 -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      SQLSERVER_ADDR: 127.0.0.1:1433
      SQLSERVER_PASSWORD: Th-Test-Only-1234
      TEMPORAL_SQLSERVER_ADDR: 127.0.0.1:1433
      TEMPORAL_SQLSERVER_PASSWORD: Th-Test-Only-1234
      TH_KIT_TIMEOUT_MIN: "15"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: runtime/temporal-mssql/go.mod
          cache-dependency-path: |
            runtime/temporal-mssql/go.sum
            runtime/temporal-mssql/tools/durability/go.sum
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Build the plugin, the server and the schema tool
        working-directory: runtime/temporal-mssql
        run: |
          go vet ./...
          go build -o bin/ ./cmd/...
          (cd tools/durability && go build -o ../../bin/durability-worker .)
          go test ./sqlplugin/...
      - name: Temporal's persistence suites on SQL Server 2022
        working-directory: runtime/temporal-mssql
        run: |
          go test ./tests/ -run 'TestSQLServer' -count=1 -v -timeout 30m | tee suites.log
          scripts/suite-summary.sh suites.log
      - name: Both schemas with temporal-sql-tool
        working-directory: runtime/temporal-mssql
        run: |
          scripts/dev.sh schema
          mkdir -p .dev
          docker pull temporalio/temporal:1.5.1
      - name: A workflow survives a server kill
        working-directory: runtime/temporal-mssql
        run: scripts/durability-check.sh
      # As a bank would run it (docs/ISSUES.md I-47): the schemas are the admin's (sa, above); the server connects as a
      # login with only read, write and execute on the two Temporal databases. The server this leaves running, on that
      # login, is the one the WPS step below uses.
      - name: As a least-privilege login, the grants, the proof that it holds nothing more, and the durability check
        working-directory: runtime/temporal-mssql
        run: |
          kill "$(cat .dev/server.pid)" 2>/dev/null || true
          sleep 3
          scripts/least-privilege.sh login grant prove durability
      - name: Temporal's persistence suites as the least-privilege login, the admin doing each database's set-up
        working-directory: runtime/temporal-mssql
        run: scripts/least-privilege.sh suites
      - name: Install the studio
        working-directory: studio
        run: npm ci
      - name: The conformance kit on servers on SQL Server (44 of 50 scenarios, three shards)
        # A real server runs the kit in real time (docs/ISSUES.md I-48). Six scenarios wait a business hour
        # or more (CK-WAIT-01, CK-AWAIT-03 and CK-BLOCK-02 one hour, CK-BLOCK-03 four hours, CK-LOOKUP-01
        # two days, CK-AWAIT-02 three), so this fast subset leaves them out. The other 42 take about an
        # hour and a half one after another, so they run on three servers side by side, in about 30 minutes.
        working-directory: runtime/temporal-mssql
        env:
          KIT_EXCLUDE: CK-AWAIT-02 CK-AWAIT-03 CK-WAIT-01 CK-LOOKUP-01 CK-BLOCK-02 CK-BLOCK-03
        run: scripts/kit-on-sqlserver.sh
      - name: The WPS salary file on it, with the payments store on SQL Server too
        working-directory: studio
        run: |
          docker pull mcr.microsoft.com/mssql/server:2022-latest
          TH_TEMPORAL_ADDRESS=127.0.0.1:7233 npx vitest run --config vitest.blackbox.config.ts test/blackbox/e2e-wps-temporal.test.ts -t "database on SqlServer"
      - name: Server log
        if: always()
        working-directory: runtime/temporal-mssql
        run: |
          grep -E '"level":"(error|fatal)"' .dev/server.log | tail -50 || true
          kill "$(pgrep -f bin/temporal-server)" 2>/dev/null || true
