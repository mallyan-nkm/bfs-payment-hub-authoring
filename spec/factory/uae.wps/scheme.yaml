kind: scheme
scope: uae.wps
release: 1.4.0
title: UAE Wages Protection System
wire: file
messages:
  - id: uae.wps.sif
    title: Salary information file from the employer
    direction: in
    confirmed: true
    disposition:
      start:
        kind: payment
        direction: outward
        segment: corporate
        leg: uae.wps.wf.salary-file-out.v1
        intakeMap: uae.wps.map.sif-in.v1
  - id: uae.wps.sif-submission
    title: Salary information file submitted to WPS
    direction: out
    confirmed: true
    disposition:
      sentBy: uae.wps.exchange.send-salary-file.v1
  - id: uae.wps.ack
    title: Acknowledgement from WPS, ACK or NAK
    direction: in
    confirmed: true
    # Release 1.4.0 (Issue I-235, R-09-211): the acknowledgement answers the salary file the bank submits; the oldest wait for it is
    # measured from that file.
    repliesTo: [uae.wps.sif-submission]
    disposition:
      # The front door reads the acknowledged file's family from the ACK or NAK file's name (Issue I-41). Release 1.4.0 (Issue I-267,
      # R-09-212): its correlation map reads the salary file the answer names, so no bank's binding trims the stem.
      deliver: { correlateBy: file id, families: [sif, rfr, prc, dif, rfa, dcr, rrr], correlationMap: uae.wps.map.ack-correlation.v1 }
  - id: uae.wps.pif
    title: Payment information file, one per agent
    direction: in
    confirmed: true
    disposition:
      start:
        kind: payment
        direction: inward
        leg: uae.wps.wf.agent-payment-in.v2
        refuseLeg: uae.wps.wf.inward-refuse.v1
        intakeMap: uae.wps.map.pif-in.v1
  - id: uae.wps.psi
    title: Payment supplementary information, paired with a PIF
    direction: in
    confirmed: true
    disposition:
      deliver: { correlateBy: payment file id }
  - id: uae.wps.prc
    title: Receipt confirmation from the agent
    direction: out
    confirmed: true
    disposition:
      sentBy: uae.wps.exchange.send-receipt-confirmation.v1
  - id: uae.wps.dif
    title: Disbursement information file from the agent
    direction: out
    confirmed: true
    disposition:
      sentBy: uae.wps.exchange.send-disbursement-file.v1
  # Release 1.2.0 (R-12-21): the agent's refund cycle, the source's RRI flow. WPS asks the agent bank to refund lines of an earlier
  # payment file (RRI, camt.056); the bank returns the funds of the lines it posted (DCR, pacs.004) and answers each line (RRR,
  # camt.029). The request is a new refund order on p.wf.refund.v1; the earlier payment file is named by its id.
  - id: uae.wps.dcr
    title: Disbursement cancellation request from the agent, the funds of a refund returned (pacs.004)
    direction: out
    confirmed: false
    disposition:
      sentBy: uae.wps.exchange.send-disbursement-cancellation.v1
  - id: uae.wps.rfr
    title: Refund request from the employer's bank
    direction: out
    confirmed: true
    disposition:
      sentBy: uae.wps.exchange.send-refund-request.v1
  # Release 1.3.0 (R-12-24): the employer's refund order is an outward refund order on p.wf.refund-out.v1; WPS is its leg
  # (uae.wps.wf.refund-out.v2) and the platform posts the employer's credit. The 1.2.0 route (a request on p.wf.request.v1 whose
  # leg posted) stays for the requests started on it.
  - id: uae.wps.refund-order
    title: Refund order from the employer
    direction: in
    confirmed: false
    disposition:
      start:
        kind: refund
        direction: outward
        leg: uae.wps.wf.refund-out.v2
        intakeMap: uae.wps.map.refund-order-in.v1
  - id: uae.wps.rri
    title: Refund request instruction to the agent, a request to refund lines of an earlier payment file (camt.056)
    direction: in
    confirmed: false
    disposition:
      start:
        kind: refund
        direction: inward
        leg: uae.wps.wf.refund-request-in.v1
        refuseLeg: uae.wps.wf.refund-request-refuse.v1
        intakeMap: uae.wps.map.rri-in.v1
  - id: uae.wps.rrr
    title: Refund request response from the agent, each line accepted or rejected (camt.029)
    direction: out
    confirmed: false
    disposition:
      sentBy: uae.wps.exchange.send-refund-response.v1
  - id: uae.wps.rsu
    title: Refund settlement file to the employer's bank
    direction: in
    confirmed: true
    disposition:
      deliver: { correlateBy: refund request file id }
  - id: uae.wps.rfa
    title: Returns file from the agent
    direction: out
    confirmed: false
    disposition:
      sentBy: uae.wps.exchange.send-returns-file.v1
  - id: uae.wps.rtc
    title: Return file to the employer's bank
    direction: in
    confirmed: true
    disposition:
      start:
        kind: return
        direction: inward
        leg: uae.wps.wf.return-in.v1
        refuseLeg: uae.wps.wf.inward-refuse.v1
        intakeMap: uae.wps.map.rtc-in.v2
legs:
  - uae.wps.wf.salary-file-out.v1
  - uae.wps.wf.agent-payment-in.v2
  - uae.wps.wf.refund-out.v2
  - uae.wps.wf.return-in.v1
  - uae.wps.wf.inward-refuse.v1
  - uae.wps.wf.refund-request-in.v1
  - uae.wps.wf.refund-request-refuse.v1
ports:
  - uae.wps.port.wps.v1
  - uae.wps.port.employer-channel.v1
extensions:
  - uae.wps.ext.salary.v1
provenance:
  origin: factory
  status: provisional
  clauses: [CBUAE WPS responsibility guide 2018]
  note: File types come from a 2018 guide. Release 1.2.0 builds the agent's refund cycle (RRI, DCR, RRR) from the TransactHub source; the refund request instruction's message id replaces the planned uae.wps.rfr-in. No message is planned now; every scheme fact is still unconfirmed. Release 1.3.0 moves the employer's refund order onto the platform's outward refund order (p.wf.refund-out.v1). Release 1.4.0 says which message the acknowledgement answers (repliesTo) and gives its deliver disposition a correlation map; neither the file rules nor a report are declared, as the rulebook is not here (Issues I-159, I-164).
