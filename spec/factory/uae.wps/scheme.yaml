kind: scheme
scope: uae.wps
release: 1.0.0
title: UAE Wages Protection System
wire: file
messages:
  - id: uae.wps.sif
    title: Salary information file from the employer
    direction: in
    confirmed: true
    disposition:
      start:
        kind: payment
        direction: outward
        segment: corporate
        leg: uae.wps.wf.salary-file-out.v1
        intakeMap: uae.wps.map.sif-in.v1
  - id: uae.wps.sif-submission
    title: Salary information file submitted to WPS
    direction: out
    confirmed: true
    disposition:
      sentBy: uae.wps.exchange.send-salary-file.v1
  - id: uae.wps.ack
    title: Acknowledgement from WPS, ACK or NAK
    direction: in
    confirmed: true
    disposition:
      deliver: { correlateBy: file id }
  - id: uae.wps.pif
    title: Payment information file, one per agent
    direction: in
    confirmed: true
    disposition:
      start:
        kind: payment
        direction: inward
        leg: uae.wps.wf.agent-payment-in.v1
        refuseLeg: uae.wps.wf.inward-refuse.v1
        intakeMap: uae.wps.map.pif-in.v1
  - id: uae.wps.psi
    title: Payment supplementary information, paired with a PIF
    direction: in
    confirmed: true
    disposition:
      deliver: { correlateBy: payment file id }
  - id: uae.wps.prc
    title: Receipt confirmation from the agent
    direction: out
    confirmed: true
    disposition:
      sentBy: uae.wps.exchange.send-receipt-confirmation.v1
  - id: uae.wps.dif
    title: Disbursement information file from the agent
    direction: out
    confirmed: true
    disposition:
      sentBy: uae.wps.exchange.send-disbursement-file.v1
  - id: uae.wps.dcr
    title: Disbursement cancellation request from the agent
    direction: out
    confirmed: false
    disposition:
      planned: Agent-side correction of a disbursement report
  - id: uae.wps.rfr
    title: Refund request from the employer's bank
    direction: out
    confirmed: true
    disposition:
      sentBy: uae.wps.exchange.send-refund-request.v1
  - id: uae.wps.refund-order
    title: Refund order from the employer
    direction: in
    confirmed: false
    disposition:
      start:
        kind: request
        direction: outward
        leg: uae.wps.wf.refund-out.v1
        intakeMap: uae.wps.map.refund-order-in.v1
  - id: uae.wps.rfr-in
    title: Refund request made available to the agent
    direction: in
    confirmed: false
    disposition:
      planned: Agent-side refund leg
  - id: uae.wps.rrr
    title: Refund response from the agent
    direction: out
    confirmed: false
    disposition:
      planned: Agent-side refund leg
  - id: uae.wps.rsu
    title: Refund settlement file to the employer's bank
    direction: in
    confirmed: true
    disposition:
      deliver: { correlateBy: refund request file id }
  - id: uae.wps.rfa
    title: Returns file from the agent
    direction: out
    confirmed: false
    disposition:
      sentBy: uae.wps.exchange.send-returns-file.v1
  - id: uae.wps.rtc
    title: Return file to the employer's bank
    direction: in
    confirmed: true
    disposition:
      start:
        kind: return
        direction: inward
        leg: uae.wps.wf.return-in.v1
        refuseLeg: uae.wps.wf.inward-refuse.v1
        intakeMap: uae.wps.map.rtc-in.v1
legs:
  - uae.wps.wf.salary-file-out.v1
  - uae.wps.wf.agent-payment-in.v1
  - uae.wps.wf.refund-out.v1
  - uae.wps.wf.return-in.v1
  - uae.wps.wf.inward-refuse.v1
ports:
  - uae.wps.port.wps.v1
  - uae.wps.port.employer-channel.v1
extensions:
  - uae.wps.ext.salary.v1
provenance:
  origin: factory
  status: provisional
  clauses: [CBUAE WPS responsibility guide 2018]
  note: File types come from a 2018 guide. Three messages are planned, so this pack is not yet publishable.
