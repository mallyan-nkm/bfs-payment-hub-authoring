kind: operations-view
name: uae.wps.view.operations.v1
release: 1.5.0
title: WPS operations view
description: >-
  What an operator sees of a WPS file and its legs: the salary file to WPS (SIF, its acknowledgement), the payment file
  as the agent (PIF, PSI, PRC, DIF, RFA and the returns), the return to the employer's bank (RTC) and the refund request
  (RFR, RSU). Each field names the source system's screen that showed it (oldScreen); docs/runtime/ops-console-wps-mapping.md
  lists every field of those screens and the ones with no source in the new model (Issue I-100). Release 1.2.0 adds the
  fields the owner's decision of 2026-11-22 gave an ISO 20022 home: the initiator, the channel, the labour ministry status,
  the allowances, the account type and bank name of a line, the encryption of the SIF and the NAK's per-line errors. Release
  1.3.0 adds the agent's refund legs of a refund order (RRI, DCR, RRR), which the platform's view shows with its FX and charges.
  Release 1.4.0 shows the employer's refund request as the leg of an outward refund order (uae.wps.wf.refund-out.v2): the RFR and
  the RSU are the leg's, the credit to the employer is the platform view's posting (R-12-24). Release 1.5.0 declares the source's
  fixed WPS reports, the SIF summary, the SIF detail and the upload history, as reports of declared fields (R-05-67, Issue I-144),
  the file's status, and the WPS turnaround limit and retention period a bank may set apart from the platform's (R-05-68, R-05-70).
scheme: uae.wps
parameters:
  # A bank's value for WPS wins over the platform view's; until the bank sets one, the platform's applies (R-05-68, R-05-70).
  tatLimit: { type: duration, default: P0D, bounds: { min: P0D, max: P30D }, lookupDate: payment-date, description: "The turnaround limit of a WPS file, from acceptance to its end. Until the bank sets it, the platform's applies." }
  retentionPeriod: { type: duration, default: P0D, bounds: { min: P0D, max: P36600D }, lookupDate: step-time, description: "How long an ended WPS file is kept before it is due for erasure. Until the bank sets it, the platform's applies." }
subject:
  title: WPS file
  groups:
    - { id: file, title: File details }
    - { id: metrics, title: Processing metrics }
    - { id: control, title: Salary control record (SCR) }
  fields:
    - { id: fileName, label: File name, group: file, source: "message:uae.wps.sif.fileName", oldScreen: "SIF Summary report, File Name; Upload History, File Reference" }
    - { id: transactionId, label: Transaction id, group: file, source: subject.id, format: code, oldScreen: "SIF Summary report, Transaction ID" }
    - { id: sifFileId, label: SIF file id, group: file, source: bulk.messageId, format: code, oldScreen: "SIF Detail report, SIF File Name" }
    - { id: corporateName, label: Corporate name, group: file, source: bulk.debtorName, mask: none, oldScreen: "SIF Summary report, Corporate Name (an organisation's name, shown whole)" }
    - { id: initiatedBy, label: Initiated by, group: file, source: bulk.initiatingParty.id, mask: id, oldScreen: "SIF Summary report, Uploaded By; SIF Summary 360, Initiated By; Upload History, Submitted By (the channel user's id, masked)" }
    - { id: uploadChannel, label: Channel, group: file, source: ext.uae.wps.uploadChannel, format: code, oldScreen: "SIF Detail report, Channel; SIF Summary 360, Channel; audit trail, Channel" }
    - { id: employerStatus, label: Labour ministry status, group: file, source: ext.uae.wps.employerStatus, format: status, oldScreen: "SIF Detail report, MOHRE Update Status" }
    - { id: debitAccount, label: Debit account, group: file, source: bulk.debtorAccount.iban, mask: account, oldScreen: "SIF Detail report, Debit Account Number (masked); Upload History, Debit A/c No (masked)" }
    - { id: employerId, label: MOL establishment id, group: file, source: ext.uae.wps.employerId, mask: id, oldScreen: "SIF Summary report, MOL Establishment ID; Upload History, MOL ID (masked)" }
    - { id: employerReference, label: Employer reference, group: file, source: ext.uae.wps.employerReference, oldScreen: "SIF file SCR, employer reference" }
    - { id: employerRoutingCode, label: Employer's bank routing code, group: file, source: bulk.debtorAgent.memberId, format: code, oldScreen: "SIF Detail report, Routing Code" }
    - { id: salaryMonth, label: Salary month, group: file, source: ext.uae.wps.salaryMonth, format: code, oldScreen: "SIF Detail report, Salary Month and Salary Year; Upload History, Salary Period" }
    - { id: fileCreationDate, label: File created on, group: file, source: ext.uae.wps.fileCreationDate, format: date, oldScreen: "SIF file SCR, creation date" }
    - { id: fileCreationTime, label: File created at, group: file, source: ext.uae.wps.fileCreationTime, format: code, oldScreen: "SIF file SCR, creation time" }
    - { id: fileStatus, label: Status, group: file, source: subject.status, format: status, oldScreen: "SIF Summary report, Current Status; Upload History, Status" }
    - { id: uploadedAt, label: Received at, group: file, source: subject.acceptedAt, format: datetime, oldScreen: "SIF Summary report, Upload Date; Upload History, Submitted On; SIF Summary 360, Initiated DateTime" }
    - { id: totalRecords, label: Total records, group: metrics, source: bulk.numberOfTransactions, format: count, oldScreen: "SIF Summary report, Total Records; SIF Summary 360, Processing Metrics, Total Records" }
    - { id: totalAmount, label: Total amount, group: metrics, source: bulk.controlSum, format: amount, oldScreen: "SIF Summary report, Total Amount; Integration 360, Total Salary Amount" }
    - { id: systemAccepted, label: System accepted, group: metrics, source: "lines.count(line.facts.validation.worst = pass)", format: count, oldScreen: "SIF Summary 360, Processing Metrics, System Accepted" }
    - { id: systemRejected, label: System rejected, group: metrics, source: "lines.count(line.facts.validation.worst != pass)", format: count, oldScreen: "SIF Summary 360, Processing Metrics, System Rejected" }
    - { id: ownBankAccounts, label: Own bank accounts, group: metrics, source: "lines.count(line.creditorAgent.memberId = bulk.debtorAgent.memberId)", format: count, oldScreen: "SIF Summary 360, Processing Metrics, Own A/Cs" }
    - { id: otherBankAccounts, label: Other bank accounts, group: metrics, source: "lines.count(line.creditorAgent.memberId != bulk.debtorAgent.memberId)", format: count, oldScreen: "SIF Summary 360, Processing Metrics, Other Bank A/C" }
    - { id: linesTotal, label: Sum of the lines, group: control, source: "lines.sum(line.amount)", format: amount, oldScreen: "SIF Summary 360, Record List, total of the employee records" }
    - { id: scrRecordCount, label: SCR record count, group: control, source: bulk.numberOfTransactions, format: count, oldScreen: "SIF Summary 360, Record List, SCR row, record count" }
    - { id: scrTotalSalary, label: SCR total salary, group: control, source: bulk.controlSum, format: amount, oldScreen: "SIF Summary 360, Record List, SCR row, total salary" }
  columns: [fileName, sifFileId, employerId, salaryMonth, totalRecords, totalAmount, systemRejected]
  filters:
    - { field: fileName, match: contains, label: File name }
    - { field: sifFileId, match: contains }
    - { field: employerId, match: exact, label: MOL establishment id (masked) }
    - { field: salaryMonth, match: exact }
    - { field: employerRoutingCode, match: exact }
    - { field: uploadChannel, match: exact, label: Channel }
    - { field: employerStatus, match: exact, label: Labour ministry status }
    - { field: totalAmount, match: range }
    - { field: totalRecords, match: range }
  lines:
    title: Salary lines (EDR)
    fields:
      - { id: lineNo, label: Line, source: line.lineNo, format: count, oldScreen: "SIF Summary 360, Record List, #; File Detail, #" }
      - { id: employeeId, label: Employee person id, source: line.ext.uae.wps.personId, mask: id, oldScreen: "SIF Detail report, Employee Unique ID; File Detail, Employee ID and MOHRE ID (masked)" }
      - { id: creditAccount, label: Credit account, source: line.creditorAccount.iban, mask: account, oldScreen: "SIF Detail report, Credit Account Number (masked); File Detail, Account No" }
      - { id: routingCode, label: Routing code, source: line.creditorAgent.memberId, format: code, oldScreen: "SIF Summary 360, Record List, Routing Code; File Detail, Routing" }
      - { id: payStartDate, label: Pay start, source: line.ext.uae.wps.payStartDate, format: date, oldScreen: "SIF Summary 360, Record List, Pay Start" }
      - { id: payEndDate, label: Pay end, source: line.ext.uae.wps.payEndDate, format: date, oldScreen: "SIF Summary 360, Record List, Pay End" }
      - { id: daysInPeriod, label: Days, source: line.ext.uae.wps.daysInPeriod, format: count, oldScreen: "SIF Summary 360, Record List, Days; SIF Detail report, No Of Days" }
      - { id: fixedPay, label: Fixed, source: line.ext.uae.wps.fixedPay, format: amount, mask: none, oldScreen: "SIF Summary 360, Record List, Fixed (shown whole)" }
      - { id: variablePay, label: Variable, source: line.ext.uae.wps.variablePay, format: amount, mask: none, oldScreen: "SIF Summary 360, Record List, Variable (shown whole)" }
      - { id: leaveDays, label: Leave days, source: line.ext.uae.wps.leaveDays, format: count, oldScreen: "SIF Summary 360, Record List, Leave Days" }
      - { id: housingAllowance, label: Housing, source: line.ext.uae.wps.housingAllowance, format: amount, mask: none, oldScreen: "SIF Detail report, Housing Allowance; Record List, Housing (shown whole)" }
      - { id: conveyanceAllowance, label: Conveyance, source: line.ext.uae.wps.conveyanceAllowance, format: amount, mask: none, oldScreen: "SIF Detail report, Conveyance Allowance; Record List, Conveyance (shown whole)" }
      - { id: medicalAllowance, label: Medical, source: line.ext.uae.wps.medicalAllowance, format: amount, mask: none, oldScreen: "SIF Detail report, Medical Allowance; Record List, Medical (shown whole)" }
      - { id: annualPassageAllowance, label: Annual passage, source: line.ext.uae.wps.annualPassageAllowance, format: amount, mask: none, oldScreen: "SIF Detail report, Annual Passage Allowance; Record List, Passage (shown whole)" }
      - { id: overtimeAllowance, label: Overtime, source: line.ext.uae.wps.overtimeAllowance, format: amount, mask: none, oldScreen: "SIF Detail report, Overtime Allowance; Record List, Overtime (shown whole)" }
      - { id: otherAllowances, label: Other allowances, source: line.ext.uae.wps.otherAllowances, format: amount, mask: none, oldScreen: "SIF Detail report, Other Allowances; Record List, Other (shown whole)" }
      - { id: leaveEncashment, label: Leave encashment, source: line.ext.uae.wps.leaveEncashment, format: amount, mask: none, oldScreen: "SIF Detail report, Leave Encashment; Record List, Leave Encash (shown whole)" }
      - { id: accountType, label: Account type, source: line.creditorAccount.type, format: code, oldScreen: "SIF Detail report, Account Type" }
      - { id: bankName, label: Bank, source: line.creditorAgent.name, oldScreen: "SIF Detail report, Bank Name" }
      - { id: totalSalary, label: Total salary, source: line.amount, format: amount, oldScreen: "File Detail, Total Salary; SIF Detail report, Total Salary Amount" }
      - { id: lineStatus, label: Status, source: line.facts.validation.worst, format: status, oldScreen: "File Detail, Status; SIF Detail report, EDR Status" }
      - { id: lineFindings, label: Findings, source: line.facts.validation.findings, format: json, oldScreen: "Upload History, Error Details (per record)" }
      - { id: endToEndId, label: End-to-end id, source: line.endToEndId, format: code }
      # A refund order's lines (1.3.0, R-12-22): the reason WPS gives, and the platform's FX and charge on the line.
      - { id: refundReason, label: Refund reason, source: line.ext.uae.wps.refundReason, format: code, oldScreen: "Refund cycle dashboard, refund line reason code" }
      - { id: refundConverted, label: Refund converted, source: line.facts.fx.amount, format: amount, oldScreen: "RRI posting, the exchange-rate-adjusted amount" }
      - { id: refundRate, label: Exchange rate, source: line.facts.fx.rate, format: text, oldScreen: "RRI posting, Exchange rate" }
      - { id: refundCharge, label: Charge, source: line.facts.charges.amount, format: amount }
      - { id: refundChargeVat, label: VAT, source: line.facts.charges.tax.amount, format: amount }
    columns: [lineNo, employeeId, creditAccount, routingCode, payStartDate, payEndDate, daysInPeriod, fixedPay, variablePay, leaveDays, totalSalary, lineStatus]
  # The source's fixed WPS reports (R-05-67, Issue I-144): each a CSV of the fields above, masked as declared, every export an audit fact.
  reports:
    - id: sif-summary
      title: SIF summary
      rows: subject
      columns: [transactionId, fileName, sifFileId, corporateName, employerId, initiatedBy, uploadChannel, salaryMonth, uploadedAt, totalRecords, totalAmount, systemAccepted, systemRejected, employerStatus, fileStatus]
      oldScreen: SIF Summary report
    - id: sif-detail
      title: SIF detail
      rows: lines
      columns: [transactionId, sifFileId, employerId, employerRoutingCode, debitAccount, salaryMonth, uploadChannel, employerStatus, line.lineNo, line.employeeId, line.creditAccount, line.routingCode, line.bankName, line.accountType, line.payStartDate, line.payEndDate, line.daysInPeriod, line.fixedPay, line.variablePay, line.housingAllowance, line.conveyanceAllowance, line.medicalAllowance, line.annualPassageAllowance, line.overtimeAllowance, line.otherAllowances, line.leaveEncashment, line.totalSalary, line.lineStatus]
      oldScreen: SIF Detail report
    - id: upload-history
      title: Upload history
      rows: documents
      document: uae.wps.sif
      columns: [document.fileName, document.at, document.size, document.source, transactionId, sifFileId, employerId, debitAccount, salaryMonth, initiatedBy, totalRecords, totalAmount, fileStatus]
      oldScreen: Upload History
  documents:
    - { kind: uae.wps.sif, label: Original SIF }
    - { kind: uae.wps.sif-submission, label: SIF sent to WPS }
    - { kind: uae.wps.ack, label: ACK or NAK from WPS }
    - { kind: uae.wps.pif, label: Payment file (PIF) }
    - { kind: uae.wps.psi, label: Supplementary file (PSI) }
    - { kind: uae.wps.prc, label: Receipt confirmation (PRC) }
    - { kind: uae.wps.dif, label: Disbursement file (DIF) }
    - { kind: uae.wps.rfa, label: Returns file (RFA) }
    - { kind: uae.wps.rtc, label: Return file (RTC) }
    - { kind: uae.wps.rfr, label: Refund request (RFR) }
    - { kind: uae.wps.rsu, label: Refund settlement (RSU) }
    - { kind: uae.wps.rri, label: Refund request instruction (RRI) }
    - { kind: uae.wps.dcr, label: Disbursement cancellation request (DCR) }
    - { kind: uae.wps.rrr, label: Refund request response (RRR) }
legs:
  - leg: uae.wps.wf.salary-file-out.v1
    title: Salary file to WPS (SIF)
    selectBy: { direction: outward, steps: [submit] }
    groups:
      - { id: checks, title: Checks }
      - { id: gateway, title: Central Bank gateway }
    fields:
      - { id: businessDate, label: Business date, group: checks, source: "step:business-date.outcome", format: status }
      - { id: fileChecks, label: File checks, group: checks, source: "step:file-checks.outcome", format: status, oldScreen: "SIF Summary report, Current Status (validation stage)" }
      - { id: fileFindings, label: File findings, group: checks, source: "step:file-checks.writes.facts.validation.findings", format: json, oldScreen: "Upload History, Error Details" }
      - { id: employerStatusCheck, label: Labour ministry asked, group: checks, source: "step:employer-status.outcome", format: status, oldScreen: "SIF Detail report, MOHRE Update Status (the lookup)" }
      - { id: rendered, label: SIF rendered, group: gateway, source: "step:render.outcome", format: status }
      - { id: encryption, label: SIF encrypted for WPS, group: gateway, source: "step:submit.encrypt.outcome", format: status }
      - { id: sentToCbAt, label: Sent to the Central Bank at, group: gateway, source: "step:submit.send.at", format: datetime, oldScreen: "SIF Summary 360, Central Bank Gateway Details, Sent to CB DateTime" }
      - { id: sendOutcome, label: Upload, group: gateway, source: "step:submit.send.outcome", format: status, oldScreen: "Integration 360, Channel Interactions, Status of the upload" }
      - { id: sendAttempts, label: Upload attempts, group: gateway, source: "step:submit.send.attempt", format: count, oldScreen: "Integration 360, Channel Interactions, Retry" }
      - { id: cbFileName, label: CB file name, group: gateway, source: "message:uae.wps.sif-submission.fileName", oldScreen: "SIF Summary 360, Central Bank Gateway Details, CB File Name" }
      - { id: cbResponse, label: CB response (ACK or NAK), group: gateway, source: "step:submit.read-ack.outcome", format: status, oldScreen: "SIF Summary 360, CB Response; SIF Detail report, ACK/NAK Status; Related Messages, SIF ACK/NAK" }
      - { id: ackReceivedAt, label: ACK or NAK received at, group: gateway, source: "step:submit.read-ack.at", format: datetime, oldScreen: "SIF Detail report, ACK/NAK Received DateTime" }
      - { id: ackStatus, label: Status after the acknowledgement, group: gateway, source: "step:submit.read-ack.writes.status.code", format: status, oldScreen: "Related Messages, ACK section, Status" }
      - { id: nakReason, label: NAK reason, group: gateway, source: "step:submit.read-ack.reasonCode", format: code, oldScreen: "Related Messages, NAK section, error code (file level)" }
      - { id: nakLines, label: NAK errors per line, group: gateway, source: "step:submit.read-ack.writes.status.transactions", format: json, oldScreen: "Related Messages, NAK section, errors per line (line, code, description)" }
      - { id: ackFileName, label: ACK or NAK file name, group: gateway, source: "message:uae.wps.ack.fileName", oldScreen: "SIF Summary 360, ACK/NAK File Name" }
    columns: [cbResponse, ackReceivedAt]
    filters:
      - { field: cbResponse, match: exact, label: CB response }
      - { field: fileChecks, match: exact }
    actions:
      - { action: resend, label: Send the file again, role: Operator, secondApprover: Supervisor, remarks: required }
      - { action: retry, label: Retry the failed step, role: Operator, remarks: required }
  - leg: uae.wps.wf.agent-payment-in.v2
    title: Payment file as the agent (PIF)
    selectBy: { direction: inward, steps: [supplement] }
    groups:
      - { id: files, title: Files and acknowledgements }
      - { id: returns, title: Returns }
    fields:
      - { id: supplement, label: Supplementary file (PSI), group: files, source: "step:supplement.outcome", format: status }
      - { id: fileChecks, label: File checks, group: files, source: "step:file-checks.outcome", format: status }
      - { id: prcSentAt, label: PRC sent at, group: files, source: "step:confirm-receipt.send.at", format: datetime }
      - { id: prcStatus, label: PRC ACK or NAK, group: files, source: "step:confirm-receipt.read-ack.outcome", format: status, oldScreen: "WPS dashboard, ACK and NAK received per file type (PRC)" }
      - { id: difSentAt, label: DIF sent at, group: files, source: "step:report-disbursement.send.at", format: datetime }
      - { id: difStatus, label: DIF ACK or NAK, group: files, source: "step:report-disbursement.read-ack.outcome", format: status, oldScreen: "WPS dashboard, DIF, Direct Instruction File status" }
      - { id: returnsDecision, label: Returns, group: returns, source: "step:returns.outcome", format: status, oldScreen: "WPS dashboard, Returned" }
      - { id: returnsCount, label: Returned credits, group: returns, source: "step:returns.writes.facts.returns.count", format: count, oldScreen: "WPS dashboard, Returned; Failed Credits" }
      - { id: returnsAmount, label: Returned amount, group: returns, source: "step:returns.writes.facts.returns.amount", format: amount }
      - { id: rfaStatus, label: RFA ACK or NAK, group: returns, source: "step:return-credits.read-ack.outcome", format: status, oldScreen: "WPS dashboard, RFA, Return File Acknowledgement status" }
      - { id: returnPosting, label: Return posted, group: returns, source: "step:record-return.outcome", format: status }
    columns: [prcStatus, difStatus, returnsCount]
    filters:
      - { field: prcStatus, match: exact }
      - { field: difStatus, match: exact }
      - { field: rfaStatus, match: exact }
      - { field: returnsCount, match: range }
    actions:
      - { action: release, label: Release after repair, role: Operator, secondApprover: Supervisor, remarks: required, when: { hold: repair } }
      - { action: reject, label: Reject, role: Operator, remarks: required, when: { hold: repair } }
  - leg: uae.wps.wf.return-in.v1
    title: Return to the employer's bank (RTC)
    selectBy: { direction: inward, steps: [credit-employer] }
    fields:
      - { id: employerCredit, label: Employer credited, source: "step:credit-employer.outcome", format: status, oldScreen: "WPS dashboard, RTC, Return Transaction Credit" }
      - { id: creditedAt, label: Credited at, source: "step:credit-employer.at", format: datetime }
    columns: [employerCredit]
  - leg: uae.wps.wf.refund-out.v2
    title: Refund request (RFR)
    selectBy: { direction: outward, kind: refund, steps: [request] }
    fields:
      - { id: rfrStatus, label: RFR ACK or NAK, source: "step:request.read-ack.outcome", format: status, oldScreen: "WPS dashboard, RFR, Refund Request" }
      - { id: rfrSentAt, label: RFR sent at, source: "step:request.send.at", format: datetime }
      - { id: settlement, label: Refund settlement (RSU), source: "step:request.read-settlement.outcome", format: status, oldScreen: "WPS dashboard, RSU, Return Status Update" }
    columns: [rfrStatus, settlement]
    actions:
      - { action: resend, label: Send the file again, role: Operator, secondApprover: Supervisor, remarks: required }
  # The agent's legs of a refund order (R-12-22): the order, its FX, charges, block, approval and posting are the platform's view.
  - leg: uae.wps.wf.refund-request-in.v1
    title: Refund request answered (DCR and RRR)
    selectBy: { direction: inward, kind: refund, steps: [return-funds] }
    groups:
      - { id: files, title: Files and acknowledgements }
    fields:
      - { id: dcrRendered, label: DCR rendered, group: files, source: "step:render-return.outcome", format: status }
      - { id: dcrSentAt, label: DCR sent at, group: files, source: "step:return-funds.send.at", format: datetime, oldScreen: "Refund cycle dashboard, DCR generated and uploaded" }
      - { id: dcrStatus, label: DCR ACK or NAK, group: files, source: "step:return-funds.read-ack.outcome", format: status, oldScreen: "Refund cycle dashboard, DCR acknowledgement or rejection" }
      - { id: rrrSentAt, label: RRR sent at, group: files, source: "step:answer.send.at", format: datetime, oldScreen: "Refund cycle dashboard, RRR generated and pushed" }
      - { id: rrrStatus, label: RRR ACK or NAK, group: files, source: "step:answer.read-ack.outcome", format: status, oldScreen: "Refund cycle dashboard, RRR acknowledgement" }
    columns: [dcrStatus, rrrStatus]
    filters:
      - { field: dcrStatus, match: exact }
      - { field: rrrStatus, match: exact }
    actions:
      - { action: resend, label: Send the file again, role: Operator, secondApprover: Supervisor, remarks: required }
  - leg: uae.wps.wf.refund-request-refuse.v1
    title: Refund request refused (RRR)
    selectBy: { direction: inward, kind: refund, steps: [answer] }
    fields:
      - { id: rrrSentAt, label: RRR sent at, source: "step:answer.send.at", format: datetime }
      - { id: rrrStatus, label: RRR ACK or NAK, source: "step:answer.read-ack.outcome", format: status, oldScreen: "Refund cycle dashboard, RRR NAK acknowledged" }
    columns: [rrrStatus]
  - leg: uae.wps.wf.inward-refuse.v1
    title: Payment file refused
    selectBy: { direction: inward, steps: [operations] }
    fields:
      - { id: refusal, label: Refusal review, source: "step:operations.outcome", format: status }
    actions:
      - { action: release, label: Release after repair, role: Operator, secondApprover: Supervisor, remarks: required, when: { hold: repair } }
      - { action: reject, label: Reject, role: Operator, remarks: required, when: { hold: repair } }
provenance:
  origin: factory
  status: provisional
  clauses: [CBUAE WPS responsibility guide 2018]
  note: The fields follow the source system's WPS operations screens and the provisional pack. Confirm the scheme's terms against the current CBUAE WPS rulebook.
