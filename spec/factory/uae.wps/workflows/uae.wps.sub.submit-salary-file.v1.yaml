kind: workflow
wfKind: subflow
name: uae.wps.sub.submit-salary-file.v1
release: 1.3.0
dsl: 1.0.0
title: Submit the salary file and read the acknowledgement
description: What the submit block does underneath. Encrypts the file for WPS, sends it, waits for the acknowledgement for as long as the calling step allows, and reads it. A file the encryption service refuses is never sent (Issue I-87, R-12-13). From 1.3.0 the send reads the encryption step's fact and sends the encrypted file where the bank's binding encrypted it, never the plain one (Issue I-266, R-09-182).
implements:
  activity: uae.wps.exchange.submit-salary-file.v1
exit:
  outcomes: [accepted, rejected, pending]
do:
  - id: encrypt
    call: p.protect.encrypt-file.v1
    handle:
      refused: { return: rejected }
  - id: send
    call: uae.wps.exchange.send-salary-file.v2
    handle:
      rejected: { return: rejected }
      unknown: { return: pending }
  - id: await-ack
    await:
      message: uae.wps.ack
      correlateBy: header.fileId
      family: sif
      onTimeout: { return: pending }
  - id: read-ack
    call: uae.wps.map.ack-in.v1
    handle:
      nak: { return: rejected }
  - return: accepted
provenance:
  origin: factory
  status: provisional
  clauses: [CBUAE WPS responsibility guide 2018]
  note: From public sources. Confirm against the current CBUAE WPS rulebook.
