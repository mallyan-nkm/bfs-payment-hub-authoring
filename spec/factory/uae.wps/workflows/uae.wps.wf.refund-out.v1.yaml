kind: workflow
wfKind: leg
name: uae.wps.wf.refund-out.v1
release: 1.0.0
dsl: 1.0.0
title: WPS refund request, bank as the employer's bank
description: Submits a refund request, waits for the acknowledgement and then for the settlement file, and credits the employer. A request process, not a payment.
direction: outward
implements:
  slot: scheme-leg
  of: [p.wf.request.v1]
entry:
  reads: [header, batch, "items[]"]
exit:
  writes: [status, facts.settlement, facts.posting, messages]
  outcomes: [settled, rejected, pending]
do:
  - id: render
    call: uae.wps.map.rfr-out.v1
    handle:
      unmappable: { end: rejected }
  - id: request
    call: uae.wps.exchange.request-refund.v1
    handle:
      rejected: { end: rejected }
      pending: { end: pending }
  - id: credit-employer
    call: p.post.accounting.v1
    handle:
      rejected: { end: pending }
      unknown: { end: pending }
  - end: settled
provenance:
  origin: factory
  status: provisional
  clauses: [CBUAE WPS responsibility guide 2018]
  note: From public sources. Waiting times are placeholders.
