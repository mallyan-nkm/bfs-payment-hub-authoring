kind: workflow
wfKind: leg
name: uae.wps.wf.agent-payment-in.v2
release: 2.2.0
dsl: 1.0.0
title: WPS payment file, bank as the agent
description: Waits for the supplementary file that pairs with the payment file, confirms receipt, waits for core banking's posting window, credits each employee and reports disbursement. Reports are exchanges that move no money. A credit whose outcome is unknown is asked about before the returns are decided. Credits that were refused go back to WPS in one returns file, after the disbursement file's ACK or its NAK; once WPS accepts it, the return is recorded. A partial return ends settled, a whole-file return ends returned. Release 2.1.0 lets the steps that may run again park for a business day when they fail, for an operator's retry, instead of ending the file (R-12-26, Issue I-125). They are the file checks, the receipt and disbursement files, the returns decision and file, and the return's posting. Release 2.2.0 fills its slot in p.wf.inward.v2 (scheme-leg@2), the inward lifecycle that takes the returns (owner's decision of 23 November 2026, Issue I-141, R-09-87).
direction: inward
implements:
  slot: scheme-leg
  of: [p.wf.inward.v2]
entry:
  reads: [header, batch, "items[]", ext.uae.wps, facts.disposition]
exit:
  writes: [status, facts.posting, facts.returns, messages]
  outcomes: [settled, rejected, returned, pending]
do:
  - id: supplement
    call: uae.wps.exchange.receive-supplement.v1
    policy: { replyTimeout: PT4H }
    handle:
      missing: { end: pending }
  - id: file-checks
    call: uae.wps.validate.payment-file.v1
    policy: { park: P1D }
    handle:
      reject: { end: pending }
  - id: render-receipt
    call: uae.wps.map.prc-out.v2
    policy: { park: P1D }
    handle:
      unmappable: { end: pending }
  - id: confirm-receipt
    call: uae.wps.exchange.confirm-receipt.v1
    handle:
      rejected: { end: pending }
      pending: { end: pending }
  # The credits wait for core banking's posting window (plan P2): the bank's hours, asked again until they open.
  - id: posting-window
    call: p.decide.await-posting-window.v1
    handle:
      closed: { end: pending }
  - forEach:
      in: "items[]"
      onItemFailure: continue
      do:
        - id: credit
          call: p.post.accounting.v1
          level: item
          handle:
            rejected: { continue: true }
            unknown:
              - id: verify-credit
                call: p.post.verify.v1
                level: item
                handle:
                  mismatch: { continue: true }
  - id: render-disbursement
    call: uae.wps.map.dif-out.v2
    policy: { park: P1D }
    handle:
      unmappable: { end: pending }
  - id: report-disbursement
    call: uae.wps.exchange.report-disbursement.v1
    handle:
      rejected: { continue: true }
      pending: { end: pending }
  - id: returns
    call: uae.wps.decide.returns.v2
    policy: { park: P1D }
    handle:
      unverified:
        - id: unverified-operations
          call: p.hold.repair.v1
          handle:
            rejected: { end: pending }
            expired: { end: pending }
        - end: pending
      returns:
        - id: render-returns
          call: uae.wps.map.rfa-out.v1
          policy: { park: P1D }
          handle:
            unmappable: { end: pending }
        - id: return-credits
          call: uae.wps.exchange.return-credits.v1
          handle:
            rejected:
              - id: returns-operations
                call: p.hold.repair.v1
                handle:
                  rejected: { end: pending }
                  expired: { end: pending }
              - end: pending
            pending: { end: pending }
        - id: record-return
          call: uae.wps.post.return.v1
          policy: { park: P1D }
          handle:
            rejected:
              - id: return-posting-operations
                call: p.hold.repair.v1
                handle:
                  rejected: { end: pending }
                  expired: { end: pending }
              - end: pending
            unknown:
              - id: return-posting-unknown-operations
                call: p.hold.repair.v1
                handle:
                  rejected: { end: pending }
                  expired: { end: pending }
              - end: pending
  # The disbursement file was refused: its returns went back, and the file stays with operations.
  - switch:
      by: { outcomeOf: report-disbursement }
      cases:
        rejected:
          - end: pending
  # No credit reached an employee and the whole amount went back.
  - switch:
      by: { decision: returnScope }
      cases:
        whole-file:
          - end: returned
  - end: settled
provenance:
  origin: factory
  status: provisional
  clauses: [CBUAE WPS responsibility guide 2018]
  note: From public sources. Items that fail to credit are reported in the disbursement file. A credit whose outcome is unknown is asked about before the returns are decided (Issue I-39). A credit the core system refused, or that the inquiry found not posted, is returned in one returns file (RFA); on ACK the return is recorded, on NAK it goes to operations. A partial return ends settled, a whole-file return ends returned (Issue I-40). Which credits are returned, and whether a payment file may have more than one returns file, still need the rulebook (D10). The supplementary file is held by reference; its map and the wait are to be confirmed.
