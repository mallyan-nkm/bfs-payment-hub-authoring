kind: workflow
wfKind: leg
name: uae.wps.wf.agent-payment-in.v1
release: 1.0.0
dsl: 1.0.0
title: WPS payment file, bank as the agent
description: Waits for the supplementary file that pairs with the payment file, confirms receipt, credits each employee and reports disbursement. Reports are exchanges that move no money.
direction: inward
implements:
  slot: scheme-leg
  of: [p.wf.inward.v1]
entry:
  reads: [header, batch, "items[]", ext.uae.wps, facts.disposition]
exit:
  writes: [status, facts.posting, messages]
  outcomes: [settled, rejected, returned, pending]
do:
  - id: supplement
    call: uae.wps.exchange.receive-supplement.v1
    policy: { replyTimeout: PT4H }
    handle:
      missing: { end: pending }
  - id: file-checks
    call: uae.wps.validate.payment-file.v1
    handle:
      reject: { end: pending }
  - id: render-receipt
    call: uae.wps.map.prc-out.v1
    handle:
      unmappable: { end: pending }
  - id: confirm-receipt
    call: uae.wps.exchange.confirm-receipt.v1
    handle:
      rejected: { end: pending }
      pending: { end: pending }
  - forEach:
      in: "items[]"
      onItemFailure: continue
      do:
        - id: credit
          call: p.post.accounting.v1
          level: item
          handle:
            rejected: { continue: true }
            unknown: { continue: true }
  - id: render-disbursement
    call: uae.wps.map.dif-out.v1
    handle:
      unmappable: { end: pending }
  - id: report-disbursement
    call: uae.wps.exchange.send-disbursement-file.v1
    handle:
      rejected: { end: pending }
      unknown: { end: pending }
  - end: settled
provenance:
  origin: factory
  status: provisional
  clauses: [CBUAE WPS responsibility guide 2018]
  note: From public sources. Items that fail to credit are reported in the disbursement file; the returns leg is planned. The supplementary file is held by reference; its map and the wait are to be confirmed.
