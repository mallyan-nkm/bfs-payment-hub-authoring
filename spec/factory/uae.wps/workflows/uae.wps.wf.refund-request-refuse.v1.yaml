kind: workflow
wfKind: leg
name: uae.wps.wf.refund-request-refuse.v1
release: 1.0.0
dsl: 1.0.0
title: WPS refund request refused
description: >-
  The platform refused a refund order (the earlier payment is not known, no rate, no funds to block, or the approver declined).
  The leg answers the refund request instruction with a refund request response that rejects its lines (RRR, camt.029), and
  waits for the acknowledgement. Nothing is returned and nothing is posted.
direction: inward
implements:
  slot: scheme-refuse
  of: [p.wf.refund.v1]
entry:
  reads: [header, batch, "items[]", facts.record, facts.reservation, facts.approval]
exit:
  writes: [status, messages]
  outcomes: [refused, pending]
do:
  - id: render-answer
    call: uae.wps.map.rrr-out.v1
    handle:
      unmappable: { end: pending }
  - id: answer
    call: uae.wps.exchange.answer-refund.v1
    handle:
      rejected: { end: pending }
      pending: { end: pending }
  - end: refused
provenance:
  origin: factory
  status: provisional
  clauses: [TransactHub source 666f1ee, WS_DIB_WPS_Inward_RRI v1.1]
  note: The source sends an RRR whose lines are REJECTED, with no DCR, when the RRI is rejected. Which reason code each refusal gives is not confirmed (Issue I-134).
