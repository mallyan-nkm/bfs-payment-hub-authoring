kind: workflow
wfKind: leg
name: uae.wps.wf.refund-request-in.v1
release: 1.0.0
dsl: 1.0.0
title: WPS refund request, bank as the agent
description: >-
  The scheme side of a refund order the platform has approved and posted. Returns the funds of the lines to WPS in a disbursement
  cancellation request (DCR, pacs.004) and waits for its acknowledgement, then answers the refund request instruction with the
  refund request response (RRR, camt.029) and waits for its acknowledgement. The leg moves no money: the block, the approval and
  the posting are the platform's (p.wf.refund.v1).
direction: inward
implements:
  slot: scheme-leg
  of: [p.wf.refund.v1]
entry:
  reads: [header, batch, "items[]", facts.fx, facts.posting, facts.record, facts.reservation, facts.approval]
exit:
  writes: [status, messages]
  outcomes: [settled, rejected, pending]
do:
  - id: render-return
    call: uae.wps.map.dcr-out.v1
    handle:
      unmappable: { end: pending }
  - id: return-funds
    call: uae.wps.exchange.return-refund.v1
    handle:
      rejected: { end: rejected }
      pending: { end: pending }
  - id: render-answer
    call: uae.wps.map.rrr-out.v1
    handle:
      unmappable: { end: pending }
  - id: answer
    call: uae.wps.exchange.answer-refund.v1
    handle:
      rejected: { end: pending }
      pending: { end: pending }
  - end: settled
provenance:
  origin: factory
  status: provisional
  clauses: [TransactHub source 666f1ee, WS_DIB_WPS_Inward_RRI v1.1]
  note: >-
    After the source's RRI flow (Activities 9 to 14): the DCR is sent for the lines posted and the RRR once the DCR is
    acknowledged. The source regenerates a DCR that WPS refuses and resends a refused RRR; here a refusal goes to the platform's
    review (Issue I-134). The layouts and the waits are the source's, not the rulebook's.
