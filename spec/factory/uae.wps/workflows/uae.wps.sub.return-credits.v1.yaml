kind: workflow
wfKind: subflow
name: uae.wps.sub.return-credits.v1
release: 1.3.0
dsl: 1.0.0
title: Send the returns file and read the acknowledgement
description: What the return-credits block does underneath. Holds the upload for the bank's upload hold, sends the returns file, waits for the acknowledgement of the returns file for the bank's reply wait (by default thirty calendar days, the source's), and reads it. An ACK accepts the returns file; a NAK refuses it. The file is encrypted for WPS before it is sent, and a file the encryption service refuses is never sent (Issue I-117, R-12-17). From 1.3.0 the send reads the encryption step's fact and sends the encrypted file where the bank's binding encrypted it, never the plain one (Issue I-293, R-09-232).
implements:
  activity: uae.wps.exchange.return-credits.v1
exit:
  outcomes: [accepted, rejected, pending]
do:
  - id: upload-hold
    wait: { parameter: uploadHold }
  - id: encrypt
    call: p.protect.encrypt-file.v1
    handle:
      refused: { return: rejected }
  - id: send
    call: uae.wps.exchange.send-returns-file.v2
    handle:
      rejected: { return: rejected }
      unknown: { return: pending }
  - id: await-ack
    await:
      message: uae.wps.ack
      correlateBy: header.fileId
      family: rfa
      onTimeout: { return: pending }
  - id: read-ack
    call: uae.wps.map.ack-in.v1
    handle:
      nak: { return: rejected }
  - return: accepted
provenance:
  origin: factory
  status: provisional
  clauses: [CBUAE WPS responsibility guide 2018]
  note: From public sources. The acknowledgement of the returns file is told from the receipt confirmation's by its family, read from the acknowledged file's name (Issue I-41). The wait and the upload hold are the bank's values, with the source's as defaults.
