kind: workflow
wfKind: leg
name: uae.wps.wf.salary-file-out.v1
release: 1.2.0
dsl: 1.0.0
title: WPS salary file, bank as the employer's bank
description: Sets the business date, asks the labour ministry for the employer's status, validates the file and each record, and submits the file to WPS. The submit step is a composite. It sends, waits for the acknowledgement and reads it. Release 1.2.0 lets the steps that may run again park for a business day when they fail, for an operator's retry, instead of ending the file (R-12-26, Issue I-125). They are the business date, the employer's status, the file checks and the render.
direction: outward
implements:
  slot: scheme-leg
  of: [p.wf.corporate.v1]
entry:
  reads: [header, batch, "items[]", ext.uae.wps, facts.reservation]
exit:
  writes: [status, messages]
  outcomes: [settled, rejected, returned, pending]
do:
  - id: business-date
    call: uae.p.enrich.business-date.v1
    policy: { park: P1D }
  - id: employer-status
    call: uae.wps.enrich.employer-status.v1
    policy: { park: P1D }
    handle:
      not-found: { continue: true }
  - id: file-checks
    call: uae.wps.validate.salary-file.v1
    policy: { park: P1D }
    handle:
      repair: { end: rejected }
      reject: { end: rejected }
  - forEach:
      in: "items[]"
      onItemFailure: stop
      do:
        - id: record-checks
          call: uae.wps.validate.salary-record.v1
          level: item
          handle:
            reject: { end: rejected }
        - id: record-iban
          call: uae.p.validate.iban.v1
          level: item
          handle:
            reject: { end: rejected }
  - id: render
    call: uae.wps.map.sif-out.v1
    policy: { park: P1D }
    handle:
      unmappable: { end: rejected }
  - id: submit
    call: uae.wps.exchange.submit-salary-file.v1
    handle:
      rejected: { end: rejected }
      pending: { end: pending }
  - end: settled
provenance:
  origin: factory
  status: provisional
  clauses: [CBUAE WPS responsibility guide 2018]
  note: From public sources. Confirm against the current CBUAE WPS rulebook.
