title: Control total equals the sum of fixed and variable pay
ruleKind: cross-field
level: batch
repeatability: non-repeatable
when:
  - match:
      fact: Batch
      as: b
  - query:
      as: items
      match:
        fact: Item
        where: item.batchId == b.id
      collect: true
  - let:
