kind: workflow
wfKind: subflow
name: uae.aani.sub.submit-credit.v1
release: 1.0.0
dsl: 1.0.0
title: Send the credit transfer and learn its outcome
description: What the send block does underneath. A pending reply waits for the status report. An unknown outcome leads to a status inquiry with the original ids, never to a second send.
implements:
  activity: uae.aani.exchange.submit-credit.v1
exit:
  outcomes: [accepted, rejected, pending]
do:
  - id: send
    call: uae.aani.exchange.send-credit.v1
    handle:
      rejected: { return: rejected }
      pending:
        - id: await-status
          await:
            message: uae.aani.status-report
            correlateBy: header.endToEndId
            onTimeout: { return: pending }
        - id: read-status
          call: uae.aani.map.status-in.v1
          handle:
            rejected: { return: rejected }
            pending: { return: pending }
        - return: accepted
      unknown:
        - loop:
            max: 3
            every: PT2S
            until: { outcomeOf: inquire, in: [accepted, rejected] }
            do:
              - id: inquire
                call: uae.aani.exchange.inquire-status.v1
                handle:
                  rejected: { continue: true }
                  pending: { continue: true }
                  unknown: { continue: true }
        - switch:
            by: { outcomeOf: inquire }
            cases:
              accepted:
                - return: accepted
              rejected:
                - return: rejected
            default:
              - return: pending
  - return: accepted
provenance:
  origin: factory
  status: provisional
  note: Message set not public. The waits and the number of inquiries are placeholders. Confirm against the AEP participant specification.
