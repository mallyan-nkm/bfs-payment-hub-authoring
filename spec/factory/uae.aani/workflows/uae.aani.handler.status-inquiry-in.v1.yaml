kind: workflow
wfKind: handler
name: uae.aani.handler.status-inquiry-in.v1
release: 1.0.0
dsl: 1.0.0
title: Aani status inquiry, inward
description: Answers a status request about a payment we hold. Reads the payment record; never wakes the payment's workflow.
direction: inward
exit:
  outcomes: [answered, invalid]
do:
  - id: read-request
    call: uae.aani.map.status-request-in.v1
    handle:
      unmappable: { end: invalid }
  - id: find
    call: p.enrich.payment-record.v1
    handle:
      not-found: { continue: true }
  - id: render
    call: uae.aani.map.status-out.v1
    handle:
      unmappable: { end: invalid }
  - id: answer
    call: uae.aani.exchange.respond-status.v1
  - end: answered
provenance:
  origin: factory
  status: provisional
  note: Confirm the status request and report messages against the AEP participant specification.
