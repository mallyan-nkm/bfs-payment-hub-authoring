name: uae.aani.handler.proxy-lookup.v1
release: 1.0.0
dsl: 1.0.0
title: Aani proxy lookup for a channel
description: A channel asks who is behind a mobile number or email before the payer confirms. Stateless.
exit:
  outcomes: [resolved, not-found]
do:
  - id: resolve
    call: uae.aani.enrich.proxy-resolve.v1
    handle:
      not-found: { end: not-found }
  - end: resolved
provenance:
  origin: factory
  status: provisional
  note: Assumes the channel resolves the proxy before it submits the payment order, so screening sees the resolved creditor.
