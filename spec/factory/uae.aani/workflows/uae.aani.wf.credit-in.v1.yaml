kind: workflow
wfKind: leg
name: uae.aani.wf.credit-in.v1
release: 1.0.0
dsl: 1.0.0
title: Aani credit transfer, inward
description: Scheme checks, credit the account, answer the scheme. The leg answers on every path it can.
direction: inward
synchronous: true
implements:
  slot: scheme-leg
  of: [p.wf.inward.v1]
entry:
  reads: [header, payment, facts.disposition]
exit:
  writes: [status, facts.posting, messages]
  outcomes: [settled, rejected, returned, pending]
deadline:
  after: PT5S
  do:
    - end: pending
do:
  - id: scheme-checks
    call: uae.aani.validate.credit.v1
    handle:
      reject:
        - id: render-refusal
          call: uae.aani.map.status-out.v1
          handle:
            unmappable: { end: pending }
        - id: answer-refusal
          call: uae.aani.exchange.respond-status.v1
        - end: rejected
  - id: credit
    call: p.post.accounting.v1
    policy: { attemptTimeout: PT2S, totalTimeout: PT4S, retry: { maxAttempts: 2, firstInterval: PT1S } }
    handle:
      rejected:
        - id: render-credit-refusal
          call: uae.aani.map.status-out.v1
          handle:
            unmappable: { end: pending }
        - id: answer-credit-refusal
          call: uae.aani.exchange.respond-status.v1
        - end: rejected
      unknown: { end: pending }
  - id: render-acceptance
    call: uae.aani.map.status-out.v1
    handle:
      unmappable: { end: pending }
  - id: answer
    call: uae.aani.exchange.respond-status.v1
  - end: settled
provenance:
  origin: factory
  status: provisional
  note: Whether the bank answers before or after crediting, and the time limit, are scheme rules. Confirm against the AEP participant specification.
