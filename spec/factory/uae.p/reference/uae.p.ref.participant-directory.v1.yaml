# Written by hand (spec/CLAUDE.md, "Generated files"): reference data, effective-dated (R-01-25). A new edition is a new minor release.
kind: reference-table
name: uae.p.ref.participant-directory.v1
release: 1.0.0
title: The licensed banks of the UAE, the scheme participant directory
description: 'The Central Bank''s register of licensed banks, as published. The register gives each bank''s name, licence
  type and category, head office and identification number. It gives no UAEFTS routing code: the platform vendor fills routingCode
  row by row from the scheme''s participant list in a later edition (Issue I-130). The one code filled is the only one the
  TransactHub source holds. uae.wps.table.participant-names.v1 reads a bank''s name by its routing code from here (R-11-51).'
domain: participant-directory
key:
  - identificationNumber
columns:
  - id: identificationNumber
    type: code
    title: Identification number
    required: true
    pattern: ^\d{2}\.\d{2}\.\d{2}\.\d{3}\.\d{4}\.\d{2}$
  - id: registerNo
    type: number
    title: Number in the register
    required: true
  - id: name
    type: text
    title: Institution name
    required: true
  - id: licenceType
    type: code
    title: Licence type
    required: true
    allowed:
      - national
      - foreign
  - id: licenceCategory
    type: code
    title: Licence category
    required: true
    allowed:
      - conventional-retail
      - islamic-retail
      - conventional-wholesale
      - conventional-investment
      - conventional-specialized
      - islamic-specialized
  - id: headOffice
    type: code
    title: Head office
    required: true
    references: uae.p.ref.emirates.v1
  - id: routingCode
    type: code
    title: UAEFTS routing code
    pattern: ^[0-9]{9}$
    maintainedBy: the platform vendor, from the scheme's participant list
source:
  publisher: Central Bank of the UAE
  title: CB Register as of October 2026, Banks
  url: https://centralbank.ae/media/ffco0wgo/cb-register-oct-2026.pdf
  public: true
  retrieved: '2026-11-23'
  note: Rows 1 to 63 of the Banks section, pages 1 to 6, each checked against the PDF. The routing code of row 24 is from
    the TransactHub source's WPS parameter migration (ReseedWpsParametersWithIdentityIds), not from the register.
