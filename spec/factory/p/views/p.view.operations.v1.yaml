kind: operations-view
name: p.view.operations.v1
release: 1.6.0
title: Platform operations view
description: >-
  What every payment shows an operator, whatever its scheme: where it is in the platform's lifecycle (checks, screening,
  reservation, route, posting, notification), its hold, and the actions the platform's workflows can take while it runs.
  A scheme's own view (for example uae.wps.view.operations.v1) adds the fields of its legs. Release 1.1.0 adds the posting's
  amount with charges, its charge and VAT and its legs, from the posting fact (camt.054 entries and ChrgsInf), and the payment's end and
  duration, from its payment.end fact (Issues I-97, I-100). Release 1.2.0 adds the refund order (p.wf.refund.v1): the earlier
  payment it refers to, its FX and its charges, from the platform's own steps; its approval shows in the hold fields (R-12-22).
  Release 1.3.0 adds the outward refund order (p.wf.refund-out.v1) and brings back the order's approval: on every engine a hold's
  decision is now a step fact of the hold's step, with who decided and when (R-05-60, Issue I-136). Its actions say which platform
  workflows they apply to: re-screen only where the payment is screened (R-05-61, Issue I-135). Release 1.4.0 declares the
  console's dials a bank sets in its configuration release: the turnaround limit of a payment, how long an unmasked value is
  shown once a bank approver consented, and how long an ended payment is kept before it is due for erasure (R-05-66 to R-05-70).
  Each default switches its mechanism off, so no period is the runtime's own. Release 1.5.0 shows the inward lifecycle
  p.wf.inward.v2 in place of v1, which WPS's inward legs fill from factory release 1.9.0 (Issue I-141), and offers requeue for a
  dead-lettered step on every engine (R-09-91). Release 1.6.0 counts the turnaround limit in business days of the bank's business
  calendar, its own closing days included, as a hold's expiry is counted (owner's decision of 23 November 2026, R-05-81).
platform: [p.wf.corporate.v1, p.wf.inward.v2, p.wf.refund.v1, p.wf.refund-out.v1]
parameters:
  # R-05-68, R-05-81: a payment open, or that ended, longer than this after its acceptance is in breach; each whole day is a business
  # day of the bank's calendar, its closing days included, and the time part elapsed time. P0D: no limit. A scheme's view may set its own.
  tatLimit: { type: duration, default: P0D, bounds: { min: P0D, max: P30D }, lookupDate: payment-date, description: "The turnaround limit, from acceptance to the payment's end, each whole day a business day of the bank's calendar. P0D sets no limit." }
  # R-05-69: how long the person who asked sees an unmasked value after a bank approver consented. P0D: unmasking is off.
  unmaskWindow: { type: duration, default: P0D, bounds: { min: P0D, max: PT4H }, lookupDate: step-time, description: "How long an unmasked value is shown to the person who asked, from the bank approver's consent. P0D turns unmasking off." }
  # R-05-70: how long a payment is kept after its end before it is due for erasure. P0D: nothing is ever due.
  retentionPeriod: { type: duration, default: P0D, bounds: { min: P0D, max: P36600D }, lookupDate: step-time, description: "How long an ended payment is kept before it is due for erasure. P0D keeps every payment." }
subject:
  title: Payment
  groups:
    - { id: lifecycle, title: Lifecycle }
    - { id: posting, title: Posting }
    - { id: hold, title: Hold }
    - { id: order, title: Refund order }
  fields:
    - { id: status, label: Status, group: lifecycle, source: subject.status, format: status }
    - { id: lastStep, label: Last step, group: lifecycle, source: subject.lastStep, format: code }
    - { id: lastOutcome, label: Last outcome, group: lifecycle, source: subject.lastOutcome, format: status }
    - { id: validation, label: Payment checks, group: lifecycle, source: "step:validate.outcome", format: status }
    - { id: duplicate, label: Duplicate check, group: lifecycle, source: "step:duplicate.outcome", format: status }
    - { id: sanctions, label: Sanctions screening, group: lifecycle, source: "step:sanctions.outcome", format: status }
    - { id: fraud, label: Fraud screening, group: lifecycle, source: "step:fraud.outcome", format: status }
    - { id: limits, label: Limits, group: lifecycle, source: "step:limits.outcome", format: status }
    - { id: reservation, label: Funds reservation, group: lifecycle, source: "step:reserve.outcome", format: status }
    - { id: rail, label: Rail, group: lifecycle, source: "step:route.writes.facts.route.rail", format: code }
    - { id: posting, label: Posting, group: lifecycle, source: "step:post.outcome", format: status }
    - { id: postedAt, label: Posted at, group: lifecycle, source: "step:post.at", format: datetime }
    - { id: postingVerified, label: Posting verified, group: lifecycle, source: "step:verify.outcome", format: status }
    - { id: postingTotal, label: Total debited, group: posting, source: "step:post.writes.facts.posting.totalAmount", format: amount, oldScreen: "Integration 360, Total Transaction Amount" }
    - { id: chargeAmount, label: Charge, group: posting, source: "step:post.writes.facts.posting.charges.amount", format: amount, oldScreen: "Integration 360, Charge Amount" }
    - { id: vatAmount, label: VAT, group: posting, source: "step:post.writes.facts.posting.charges.tax.amount", format: amount, oldScreen: "Integration 360, VAT" }
    - { id: postingLegs, label: Posting legs, group: posting, source: "step:post.writes.facts.posting.entries", format: json, oldScreen: "Integration 360, CORE posting, legs (D/C, account masked, amount, currency, branch, type code)" }
    - { id: notified, label: Channel notified, group: lifecycle, source: "step:notify.outcome", format: status }
    - { id: release, label: Release, group: lifecycle, source: subject.releaseId, format: code }
    - { id: endedAt, label: Ended at, group: lifecycle, source: subject.endedAt, format: datetime }
    - { id: endOutcome, label: End, group: lifecycle, source: subject.endOutcome, format: status }
    - { id: duration, label: Duration, group: lifecycle, source: subject.duration, format: code, oldScreen: "WPS dashboard, Recent transactions, duration (derived: the end less the acceptance)" }
    - { id: originalPaymentId, label: Earlier payment, group: order, source: header.originalPaymentId, format: code, oldScreen: "Refund cycle dashboard, the payroll file a refund line names" }
    - { id: originalFound, label: Earlier payment found, group: order, source: "step:original.outcome", format: status }
    - { id: fx, label: FX, group: order, source: "step:fx.outcome", format: status }
    - { id: fxRate, label: Exchange rate, group: order, source: "step:fx.writes.facts.fx.rate", format: text, oldScreen: "RRI posting, Exchange rate" }
    - { id: fxAmount, label: Converted amount, group: order, source: "step:fx.writes.facts.fx.amount", format: amount, oldScreen: "RRI posting, the exchange-rate-adjusted amount" }
    - { id: fxCurrency, label: Converted into, group: order, source: "step:fx.writes.facts.fx.currency", format: code }
    - { id: refundCharges, label: Charges, group: order, source: "step:charges.outcome", format: status }
    - { id: refundCharge, label: Charge on the order, group: order, source: "step:charges.writes.facts.charges.amount", format: amount }
    - { id: refundChargeVat, label: VAT on the charge, group: order, source: "step:charges.writes.facts.charges.tax.amount", format: amount }
    - { id: refundChargeTotal, label: Charge and VAT, group: order, source: "step:charges.writes.facts.charges.totalChargesAndTaxAmount", format: amount }
    - { id: approval, label: Approval, group: order, source: "step:approval.outcome", format: status, oldScreen: "Refund cycle dashboard, maker and checker verification" }
    - { id: approvalBy, label: Decided by, group: order, source: "step:approval.writes.facts.approval.by", oldScreen: "Refund cycle dashboard, checker" }
    - { id: approvalAt, label: Decided at, group: order, source: "step:approval.writes.facts.approval.at", format: datetime }
    - { id: holdStatus, label: Hold, group: hold, source: hold.status, format: status }
    - { id: holdKind, label: Hold kind, group: hold, source: hold.kind, format: code }
    - { id: holdReason, label: Held because, group: hold, source: hold.reason }
    - { id: heldAt, label: Held at, group: hold, source: hold.openedAt, format: datetime }
    - { id: decision, label: Decision, group: hold, source: hold.decision, format: status }
    - { id: approvedBy, label: Approved by, group: hold, source: hold.decidedBy, oldScreen: "SIF Summary 360, File Details, Approved By" }
    - { id: approvedAt, label: Approved at, group: hold, source: hold.decidedAt, format: datetime, oldScreen: "SIF Summary 360, File Details, Approved DateTime" }
  columns: [status, holdStatus, holdReason]
  filters:
    - { field: sanctions, match: exact }
    - { field: posting, match: exact }
    - { field: rail, match: exact }
    - { field: fx, match: exact }
    - { field: approval, match: exact }
  actions:
    - { action: approve, label: Approve, role: Operator, remarks: optional, when: { hold: approval } }
    - { action: decline, label: Decline, role: Operator, remarks: required, when: { hold: approval } }
    # A repair item released or rejected: dual control, as the source's business exceptions were (Mark as Success).
    - { action: release, label: Release after repair, role: Operator, secondApprover: Supervisor, remarks: required, when: { hold: repair } }
    - { action: reject, label: Reject, role: Operator, remarks: required, when: { hold: repair } }
    - { action: cancel, label: Cancel, role: Operator, secondApprover: Supervisor, remarks: required }
    # Only the workflows that screen take re-screen (R-05-61, Issue I-135); a refund order has no screening step.
    - { action: re-screen, label: Screen again, role: Operator, remarks: required, when: { workflow: [p.wf.corporate.v1, p.wf.inward.v2] } }
    # A step that parked (the refund order's posting, R-05-55) is tried once more on an operator's retry.
    - { action: retry, label: Retry the parked step, role: Operator, remarks: required }
    # A step whose attempts are spent (dead-lettered: parked, or a Flowable dead-letter job) is requeued with its full retry policy,
    # on every engine, once per action (R-09-91).
    - { action: requeue, label: Requeue the dead-lettered step, role: Operator, remarks: required }
provenance:
  origin: factory
  status: confirmed
