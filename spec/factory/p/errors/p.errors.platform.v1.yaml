kind: error-dictionary
name: p.errors.platform.v1
release: 1.10.0
title: Platform error dictionary
description: 'Every error the platform''s activities, rules and ports can raise, the interpreter and the four engine bindings,
  and the runtime beneath them: the store, the read model, signing and packages, the package source, authentication, the operations
  console, the service console and its assistant (R-05-51, R-05-52).'
entries:
  - code: BusinessReject
    title: A business rule refused the step
    category: business
    retryable: false
    raisedBy:
      - activity
      - native
      - interpreter
    meaning: The activity ran and refused the payment for a business reason. The attempt is not retried.
    causes:
      - The payment's data breaks a rule (a missing account, a template value not set).
      - A bank's configuration value is missing or out of its bounds.
    runbook:
      checks:
        - Read the step's reason code and message on the payment's timeline.
        - Check the bank's configuration values in force on the payment's date.
      safeActions:
        - Do not retry. Correct the data or the configuration, then let the operator decide the payment.
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
  - code: TransientError
    title: A temporary failure; the engine retries
    category: technical
    retryable: true
    raisedBy:
      - activity
      - port
      - native
      - interpreter
    meaning: 'The activity or the port could not finish for a reason that may pass: the party did not answer, a window was
      closed. The engine retries within the step''s policy.'
    causes:
      - The party behind the port is down or slow.
      - A posting window of core banking is closed.
      - The network between the worker and the party is interrupted.
    runbook:
      checks:
        - Check the port's health on the service console's Health page.
        - 'Check the attempts on the payment''s timeline: how many, how far apart.'
      safeActions:
        - Wait for the engine's retries.
        - If the retries are spent, retry the attempt once the party answers again.
      actions:
        - retry-attempt
        - redrive-workflow
      escalation: Escalate to the runtime's service team with the payment id, the engine and the trace id.
  - code: Timeout
    title: An attempt timed out
    category: technical
    retryable: true
    raisedBy:
      - interpreter
      - port
      - engine:temporal
      - engine:dtfx
      - engine:flowable
      - engine:elsa
    meaning: An attempt did not finish within the step's attempt timeout. A late result is ignored.
    causes:
      - The party is slow.
      - The worker is overloaded.
      - On a real Temporal server, processing time spends the attempt timeout (Issue I-77).
    runbook:
      checks:
        - Check the worker's health and version.
        - Check the port's latency on the Ports dashboard.
      safeActions:
        - Wait for the engine's retries.
        - Drain a worker that is overloaded.
      actions:
        - retry-attempt
        - drain-worker
      escalation: Escalate to the runtime's service team with the payment id, the engine and the trace id.
  - code: RetriesExhausted
    title: The step's retries are spent
    category: technical
    retryable: false
    raisedBy:
      - interpreter
      - engine:temporal
      - engine:dtfx
      - engine:flowable
      - engine:elsa
    meaning: Every attempt the step's policy allows failed with a retryable error. The step fails and the payment stops at
      it.
    causes:
      - The party was down for longer than the policy's total timeout.
      - A configuration error that looks transient (a wrong host).
    runbook:
      checks:
        - Read the last attempt's error on the payment's timeline.
        - Check the port's health and its binding.
      safeActions:
        - Fix the cause first.
        - Then re-drive the workflow from the failed step.
      actions:
        - redrive-workflow
        - retry-attempt
        - requeue-dead-letter
        - reset-activity
      escalation: Escalate to the runtime's service team with the payment id, the engine and the trace id.
  - code: Failure
    title: The interpreter could not run a step
    category: technical
    retryable: false
    raisedBy:
      - interpreter
    meaning: 'The interpreter stopped a step for a reason that is not the activity''s: an artefact that does not resolve,
      an outcome no handler takes, an unknown step.'
    causes:
      - The package is incomplete or was built from an inconsistent branch.
      - A published artefact was edited (never allowed).
    runbook:
      checks:
        - Re-verify the package the payment is pinned to.
        - Check the studio's checks (L03, L05) on the release.
      safeActions:
        - Do not retry. Re-verify the package; if it is wrong, roll back to the previous release.
      actions:
        - reverify-package
      escalation: Escalate to the runtime's service team with the payment id, the engine and the trace id.
  - code: BadDecision
    title: A hold received a decision it does not take
    category: technical
    retryable: false
    raisedBy:
      - native
    meaning: The operations-queue port was given a decision that is not one of the hold's outcomes.
    causes:
      - A decision was written by hand or by an older console.
    runbook:
      checks:
        - Read the hold's facts on the payment's chain.
      safeActions:
        - Release the hold again with a decision it takes.
      actions:
        - release-hold
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
  - code: NoTenant
    title: The attempt names no tenant
    category: technical
    retryable: false
    raisedBy:
      - native
    meaning: Core banking is bound per tenant; an attempt that names no tenant cannot be routed.
    causes:
      - The front door or the engine binding did not carry the tenant.
    runbook:
      checks:
        - Check the payment's tenant and the package's manifest.
      safeActions:
        - Do not retry. Correct the deployment, then re-drive the workflow.
      actions:
        - redrive-workflow
      escalation: Escalate to the runtime's service team with the payment id, the engine and the trace id.
  - code: TenantMissing
    title: A hold's attempt names no tenant
    category: technical
    retryable: false
    raisedBy:
      - native
    meaning: A hold answered by the runtime needs the tenant to find the payment.
    causes:
      - The engine binding did not carry the tenant to the native host.
    runbook:
      checks:
        - Check the native host's settings and the attempt's header.
      safeActions:
        - Do not retry until the deployment carries the tenant.
      escalation: Escalate to the runtime's service team with the payment id, the engine and the trace id.
  - code: NotInStore
    title: The payment is not in the store
    category: technical
    retryable: false
    raisedBy:
      - native
    meaning: A hold could not find its payment in the store by the header's ids.
    causes:
      - The payment was accepted by another runtime's store.
      - The header's file id or end-to-end id does not match (Issue I-98).
    runbook:
      checks:
        - Search the operations console for the file id and the end-to-end id.
      safeActions:
        - Do not retry. Correct the store setting of the native host.
      escalation: Escalate to the runtime's service team with the payment id, the engine and the trace id.
  - code: PortNotBound
    title: No binding for a port
    category: technical
    retryable: false
    raisedBy:
      - native
      - port
    meaning: The port has no binding for the tenant at the attempt's time.
    causes:
      - The configuration release with the binding is not installed, or its validFrom is later.
      - The binding names a setting that is not there.
    runbook:
      checks:
        - Check the bank's bindings in force on the Content page.
        - Check the binding's validFrom.
      safeActions:
        - Install the configuration release that binds the port, then re-drive the workflow.
      actions:
        - redrive-workflow
      escalation: Escalate to the runtime's service team with the payment id, the engine and the trace id.
  - code: SecretUnavailable
    title: A secret could not be read
    category: technical
    retryable: false
    raisedBy:
      - native
      - port
      - package-source
      - signing
    meaning: A secret named by reference by reference could not be read. Its value is never shown.
    causes:
      - The environment variable or file is not there.
      - The secret store is sealed, or the token has expired.
    runbook:
      checks:
        - Check the reference named in the message (never the value).
        - Check the secret store's health.
      safeActions:
        - Restore the secret at its source, then retry the attempt.
      actions:
        - retry-attempt
      escalation: Escalate to the bank's security officer and the runtime's service team. Do not install or activate anything
        until it is explained.
  - code: temporal.ServerUnreachable
    title: The Temporal server does not answer
    category: technical
    retryable: true
    raisedBy:
      - engine:temporal
    meaning: The Temporal front end could not be reached by a worker or the front door.
    causes:
      - The Temporal server or its database is down.
      - The network or TLS settings changed.
    runbook:
      checks:
        - Check the Temporal server's health on the Health page.
        - Check the Temporal persistence database.
      safeActions:
        - Wait for the server. Workers reconnect by themselves.
      actions:
        - restart-worker
      escalation: Escalate to the runtime's service team with the payment id, the engine and the trace id.
  - code: temporal.WorkflowTaskFailed
    title: A Temporal workflow task failed
    category: technical
    retryable: true
    raisedBy:
      - engine:temporal
    meaning: The interpreter workflow failed a workflow task; Temporal retries the task.
    causes:
      - A non-deterministic change in a worker build.
      - A worker of another distribution took the task.
    runbook:
      checks:
        - Check the worker's version and build id against the payment's distribution.
      safeActions:
        - Drain the wrong worker; reset the activity when the right worker runs.
      actions:
        - drain-worker
        - reset-activity
      escalation: Escalate to the runtime's service team with the payment id, the engine and the trace id.
  - code: dtfx.OrchestrationFailed
    title: A Durable Task orchestration failed
    category: technical
    retryable: false
    raisedBy:
      - engine:dtfx
    meaning: The DTFx orchestration of the interpreter ended failed.
    causes:
      - An activity failure the policy did not retry.
      - The DTFx storage is not reachable.
    runbook:
      checks:
        - Check the DTFx host's health and its storage.
      safeActions:
        - Fix the cause, then re-drive the workflow.
      actions:
        - redrive-workflow
      escalation: Escalate to the runtime's service team with the payment id, the engine and the trace id.
  - code: flowable.Unreachable
    title: The Flowable REST server does not answer
    category: technical
    retryable: true
    raisedBy:
      - engine:flowable
    meaning: The Flowable binding could not reach the Flowable REST server.
    causes:
      - The Flowable server or its database is down.
      - Its credentials changed.
    runbook:
      checks:
        - Check the Flowable engine's health on the Health page.
      safeActions:
        - Wait for the server; the external worker polls again.
      escalation: Escalate to the runtime's service team with the payment id, the engine and the trace id.
  - code: flowable.DeadLetterJob
    title: A Flowable job is in the dead-letter queue
    category: technical
    retryable: false
    raisedBy:
      - engine:flowable
    meaning: A job's retries are spent and Flowable moved it to the dead-letter jobs.
    causes:
      - An external task failed every retry.
      - A timer job failed.
    runbook:
      checks:
        - List the dead-letter jobs of the tenant.
        - Read the job's exception message.
      safeActions:
        - Fix the cause, then requeue the dead-letter job.
      actions:
        - requeue-dead-letter
      escalation: Escalate to the runtime's service team with the payment id, the engine and the trace id.
  - code: th:nonRetryable
    title: A BPMN error the binding throws for a non-retryable failure
    category: technical
    retryable: false
    raisedBy:
      - engine:flowable
    meaning: The Flowable binding ended an external job with a BPMN error because the activity's error is not retryable.
    causes:
      - The activity raised an error its policy does not retry.
    runbook:
      checks:
        - Read the activity's error on the payment's timeline.
      safeActions:
        - Treat it as the activity's error; follow that error's runbook.
      escalation: Escalate to the runtime's service team with the payment id, the engine and the trace id.
  - code: elsa.WorkflowFaulted
    title: An Elsa workflow instance faulted
    category: technical
    retryable: false
    raisedBy:
      - engine:elsa
    meaning: The Elsa workflow instance of the interpreter faulted.
    causes:
      - An activity failure the policy did not retry.
      - The Elsa persistence is not reachable.
    runbook:
      checks:
        - Check the Elsa host's health.
      safeActions:
        - Fix the cause, then re-drive the workflow.
      actions:
        - redrive-workflow
      escalation: Escalate to the runtime's service team with the payment id, the engine and the trace id.
  - code: store.InsertOnlyViolation
    title: A change to an insert-only row was refused
    category: technical
    retryable: false
    raisedBy:
      - store
    meaning: 'The store refused to update or delete a row: every table is insert-only.'
    causes:
      - A code path or a person tried to change history.
    runbook:
      checks:
        - Find the caller in the host's log by the trace id.
      safeActions:
        - Do nothing to the store. Record a new fact instead.
      escalation: Escalate to the bank's security officer and the runtime's service team. Do not install or activate anything
        until it is explained.
  - code: distribution.ActivationRaced
    title: Another activation of the bank was recorded first
    category: technical
    retryable: false
    raisedBy:
      - store
      - service-console
    meaning: Two activations of one bank in one environment were asked for at once. The store's unique key on the activation's
      number let the first one in and refused the second (R-09-137). Nothing of the second was recorded, so no distribution was
      drained for it.
    causes:
      - Two bank approvers consented to activations of the same bank at the same moment.
      - The pipeline and the service console activated the same bank in the same environment together.
    runbook:
      checks:
        - Read the distribution active now on the Content page, and the activation that was recorded first.
        - Check whether the activation that was refused is still wanted, now that another distribution is active.
      safeActions:
        - Do not retry the refused action as it was. Ask again for the activation from the distribution active now, and have a
          bank approver consent again.
      escalation: Escalate to the runtime's service team with both activations' times and who asked for them.
  - code: port.CircuitOpen
    title: A circuit breaker is open; the call was not sent
    category: technical
    retryable: true
    raisedBy:
      - port
      - native
      - service-console
    meaning: The production adapter's circuit breaker for one outside system (R-09-155) is open after failures in a row, so the call
      was refused before anything was sent. The step is retried as a party that does not answer is; the breaker lets one trial call
      through once its open period is over.
    causes:
      - The outside system behind the port (a gateway, a broker, an SFTP partner) is down or refuses every call.
      - The bank's binding of the port names a host, a port or a credential that no longer works.
    runbook:
      checks:
        - Find the failing system in the detail of the probe circuit-breakers on the service console's Health page (port, adapter and target).
        - Check that system's own health, and the bank's binding of the port in force.
      safeActions:
        - Mend the outside system or the bank's binding, then wait for the breaker's trial call; it closes on the first call that succeeds.
        - Do not change a payment. Its parked step is retried once the breaker lets calls through.
      actions:
        - retry-attempt
      escalation: Escalate to the runtime's service team and the owner of the outside system with the probe's detail and the time it opened.
  - code: store.ChainBroken
    title: A subject's fact chain does not verify
    category: technical
    retryable: false
    raisedBy:
      - store
    meaning: A payment's facts are not numbered without gaps, or a hash or a link is wrong.
    causes:
      - A row was changed outside the runtime.
      - A database restore mixed two points in time.
    runbook:
      checks:
        - Verify the chain of the payment.
        - Compare with the database's own audit.
      safeActions:
        - Stop acting on the payment. Keep the evidence.
      escalation: Escalate to the bank's security officer and the runtime's service team. Do not install or activate anything
        until it is explained.
  - code: store.ReleaseConflict
    title: A release id is stored with other content
    category: technical
    retryable: false
    raisedBy:
      - store
      - package-source
    meaning: A package for a release id already stored has different content. A published release is never changed.
    causes:
      - The studio released the same id twice with different content.
      - A package was changed after it was signed and signed again.
    runbook:
      checks:
        - Compare the content hashes of the two packages on the Content page.
      safeActions:
        - Do not install it. Ask the studio for a new release.
      actions:
        - reverify-package
      escalation: Escalate to the bank's security officer and the runtime's service team. Do not install or activate anything
        until it is explained.
  - code: store.Unavailable
    title: The store does not answer
    category: technical
    retryable: true
    raisedBy:
      - store
    meaning: The store's database could not be reached.
    causes:
      - The database server is down or full.
      - The connection setting or its credentials changed.
    runbook:
      checks:
        - Check the store on the Health page.
        - Check the database's disk.
      safeActions:
        - Wait for the database; hosts reconnect by themselves.
      escalation: Escalate to the runtime's service team with the payment id, the engine and the trace id.
  - code: readmodel.Lagging
    title: The operations read model is behind
    category: technical
    retryable: true
    raisedBy:
      - read-model
    meaning: The projection has not applied every outbox row; the consoles show an older state.
    causes:
      - The projecting host is stopped.
      - A burst of facts.
    runbook:
      checks:
        - Check the read model's lag on the Health page.
        - Check the projecting host.
      safeActions:
        - Wait. If it does not catch up, rebuild the read model.
      actions:
        - rebuild-read-model
        - replay-read-model
      escalation: Escalate to the runtime's service team with the payment id, the engine and the trace id.
  - code: readmodel.Gap
    title: A fact was missing when the projection reached it
    category: technical
    retryable: true
    raisedBy:
      - read-model
    meaning: The projection found a gap in the outbox that did not fill within its gap timeout.
    causes:
      - A writer's transaction committed late.
      - An outbox row was lost.
    runbook:
      checks:
        - Check the projection's warnings in the host's log.
      safeActions:
        - Rebuild the read model from the facts.
      actions:
        - rebuild-read-model
      escalation: Escalate to the runtime's service team with the payment id, the engine and the trace id.
  - code: signing.NotSigned
    title: The package is not signed
    category: technical
    retryable: false
    raisedBy:
      - signing
    meaning: The package has no release.json and release.sig. Nothing unsigned is stored or activated.
    causes:
      - It was exported without signing.
      - It was copied without its signature files.
    runbook:
      checks:
        - 'Check the version on GitHub: its folder must hold release.json and release.sig.'
      safeActions:
        - Do not install it. Ask the studio to publish it signed.
      actions:
        - reverify-package
      escalation: Escalate to the bank's security officer and the runtime's service team. Do not install or activate anything
        until it is explained.
  - code: signing.Tampered
    title: A file of the package does not match its signature
    category: technical
    retryable: false
    raisedBy:
      - signing
    meaning: A file is missing, extra, or does not match its hash in the signed statement, or the statement was changed.
    causes:
      - The package was changed after it was signed.
      - A file was lost in transfer.
    runbook:
      checks:
        - Compare the files on GitHub with the statement's hashes.
      safeActions:
        - Do not install it. Treat it as a security event.
      actions:
        - reverify-package
      escalation: Escalate to the bank's security officer and the runtime's service team. Do not install or activate anything
        until it is explained.
  - code: signing.UntrustedKey
    title: The package is signed by a key this runtime does not trust
    category: technical
    retryable: false
    raisedBy:
      - signing
    meaning: The signing key is not in TH_TRUSTED_SIGNERS.
    causes:
      - The studio rotated its key and the runtime was not told.
      - Someone else signed it.
    runbook:
      checks:
        - Check the key id against the studio's published key ids.
      safeActions:
        - Do not install it. If the key is the studio's new key, rotate the trusted keys first.
      actions:
        - rotate-trusted-key
        - reverify-package
      escalation: Escalate to the bank's security officer and the runtime's service team. Do not install or activate anything
        until it is explained.
  - code: signing.RevokedKey
    title: The package is signed by a revoked key
    category: technical
    retryable: false
    raisedBy:
      - signing
    meaning: The signing key was revoked. A revoked key verifies nothing, whenever it signed.
    causes:
      - The key was compromised or withdrawn.
    runbook:
      checks:
        - Check the revocation's reason in the trusted keys.
      safeActions:
        - Do not install or activate it. Ask the studio to sign the release again with a trusted key.
      actions:
        - reverify-package
      escalation: Escalate to the bank's security officer and the runtime's service team. Do not install or activate anything
        until it is explained.
  - code: signing.RetiredKey
    title: The package was signed after its key retired
    category: technical
    retryable: false
    raisedBy:
      - signing
    meaning: The key was retired before the package was signed. A retired key verifies only what it signed before.
    causes:
      - The studio still signs with an old key.
    runbook:
      checks:
        - Compare the signing time with the key's retirement.
      safeActions:
        - Do not install it. Ask the studio to sign with its current key.
      escalation: Escalate to the bank's security officer and the runtime's service team. Do not install or activate anything
        until it is explained.
  - code: signing.WrongRelease
    title: The signature is for another release or tenant
    category: technical
    retryable: false
    raisedBy:
      - signing
      - package-source
    meaning: The signed statement names another release id, tenant or kind than the package or its tag.
    causes:
      - A package was put in the wrong folder.
      - A tag names the wrong folder.
    runbook:
      checks:
        - Compare the tag, the folder and the statement's release id.
      safeActions:
        - Do not install it. Ask the studio to publish it again.
      escalation: Escalate to the bank's security officer and the runtime's service team. Do not install or activate anything
        until it is explained.
  - code: signing.TrustListInvalid
    title: The trusted keys cannot be read
    category: technical
    retryable: false
    raisedBy:
      - signing
    meaning: 'The trusted signers document is not valid: not JSON, a key id that is not its key''s, a key not on P-256.'
    causes:
      - A rotation wrote a broken document.
    runbook:
      checks:
        - Validate the trusted signers document.
      safeActions:
        - Restore the previous trusted signers document.
      actions:
        - rotate-trusted-key
      escalation: Escalate to the bank's security officer and the runtime's service team. Do not install or activate anything
        until it is explained.
  - code: signing.OutOfScope
    title: The key may not sign this kind of release
    category: technical
    retryable: false
    raisedBy:
      - signing
    meaning: 'The package is signed by a trusted key whose entry in the trusted signers names the kinds it may sign or the feed it is
      scoped to (R-09-184), and this package is another kind, claims no feed or another, or holds more than that feed makes: the rates
      feed''s key signs the feed''s rate releases only.'
    causes:
      - A key scoped to a feed signed a release the feed does not make, which may mean the key has leaked.
      - The trusted signers give a key narrower kinds than it is used for.
    runbook:
      checks:
        - Read the key id and the kinds and scope its trusted signers entry gives it.
        - Read what the refused release sets and carries.
      safeActions:
        - Do not install it. If the feed's key signed anything but a rate release, revoke the key and give the feed a new one.
      actions:
        - rotate-trusted-key
      escalation: Escalate to the bank's security officer and the runtime's service team. Do not install or activate anything
        until it is explained.
  - code: package.Rejected
    title: The package does not match its manifest
    category: technical
    retryable: false
    raisedBy:
      - signing
      - package-source
    meaning: A file the manifest lists is missing or does not match its hash, a file is not listed, or the manifest has no
      root workflow.
    causes:
      - The package was built incompletely.
      - It is not a studio package.
    runbook:
      checks:
        - Read the message for the file named.
      safeActions:
        - Do not install it. Ask the studio for a new release.
      escalation: Escalate to the bank's security officer and the runtime's service team. Do not install or activate anything
        until it is explained.
  - code: package.WrongBank
    title: The content is another bank's
    category: technical
    retryable: false
    raisedBy:
      - signing
      - package-source
      - service-console
    meaning: A distribution, a configuration release, a workflow package exported for a tenant, a payment, a kept file or a
      backup names another bank than the one this runtime serves (TH_BANK, set at install), so it is refused at verify, install
      and activate, whatever the caller's roles are (R-09-76).
    causes:
      - The version was built by the studio for another bank, which builds distributions for every bank.
      - The runtime was installed with another bank in TH_BANK than the one meant.
    runbook:
      checks:
        - Read the bank the message names and the bank this runtime serves.
        - Check TH_BANK in the runtime's installation settings.
      safeActions:
        - Do not install it here. Install the bank's own version, or install the other bank's version in that bank's runtime.
      escalation: Escalate to the runtime's service team and the bank's security officer if another bank's content was offered
        to this runtime on purpose.
  - code: package.NativeImageReference
    title: A native module reaches into the runtime image
    category: technical
    retryable: false
    raisedBy:
      - package-source
      - native
    meaning: An assembly a distribution carries under activities/native/ references an assembly of the runtime image other than
      the native contract (TransactHub.Activities.Contract), such as the platform, the ports, the model, the store or security.
      A module reaches the image only through the contract, so the distribution is refused at install and again when the native
      host loads it (R-09-125). The studio refuses to build such a module into a distribution in the first place.
    causes:
      - The code-behind project references a project of the runtime other than the contract.
      - The distribution was built before its module was made to reference the contract only.
    runbook:
      checks:
        - Read the assembly and the reference the message names.
        - Check the code-behind project's project references.
      safeActions:
        - Do not install it. Have the module reference the native contract only, build a new distribution and install that.
      escalation: Escalate to the platform's native code owners with the distribution, the module and the reference named.
  - code: native.NotNative
    title: 'The native host serves no such activity'
    category: technical
    retryable: false
    raisedBy:
      - native
    meaning: 'The attempt asks the native host for an activity that neither the distribution''s native modules nor the runtime image answer. With no distribution named, only the development modules are served (TH_NATIVE_DEV_MODULES).'
    causes:
      - 'The distribution was built without its module (native.notCarried in its manifest), so the activity runs its script-behind and should not reach the host.'
      - 'The worker gives the activity to the native host (TH_NATIVE_ACTIVITIES) though the distribution carries no native code for it.'
    runbook:
      checks:
        - 'Read the distribution''s manifest, its native section and notCarried.'
        - 'Read GET /modules on the native host: the modules loaded for the distribution and their activities.'
      safeActions:
        - 'Do not retry. Build the distribution with its native modules, or let the worker run the activity''s script-behind.'
      escalation: 'Escalate to the runtime''s service team with the distribution id and the activity.'
  - code: native.NotInDistribution
    title: 'The distribution does not carry this activity at this release'
    category: technical
    retryable: false
    raisedBy:
      - native
    meaning: 'The attempt names an activity at a release its payment''s distribution does not carry. A payment runs only the activities of the distribution it is pinned to, never another distribution''s build (R-09-122).'
    causes:
      - 'The worker''s package and the payment''s distribution are of different releases.'
      - 'The engine sent an attempt for another release of the activity than the distribution''s bill of materials names.'
    runbook:
      checks:
        - 'Read the activity''s release in the distribution''s bill of materials.'
        - 'Read which package the worker set was started with.'
      safeActions:
        - 'Do not retry. Serve the payment from workers of its own distribution.'
      escalation: 'Escalate to the runtime''s service team with the payment id, the distribution and the activity.'
  - code: native.DistributionUnknown
    title: 'The distribution is not installed in this runtime'
    category: technical
    retryable: false
    raisedBy:
      - native
    meaning: 'The attempt names a distribution the native host cannot find in the runtime''s store, or the host has no store to read distributions from.'
    causes:
      - 'The distribution was never installed in this runtime, or the id is malformed.'
      - 'The native host was started without TH_STORE_PROVIDER and TH_STORE_CONNECTION.'
    runbook:
      checks:
        - 'List the distributions installed in the service console.'
        - 'Check the native host''s store settings.'
      safeActions:
        - 'Do not retry. Install the distribution, or give the native host its store, then let the operator decide the payment.'
      escalation: 'Escalate to the runtime''s service team with the distribution id.'
  - code: native.DistributionRemoved
    title: 'The distribution was removed'
    category: technical
    retryable: false
    raisedBy:
      - native
    meaning: 'The attempt names a distribution that was removed in every environment it was known in; its native assemblies are unloaded (R-09-122).'
    causes:
      - 'A payment of the distribution was still open when it was removed.'
      - 'A worker of a removed distribution is still running.'
    runbook:
      checks:
        - 'Read the distribution''s states in the service console.'
        - 'Find the payment''s pin and its open steps.'
      safeActions:
        - 'Do not retry. Install the distribution again if its open payments must finish on it; stop workers of removed distributions.'
      escalation: 'Escalate to the runtime''s service team with the payment id and the distribution.'
  - code: native.ModuleRefused
    title: 'The distribution''s native module cannot be loaded'
    category: technical
    retryable: false
    raisedBy:
      - native
    meaning: 'The native host refused to load a module of the distribution: an assembly does not match its SHA-256 in the signed bill of materials, the native contract is one the runtime does not support, or the module names no entry point, another scope, or does not serve an activity it must (R-09-121, R-09-123).'
    causes:
      - 'The distribution was built against a newer native contract than this runtime supports.'
      - 'The package in the store does not match its signed bill of materials.'
    runbook:
      checks:
        - 'Read the message: the assembly and the check that failed.'
        - 'Compare the distribution''s native contract with GET /health on the native host.'
      safeActions:
        - 'Do not retry. Upgrade the runtime or build the distribution again, and install that.'
      escalation: 'Escalate to the runtime''s service team with the distribution, the module and the message.'
  - code: native.WrongDistribution
    title: 'The worker runs another distribution'
    category: technical
    retryable: false
    raisedBy:
      - native
    meaning: 'The attempt names a distribution other than its worker''s TH_DISTRIBUTION: a worker started for one distribution never serves another''s payment (R-09-131).'
    causes:
      - 'The engine routed the payment''s task to the queue of another distribution''s workers.'
      - 'A worker was started with the wrong TH_DISTRIBUTION.'
    runbook:
      checks:
        - 'Read the attempt''s distribution and the worker''s TH_DISTRIBUTION.'
        - 'Check the task queues the distribution''s plan names.'
      safeActions:
        - 'Do not retry. Correct the worker''s distribution or the queues, then let the engine retry the step.'
      escalation: 'Escalate to the runtime''s service team with the payment id, both distributions and the worker.'
  - code: native.NotPinned
    title: 'The payment is pinned to another distribution'
    category: technical
    retryable: false
    raisedBy:
      - native
    meaning: 'The attempt names a distribution its payment (header.paymentId) is not pinned to by its distribution.pinned fact (R-09-132). A payment runs only the native activities of the distribution it is pinned to.'
    causes:
      - 'The engine instance runs another distribution than the payment''s pin.'
      - 'The payment was pinned again after its instance started.'
    runbook:
      checks:
        - 'Read the payment''s distribution.pinned fact and the attempt''s distribution.'
        - 'Read the engine instance''s distribution.'
      safeActions:
        - 'Do not retry. An operator decides the payment; never move it to another distribution''s code.'
      escalation: 'Escalate to the runtime''s service team with the payment id and both distributions.'
  - code: package.NotPromotable
    title: The package may not be activated here
    category: technical
    retryable: false
    raisedBy:
      - signing
    meaning: The package carries simulators or has errors, so it may be activated only in a test environment.
    causes:
      - A test export was published as a release.
    runbook:
      checks:
        - Check the manifest's promotable and containsSimulators.
      safeActions:
        - Activate it only in a test environment.
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
  - code: package.KindNotInstallable
    title: This kind of package cannot be installed yet
    category: technical
    retryable: false
    raisedBy:
      - package-source
      - service-console
    meaning: Distributions and configuration releases are listed but their install is not built (Issue I-102).
    causes:
      - The studio published a distribution or a configuration release.
    runbook:
      checks:
        - Check the version's kind on the Content page.
      safeActions:
        - Install the workflow packages it is built from instead, until distributions are built.
      escalation: Escalate to the runtime's service team with the payment id, the engine and the trace id.
  - code: package-source.Unreachable
    title: GitHub could not be read
    category: technical
    retryable: true
    raisedBy:
      - package-source
    meaning: The package source answered an error or did not answer. The token is never shown.
    causes:
      - GitHub is down or rate-limits the runtime.
      - The read-only token expired or was revoked.
    runbook:
      checks:
        - Check the package source on the Health page.
        - Check the token's reference (never its value).
      safeActions:
        - Wait, or renew the read-only token at its source.
      escalation: Escalate to the runtime's service team with the payment id, the engine and the trace id.
  - code: package-source.UnknownVersion
    title: The package source has no such version
    category: technical
    retryable: false
    raisedBy:
      - package-source
    meaning: No tag of the package source names the version asked for.
    causes:
      - The tag was not pushed, or was deleted.
    runbook:
      checks:
        - List the versions again on the Content page.
      safeActions:
        - Ask the studio to publish the release with its tag.
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
  - code: auth.Unauthenticated
    title: No verified caller
    category: technical
    retryable: false
    raisedBy:
      - auth
    meaning: The request carried no bearer token the bank's identity provider vouches for.
    causes:
      - The person is not signed in, or the token expired.
      - The issuer or audience setting is wrong.
    runbook:
      checks:
        - Sign in again.
        - Check Auth:Oidc:Issuer and Auth:Oidc:Audience.
      safeActions:
        - Sign in again; nothing else is needed.
      escalation: Escalate to the bank's identity team with the time and the host.
  - code: auth.Forbidden
    title: The caller lacks the role
    category: technical
    retryable: false
    raisedBy:
      - auth
      - operations-console
      - service-console
    meaning: The caller is signed in but the bank's role map gives them no role for this action.
    causes:
      - The person is not in the group the role map grants.
      - The role map was changed.
    runbook:
      checks:
        - Check the person's groups at the identity provider against the role map.
      safeActions:
        - Ask the bank's identity team to grant the group; never grant a role in the runtime.
      escalation: Escalate to the bank's identity team.
  - code: auth.StudioIssuer
    title: The studio's issuer was set as the runtime's
    category: technical
    retryable: false
    raisedBy:
      - auth
    meaning: The runtime trusts only the bank's identity provider. The studio's issuer is refused at start-up.
    causes:
      - A configuration copied from the studio.
    runbook:
      checks:
        - Check Auth:Oidc:Issuer against TH_STUDIO_ISSUER.
      safeActions:
        - Set the bank's issuer and start the host again.
      escalation: Escalate to the bank's security officer and the runtime's service team. Do not install or activate anything
        until it is explained.
  - code: auth.DevRefused
    title: Dev sign-in refused in Production
    category: technical
    retryable: false
    raisedBy:
      - auth
    meaning: TH_AUTH_DEV=1 is refused when the host runs in Production.
    causes:
      - A development setting reached a production host.
    runbook:
      checks:
        - Check the host's environment variables.
      safeActions:
        - Remove TH_AUTH_DEV and start the host again.
      escalation: Escalate to the bank's security officer and the runtime's service team. Do not install or activate anything
        until it is explained.
  - code: auth.RoleMapInvalid
    title: The role map cannot be used
    category: technical
    retryable: false
    raisedBy:
      - auth
    meaning: The role map is missing, not of kind runtime-role-map, grants nothing, or grants a role the host does not know.
    causes:
      - A role map written for another host.
      - A typing error in a role.
    runbook:
      checks:
        - Validate the role map against the host's roles.
      safeActions:
        - Restore the last role map from a configuration backup.
      escalation: Escalate to the bank's security officer and the runtime's service team. Do not install or activate anything
        until it is explained.
  - code: fx.RateStale
    title: The exchange rate is older than the bank allows
    category: business
    retryable: false
    raisedBy:
      - activity
      - native
      - interpreter
      - operations-console
    meaning: 'p.enrich.fx-rate.v1 refused a rate whose asOf is older than the bank''s staleness limit (maxRateAge): the line
      is no-rate and facts.fx names the pair as stale (R-09-178). The operations console warns "rates stale" for the same rate.'
    causes:
      - The rates feed has not published for longer than the limit; the bank's rates service does not answer, or its breaker is open.
      - The bank approver has not consented to the feed's latest release, so it waits, installed and not in force.
      - The bank's staleness limit is shorter than the feed's schedule (refreshMinutes).
    runbook:
      checks:
        - Read the rates and their age on the operations console's banner, and the feed's last release on the service console.
        - Read the health of the rates port's binding (p.port.fx-rates.v1) on the service console's Health page.
        - Look for a configuration release of the feed that waits for consent.
      safeActions:
        - Mend the rates service or its binding, then let the feed publish again; consent to a release that waits, if it is right.
        - Then decide the payment that was refused; do not set a rate by hand to get it through.
      escalation: Escalate to the bank's treasury and payment operations supervisor with the pair, its asOf and the limit.
  - code: fx.FeedFailed
    title: The rates feed could not publish
    category: technical
    retryable: true
    raisedBy:
      - service-console
    meaning: 'A run of the exchange-rate feed published nothing: the rates service did not answer, refused, or gave a quote that
      is not a pair of currencies with a rate above zero and an instant (R-09-177). The rates in force stay as they were and grow older.'
    causes:
      - The bank's rates service is down or slow, or its circuit breaker is open.
      - The rates service answered a quote the feed will not publish.
      - The feed's signing key is not one the bank's trusted signers list.
    runbook:
      checks:
        - Read the feed's warning in the service console's log and the rates port's health.
        - Check that the feed's public key is in the trusted signers.
      safeActions:
        - Wait for the next run; the feed runs again on its schedule.
        - Mend the rates service or its binding; a quote is never corrected by hand.
      escalation: Escalate to the bank's treasury systems team with the time of the run and the error.
  # 1.10.0 (change set CS-2026-11-24-015, on 1.9.0; R-11-108): the File API's refusals that read the scheme's message rules
  # (R-09-209, R-09-210, R-09-212; Issues I-159, I-164, I-267).
  - code: file.NotEncrypted
    title: The scheme says the file arrives encrypted, and it did not
    category: business
    retryable: false
    raisedBy:
      - file-api
    meaning: The scheme's file rules for the message say its file is encrypted (encrypted true, R-09-209). The file arrived in the clear and was kept as refused; it was never handed on.
    causes:
      - The sender did not encrypt the file.
      - The file was taken from an inbox before the sender's encryption step wrote it.
    runbook:
      checks:
        - Read the refused file's facts on its chain in the operations console.
        - Check the scheme's file rules for the message in the active distribution.
      safeActions:
        - Ask the sender to send the file again, encrypted to the bank's key.
      escalation: Escalate to the bank's file-transfer support with the file's id and its message.
  - code: file.Encrypted
    title: The scheme says the file arrives in the clear, and it was encrypted
    category: business
    retryable: false
    raisedBy:
      - file-api
    meaning: The scheme's file rules for the message say its file is not encrypted (encrypted false, R-09-209). The file arrived encrypted and was kept as refused; it was never handed on.
    causes:
      - The sender encrypted a file the scheme sends in the clear.
    runbook:
      checks:
        - Read the refused file's facts on its chain in the operations console.
        - Check the scheme's file rules for the message in the active distribution.
      safeActions:
        - Ask the sender to send the file again in the clear.
      escalation: Escalate to the bank's file-transfer support with the file's id and its message.
  - code: frontdoor.Uncorrelated
    title: The scheme's correlation map read no key from the file
    category: business
    retryable: false
    raisedBy:
      - file-api
    meaning: The message is delivered to a running payment, and its scheme names a correlation map (R-09-212). The map read no key of the payment the file answers, so the file is refused rather than guessed onto a payment.
    causes:
      - The file's name or content does not follow the scheme's naming (an acknowledgement too short to carry the file id it answers).
      - The file is not the message its inbox says it is.
    runbook:
      checks:
        - Read the refused file's name and facts in the operations console.
        - Check which message the inbox names in the bank's file-transfer binding.
      safeActions:
        - Find the payment the file answers by its content and ask the sender for a correctly named file; never rename a received file.
      escalation: Escalate to the scheme's operations desk with the file's id and name.
  - code: frontdoor.ReportUnreadable
    title: The scheme's report map could not read the report
    category: business
    retryable: false
    raisedBy:
      - file-api
    meaning: The message is a report the scheme reconciles on arrival (R-09-210), and its map did not read it into lines. The run is recorded as unreadable and no break is raised from it.
    causes:
      - The report is not in the scheme's layout, or a line names no reference.
    runbook:
      checks:
        - Read the reconciliation run's facts and the kept report in the operations console.
      safeActions:
        - Ask the scheme for the report again; the report is never edited by hand.
      escalation: Escalate to the scheme's operations desk with the report's file id.
  - code: frontdoor.NotAReport
    title: The message is not a report the scheme reconciles
    category: technical
    retryable: false
    raisedBy:
      - file-api
    meaning: The File API was asked to read report lines from a message whose disposition is not reconcile (R-09-210).
    causes:
      - The installation names the message as a report while the scheme in the active distribution does not, or the reverse.
    runbook:
      checks:
        - Compare the installation's FileApi:Reports settings with the scheme's dispositions in the active distribution.
      safeActions:
        - Remove the installation's setting for a report the scheme declares.
      escalation: Escalate to the runtime's operations team with the message id.
  - code: ops.ActionNotOffered
    title: The action does not apply to this payment now
    category: business
    retryable: false
    raisedBy:
      - operations-console
    meaning: The payment's views do not offer this action in its present state.
    causes:
      - The hold was decided already.
      - The payment moved on.
    runbook:
      checks:
        - Reload the payment and read its offered actions.
      safeActions:
        - Take an action it offers now.
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
  - code: ops.RemarksRequired
    title: The action needs remarks
    category: business
    retryable: false
    raisedBy:
      - operations-console
      - service-console
    meaning: The action's declaration asks for remarks, or the service console asks why.
    causes:
      - The remarks were left empty.
    runbook:
      checks:
        - Read the action's declaration.
      safeActions:
        - Ask again with remarks.
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
  - code: ops.MakerApproves
    title: The person who asked may not approve
    category: business
    retryable: false
    raisedBy:
      - operations-console
      - service-console
    meaning: 'Maker-checker: a second approver must be another person.'
    causes:
      - The maker tried to approve their own action.
    runbook:
      checks:
        - Check who asked for the action.
      safeActions:
        - Ask another person with the approver's role.
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
  - code: ops.AlreadyDecided
    title: The action is decided already
    category: business
    retryable: false
    raisedBy:
      - operations-console
      - service-console
    meaning: The action was approved, rejected or carried out already.
    causes:
      - Two approvers decided at once.
    runbook:
      checks:
        - Read the action's facts.
      safeActions:
        - Nothing to do.
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
  - code: ops.HoldClosed
    title: The hold is no longer open
    category: business
    retryable: false
    raisedBy:
      - operations-console
      - service-console
    meaning: The hold the action decides was decided or expired before the action was carried out.
    causes:
      - Another operator decided it.
      - It expired (Issue I-98).
    runbook:
      checks:
        - Read the hold's facts on the payment's chain.
      safeActions:
        - Nothing to do on the hold; follow the payment's next step.
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
  - code: ops.NoEnginePath
    title: The action has no path to the engines yet
    category: technical
    retryable: false
    raisedBy:
      - operations-console
      - service-console
    meaning: 'The action is recorded and refused: no engine host carries it to a running payment yet (Issues I-99 and I-101).'
    causes:
      - The action needs an engine path that is not built.
    runbook:
      checks:
        - Read the action's result and the issue it names.
      safeActions:
        - Use the runbook's manual steps on the engine's own console with the runtime's service team.
      escalation: Escalate to the runtime's service team with the payment id, the engine and the trace id.
  - code: ops.IntakePaused
    title: Intake of a scheme is paused for the bank
    category: technical
    retryable: true
    raisedBy:
      - store
      - service-console
    meaning: The service console paused intake of the scheme for the bank, so the runtime refuses a new payment of it. Payments
      already accepted run on.
    causes:
      - A service engineer paused intake to drain a worker, switch a distribution or wait for a party.
    runbook:
      checks:
        - Read the pause-intake fact on the service console's audit, with who paused it and why.
        - Check whether the reason for the pause still holds.
      safeActions:
        - Send the payment again once intake is resumed; the channel's own retry does this.
      actions:
        - resume-intake
      escalation: Escalate to the runtime's service team with the scheme, the bank and the time of the pause.
  - code: ops.NoParkedStep
    title: The payment has no parked step
    category: business
    retryable: false
    raisedBy:
      - operations-console
      - service-console
    meaning: A re-drive, reset or requeue applies to a parked step, and the payment has none now.
    causes:
      - The step was re-driven or reset already.
      - The step's attempt succeeded on a retry before the action was asked.
    runbook:
      checks:
        - Reload the payment and read its timeline for the step's last attempt.
      safeActions:
        - Take an action the payment offers now.
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
  - code: ops.NoFileKept
    title: The runtime keeps no file to send again
    category: business
    retryable: false
    raisedBy:
      - operations-console
      - service-console
    meaning: A resend sends a file the runtime kept when it was first sent, and none is kept for this payment.
    causes:
      - The payment's scheme sends no file.
      - The file was never sent, or its kept copy has passed its retention.
    runbook:
      checks:
        - Read the payment's messages on its timeline.
      safeActions:
        - Ask the scheme's operations for the file's status instead of sending it again.
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
  - code: ops.NoPostingReference
    title: The payment has no posting reference to reconcile
    category: business
    retryable: false
    raisedBy:
      - operations-console
      - service-console
    meaning: A reconcile asks core banking about a posting by its reference, and the payment's facts hold none.
    causes:
      - The payment did not reach its posting step.
      - The posting was refused before core banking gave a reference.
    runbook:
      checks:
        - Read the posting step on the payment's timeline.
      safeActions:
        - Take an action the payment offers now.
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
  - code: ops.UnknownPayment
    title: No payment or bulk has this id
    category: business
    retryable: false
    raisedBy:
      - operations-console
      - service-console
    meaning: The id an action or a search names is no payment or bulk of the store that the user's tenant may see.
    causes:
      - The id is mistyped, or belongs to another tenant.
    runbook:
      checks:
        - Search the payment by its references in the operations console.
      safeActions:
        - Ask again with the payment's id from the console.
      escalation: Escalate to the bank's payment operations supervisor with the reference the channel gave.
  - code: ops.WorkerUnreachable
    title: A worker does not answer its control
    category: technical
    retryable: true
    raisedBy:
      - service-console
    meaning: The service console asked a worker to drain or restart, and the worker did not answer on its control address.
    causes:
      - The worker is down, or its control address is not reachable from the console's host.
      - The worker is busy and did not answer in time.
    runbook:
      checks:
        - Check the worker's health on the service console's Health page.
        - Check the worker's host and its logs, by the trace id of the action.
      safeActions:
        - Wait and ask again once the worker's health is good.
      actions:
        - restart-worker
      escalation: Escalate to the runtime's service team with the worker's queue, its host and the trace id.
  - code: service.LogSourceUnreachable
    title: The installation's log back end does not answer
    category: technical
    retryable: true
    raisedBy:
      - service-console
    meaning: The service console reads other hosts' logs from the installation's log back end, and the back end did not answer
      or refused the query. The console's own logs and the store's facts are still shown.
    causes:
      - The log back end is down, or its address or credential in the console's settings is wrong.
    runbook:
      checks:
        - Check the log back end's health on the service console's Health page.
        - Check the log source's address and its secret reference in the console's settings.
      safeActions:
        - Read the trace in the installation's own log and trace tools by its trace id.
      escalation: Escalate to the runtime's service team with the trace id and the time.
  - code: service.ApproverRequired
    title: A change of the system waits for a bank approver's consent
    category: technical
    retryable: false
    raisedBy:
      - service-console
    meaning: The action changes the system; it is carried out only when a bank approver (the role BankApprover), another person
      than the one who asked, consents (R-09-77). A configuration release the release API installed outside its test
      environments waits in the same way before it is put in force (R-09-111).
    causes:
      - The action changes what runs, what new payments take, or the bank's values or bindings in force.
    runbook:
      checks:
        - Check the pending actions.
      safeActions:
        - Ask a bank approver to decide it.
      escalation: Escalate to the runtime's service team with the payment id, the engine and the trace id.
  - code: service.RemovalRefused
    title: A release may not be removed now
    category: business
    retryable: false
    raisedBy:
      - service-console
    meaning: A release is removed only when it is not active and no payment pinned to it is open.
    causes:
      - Payments pinned to it are still open.
      - It is the active release.
    runbook:
      checks:
        - Check the open-payment count of the release on the Content page.
      safeActions:
        - Wait until it is drained; activate another release first.
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
  - code: service.RestoreRefused
    title: The restore target is not empty or not a test runtime
    category: technical
    retryable: false
    raisedBy:
      - service-console
    meaning: A configuration backup is restored only into an empty runtime or a test environment.
    causes:
      - The target already holds releases, activations or values.
    runbook:
      checks:
        - Run the restore as a dry run and read the plan.
      safeActions:
        - Restore into an empty or a test runtime.
      escalation: Escalate to the runtime's service team with the payment id, the engine and the trace id.
  - code: service.BackupInvalid
    title: The backup does not verify
    category: technical
    retryable: false
    raisedBy:
      - service-console
      - signing
    meaning: The backup is unsigned, changed after it was signed, or signed by a key the target does not trust.
    causes:
      - The file was changed or truncated.
      - The target does not trust the source's backup key.
    runbook:
      checks:
        - Verify the backup on the Backup page.
      safeActions:
        - Do not restore it. Export a new backup from the source.
      escalation: Escalate to the bank's security officer and the runtime's service team. Do not install or activate anything
        until it is explained.
  - code: service.ProbeFailed
    title: A health probe failed
    category: technical
    retryable: true
    raisedBy:
      - service-console
    meaning: A component's cheap health probe did not answer as expected.
    causes:
      - The component is down, slow or unreachable from the console's host.
    runbook:
      checks:
        - Open the component's dashboard.
        - Check the probe's last good time in the history.
      safeActions:
        - Wait and watch the history; restart the component through its own operations if it stays down.
      actions:
        - restart-worker
      escalation: Escalate to the runtime's service team with the payment id, the engine and the trace id.
  - code: service.CertificateExpiring
    title: A certificate or key expires soon
    category: technical
    retryable: false
    raisedBy:
      - service-console
      - signing
    meaning: A certificate the runtime uses, or a trusted key, expires or is retired within the warning window.
    causes:
      - A rotation is due.
    runbook:
      checks:
        - Read the expiry on the Health page.
      safeActions:
        - Plan the rotation; add the new trusted key before the old one retires.
      actions:
        - rotate-trusted-key
      escalation: Escalate to the bank's security officer and the runtime's service team. Do not install or activate anything
        until it is explained.
  - code: service.DiskLow
    title: A disk is nearly full
    category: technical
    retryable: false
    raisedBy:
      - service-console
    meaning: Free space on a disk the runtime uses is below the warning level.
    causes:
      - Logs or database files grow.
      - Old packages are kept.
    runbook:
      checks:
        - Read the free space on the Health page.
      safeActions:
        - Free space at the host; never delete store rows.
      escalation: Escalate to the runtime's service team with the payment id, the engine and the trace id.
  - code: assistant.Disabled
    title: The assistant is switched off
    category: technical
    retryable: false
    raisedBy:
      - assistant
    meaning: TH_ASSISTANT_ENABLED is not true, or no API key is configured.
    causes:
      - The bank has not approved sending masked data to the model provider (Issue I-104).
    runbook:
      checks:
        - Check TH_ASSISTANT_ENABLED and the key's reference.
      safeActions:
        - Use the runbooks directly.
      escalation: Escalate to the bank's service owner if the assistant should be on.
  - code: assistant.Unavailable
    title: The model did not answer
    category: technical
    retryable: true
    raisedBy:
      - assistant
    meaning: The model provider answered an error, refused the request, or did not answer.
    causes:
      - A rate limit, an outage or a refusal.
    runbook:
      checks:
        - Read the assistant's message.
      safeActions:
        - Ask again later; use the runbooks directly.
      escalation: Escalate to the runtime's service team with the payment id, the engine and the trace id.
  - code: AC02
    title: Invalid debtor account number
    category: business
    retryable: false
    isoReasonCode: AC02
    raisedBy:
      - rule
    meaning: The debtor's account number is missing or not valid.
    causes:
      - The account is empty or badly formed in the instruction.
    runbook:
      checks:
        - Open the payment in the operations console and read the step that gave the reason code.
      safeActions:
        - 'Do not retry: the same data gives the same answer. Correct the data at its source.'
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
  - code: AC03
    title: Invalid creditor account number
    category: business
    retryable: false
    isoReasonCode: AC03
    raisedBy:
      - rule
    meaning: The creditor's account number is missing or not valid.
    causes:
      - The account is empty, badly formed, or its check digits fail.
    runbook:
      checks:
        - Open the payment in the operations console and read the step that gave the reason code.
      safeActions:
        - 'Do not retry: the same data gives the same answer. Correct the data at its source.'
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
  - code: AC04
    title: Closed account number
    category: business
    retryable: false
    isoReasonCode: AC04
    raisedBy:
      - port
    meaning: The party reports the account closed.
    causes:
      - The account was closed at the receiving bank.
    runbook:
      checks:
        - Open the payment in the operations console and read the step that gave the reason code.
      safeActions:
        - 'Do not retry: the same data gives the same answer. Correct the data at its source.'
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
  - code: AM01
    title: Zero amount
    category: business
    retryable: false
    isoReasonCode: AM01
    raisedBy:
      - rule
    meaning: The amount is zero or negative.
    causes:
      - A line with no amount.
    runbook:
      checks:
        - Open the payment in the operations console and read the step that gave the reason code.
      safeActions:
        - 'Do not retry: the same data gives the same answer. Correct the data at its source.'
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
  - code: AM02
    title: Amount not allowed
    category: business
    retryable: false
    isoReasonCode: AM02
    raisedBy:
      - rule
    meaning: 'The amount is above a limit: the platform''s, the scheme''s or the bank''s.'
    causes:
      - The amount exceeds the limit in force on the payment's date.
    runbook:
      checks:
        - Open the payment in the operations console and read the step that gave the reason code.
        - Check the limit in force for the tenant on the payment's date.
      safeActions:
        - 'Do not retry: the same data gives the same answer. Correct the data at its source.'
        - An operator may approve the hold, where the bank's hook holds the payment for approval.
      actions:
        - release-hold
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
  - code: AM03
    title: Currency not allowed
    category: business
    retryable: false
    isoReasonCode: AM03
    raisedBy:
      - rule
    meaning: The currency is not one the rail or the scheme takes.
    causes:
      - A currency the scheme does not settle.
    runbook:
      checks:
        - Open the payment in the operations console and read the step that gave the reason code.
      safeActions:
        - 'Do not retry: the same data gives the same answer. Correct the data at its source.'
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
  - code: AM04
    title: Insufficient funds
    category: business
    retryable: false
    isoReasonCode: AM04
    raisedBy:
      - port
    meaning: The debtor's account has not enough funds, as the liquidity party answers.
    causes:
      - The balance is below the amount at the time of the check.
    runbook:
      checks:
        - Open the payment in the operations console and read the step that gave the reason code.
        - Check the reservation's step and its time.
      safeActions:
        - 'Do not retry: the same data gives the same answer. Correct the data at its source.'
        - The customer funds the account; the bank's channel resubmits.
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
  - code: BE04
    title: Missing creditor address
    category: business
    retryable: false
    isoReasonCode: BE04
    raisedBy:
      - rule
    meaning: The creditor's town or country is missing where the rail needs them.
    causes:
      - The instruction carries no creditor address.
    runbook:
      checks:
        - Open the payment in the operations console and read the step that gave the reason code.
      safeActions:
        - 'Do not retry: the same data gives the same answer. Correct the data at its source.'
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
  - code: CH21
    title: Required element missing
    category: business
    retryable: false
    isoReasonCode: CH21
    raisedBy:
      - rule
    meaning: A compulsory element of the instruction is missing (the currency, the end-to-end id).
    causes:
      - The channel sent an incomplete instruction.
    runbook:
      checks:
        - Open the payment in the operations console and read the step that gave the reason code.
      safeActions:
        - 'Do not retry: the same data gives the same answer. Correct the data at its source.'
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
  - code: FRAD
    title: Fraudulent origin
    category: business
    retryable: false
    isoReasonCode: FRAD
    raisedBy:
      - port
    meaning: The fraud party answers that the payment is suspect.
    causes:
      - The fraud engine's rules flagged the payment.
    runbook:
      checks:
        - Open the payment in the operations console and read the step that gave the reason code.
        - Read the fraud step's reply on the timeline.
      safeActions:
        - 'Do not retry: the same data gives the same answer. Correct the data at its source.'
        - The fraud team decides; never release it from the service console.
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
  - code: NARR
    title: Narrative reason
    category: business
    retryable: false
    isoReasonCode: NARR
    raisedBy:
      - port
    meaning: The party refused with a reason given only in words.
    causes:
      - A party's free-text refusal.
    runbook:
      checks:
        - Open the payment in the operations console and read the step that gave the reason code.
        - Read the party's text in the step's reply (it is masked).
      safeActions:
        - 'Do not retry: the same data gives the same answer. Correct the data at its source.'
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
  - code: NOOR
    title: No original transaction received
    category: business
    retryable: false
    isoReasonCode: NOOR
    raisedBy:
      - port
    meaning: The record party does not know the original transaction.
    causes:
      - A return or a query for a payment the party never received.
    runbook:
      checks:
        - Open the payment in the operations console and read the step that gave the reason code.
      safeActions:
        - 'Do not retry: the same data gives the same answer. Correct the data at its source.'
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
  - code: RR04
    title: Regulatory reason
    category: business
    retryable: false
    isoReasonCode: RR04
    raisedBy:
      - port
    meaning: The sanctions party refused the payment for a regulatory reason.
    causes:
      - A sanctions hit that the screening team confirmed.
    runbook:
      checks:
        - Open the payment in the operations console and read the step that gave the reason code.
        - Read the screening step on the timeline.
      safeActions:
        - 'Do not retry: the same data gives the same answer. Correct the data at its source.'
        - The screening team decides; re-screen only when the lists changed.
      actions:
        - re-screen
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
provenance:
  origin: factory
  status: provisional
  clauses:
