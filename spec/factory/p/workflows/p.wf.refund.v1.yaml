kind: workflow
wfKind: platform
name: p.wf.refund.v1
release: 1.1.0
dsl: 1.0.0
title: Refund orders
description: >-
  An order to refund an earlier payment, asked for by a scheme (ISO 20022 camt.056, FIToFIPmtCxlReq). It is an order of its own,
  pinned to the distribution active when it arrives, and it names the earlier payment by id (header.originalPaymentId). The
  platform owns its lifecycle: it finds the earlier payment, converts each line at the bank's rate, prices the bank's charge,
  blocks the amount on the account, holds the order for approval, and posts it. The scheme leg returns the funds and answers
  the scheme (pacs.004 PmtRtr and camt.029 RsltnOfInvstgtn); the refuse leg answers a refusal (camt.029). Neither leg posts.
  Release 1.1.0 posts with p.post.accounting.v2, which reads the order's FX and charges: each line's converted amount, then its
  charge and its VAT as entries of their own (R-12-23, Issue I-136); and it no longer declares re-screen, which a refund order has
  no step for: the platform view offers re-screen only on the workflows that screen (R-05-61, Issue I-135).
direction: inward
entry:
  reads: [header, payment, batch, "items[]"]
exit:
  writes: [status, facts.record, facts.fx, facts.charges, facts.reservation, facts.approval, facts.posting]
  outcomes: [settled, rejected, review]
slots:
  - name: scheme-leg
    contract:
      reads: [header, batch, "items[]", facts.record, facts.fx, facts.charges, facts.reservation, facts.approval, facts.posting]
      writes: [status, messages]
      outcomes: [settled, rejected, pending]
      primaryOutcome: settled
  - name: scheme-refuse
    contract:
      reads: [header, batch, "items[]", facts.record, facts.reservation, facts.approval]
      writes: [status, messages]
      outcomes: [refused, pending]
      primaryOutcome: refused
hookPoints:
  - name: before-posting
    type: halt
    description: A bank may hold or reject an approved refund order before it is posted.
    contract:
      reads: [header, batch, "items[]", facts.fx, facts.charges, facts.reservation, facts.approval]
    policy: { timeout: PT30S, onFailure: fail-closed, onHold: p.hold.approval.v1 }
  - name: on-close
    type: notify
    description: A bank may be told that a refund order has closed.
    contract:
      reads: [header, status]
    policy: { timeout: PT10S, onFailure: fail-open }
signals: [pause, resume, cancel]
do:
  # The earlier payment, by the id the order names (R-12-19).
  - id: original
    call: p.enrich.payment-record.v1
    handle:
      not-found:
        - id: refuse-unknown
          slot: scheme-refuse
          handle:
            pending: { end: review }
        - end: rejected
  # FX and charges are the platform's, on the bank's values (R-12-20).
  - id: fx
    call: p.enrich.fx-rate.v1
    handle:
      no-rate:
        - id: refuse-no-rate
          slot: scheme-refuse
          handle:
            pending: { end: review }
        - end: rejected
  - id: charges
    call: p.enrich.charges.v1
    handle:
      none: { continue: true }
  - try:
      # The amount is blocked on the account before anyone approves (the source's automated account block).
      - id: reserve
        call: p.reserve.funds.v1
        handle:
          insufficient:
            - id: refuse-insufficient
              slot: scheme-refuse
              handle:
                pending: { end: review }
            - end: rejected
      - id: approval
        call: p.hold.approval.v1
        handle:
          declined:
            - id: refuse-declined
              slot: scheme-refuse
              handle:
                pending: { end: review, compensate: all }
            - end: rejected
              compensate: all
          expired: { end: review }
      - hook: before-posting
    compensate: all
  # The posting may run again (it carries an idempotency key), so a failed attempt parks for a business day for an operator's
  # retry instead of ending the order (R-05-55, Issue I-125).
  - id: post
    call: p.post.accounting.v2
    policy: { park: P1D }
    handle:
      rejected: { end: review }
      unknown: { continue: true }
  - id: verify
    call: p.post.verify.v1
    handle:
      mismatch: { end: review }
  - id: leg
    slot: scheme-leg
    handle:
      rejected: { end: review }
      pending: { end: review }
  - end: settled
finally:
  - id: notify
    call: p.notify.channel.v1
  - id: publish
    call: p.notify.publish-fact.v1
  - hook: on-close
provenance: { origin: factory, status: confirmed }
