kind: workflow
wfKind: platform
name: p.wf.commercial.v1
release: 1.0.0
dsl: 1.0.0
title: Commercial payments
description: Outward lifecycle for instant rails. The same stages as corporate, with a deadline and a synchronous marker.
direction: outward
synchronous: true
entry:
  reads: [header, payment]
exit:
  writes: [status, facts.route, facts.reservation, facts.posting]
  outcomes: [settled, rejected, returned, review]
slots:
  - name: scheme-leg
    contract:
      reads: [header, payment, facts.route, facts.reservation]
      writes: [status, facts.settlement, messages]
      outcomes: [settled, rejected, returned, pending]
      primaryOutcome: settled
hookPoints:
  - name: before-release
    type: halt
    description: A bank may hold or reject a payment after routing and before it leaves.
    contract:
      reads: [header, payment, facts.route, facts.reservation]
    policy: { timeout: PT1S, onFailure: fail-closed, onHold: p.hold.approval.v1 }
  - name: on-close
    type: notify
    description: A bank may be told that a payment has closed.
    contract:
      reads: [header, status, payment.instructedAmount, facts.route]
    policy: { timeout: PT10S, onFailure: fail-open }
signals: [pause, resume, cancel, re-screen]
parameters:
  endToEndBudget:
    type: duration
    default: PT10S
    description: Placeholder. The end-to-end time allowed for an instant payment. Set from the scheme rulebook.
deadline:
  after: PT10S
  do:
    - end: review
do:
  - use: p.seg.check-and-screen.v1
  - id: limits
    call: p.validate.limits.v1
    handle:
      repair: { end: rejected }
      reject: { end: rejected }
  - try:
      - id: reserve
        call: p.reserve.funds.v1
        policy: { attemptTimeout: PT2S, totalTimeout: PT4S, retry: { maxAttempts: 2, firstInterval: PT1S } }
        handle:
          insufficient: { end: rejected }
      - id: route
        call: p.decide.rail.v1
        handle:
          no-match: { end: rejected, compensate: all }
      - hook: before-release
      - id: leg
        slot: scheme-leg
        handle:
          rejected: { end: rejected, compensate: all }
          returned: { end: returned, compensate: all }
          pending: { end: review }
    compensate: all
  - id: post
    call: p.post.accounting.v1
    handle:
      rejected: { end: review }
      unknown:
        - id: verify
          call: p.post.verify.v1
          handle:
            mismatch: { end: review }
  - end: settled
finally:
  - id: notify
    call: p.notify.channel.v1
  - id: publish
    call: p.notify.publish-fact.v1
  - hook: on-close
provenance: { origin: factory, status: confirmed }
