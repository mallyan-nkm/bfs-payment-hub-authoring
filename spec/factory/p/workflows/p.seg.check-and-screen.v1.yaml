kind: workflow
wfKind: segment
name: p.seg.check-and-screen.v1
release: 1.1.0
dsl: 1.0.0
title: Check and screen
description: The shared check and screen stages for outward payments. Inlined into a platform workflow at publish. From 1.1.0 its canonical checks read the batch and its lines too, and refuse a file that names no currency on its batch or on each line (Issue I-294, R-09-231).
hookPoints:
  - name: after-validate
    type: halt
    description: A bank may hold or reject a valid payment before screening.
    contract:
      reads: [header, payment, batch, facts.validation]
    policy: { timeout: PT30S, onFailure: fail-closed, onHold: p.hold.approval.v1 }
  - name: enrich-before-screen
    type: transform
    description: A bank may add its own fields before screening.
    contract:
      reads: [header, payment, batch]
      writes: [ext.b]
    policy: { timeout: PT10S, onFailure: fail-open }
do:
  - id: validate
    call: p.validate.canonical.v2
    handle:
      repair:
        - id: repair
          call: p.hold.repair.v1
          handle:
            rejected: { end: rejected }
            expired: { end: rejected }
      reject: { end: rejected }
  - id: duplicate
    call: p.validate.duplicate.v1
    handle:
      duplicate: { end: rejected }
  - hook: after-validate
  - hook: enrich-before-screen
  - parallel:
      join: all
      branches:
        - - id: sanctions
            call: p.screen.sanctions.v1
            handle:
              hit:
                - id: sanctions-review
                  call: p.hold.approval.v1
                  handle:
                    declined: { end: rejected }
                    expired: { end: rejected }
              pending:
                - id: sanctions-wait
                  call: p.hold.approval.v1
                  handle:
                    declined: { end: rejected }
                    expired: { end: rejected }
        - - id: fraud
            call: p.screen.fraud.v1
            handle:
              suspect:
                - id: fraud-review
                  call: p.hold.approval.v1
                  handle:
                    declined: { end: rejected }
                    expired: { end: rejected }
provenance: { origin: factory, status: confirmed }
