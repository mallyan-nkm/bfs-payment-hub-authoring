kind: workflow
wfKind: platform
name: p.wf.request.v1
release: 1.0.0
dsl: 1.0.0
title: Requests and exceptions
description: A light lifecycle for processes that are not payments, such as a refund request, a recall or a request to pay. No reservation and no posting; the leg does the work.
entry:
  reads: [header, payment, batch, "items[]"]
exit:
  writes: [status]
  outcomes: [settled, rejected, review]
slots:
  - name: scheme-leg
    contract:
      reads: [header, payment, batch, "items[]"]
      writes: [status, facts.settlement, facts.posting, messages]
      outcomes: [settled, rejected, pending]
      primaryOutcome: settled
hookPoints:
  - name: on-close
    type: notify
    description: A bank may be told that a request has closed.
    contract:
      reads: [header, status]
    policy: { timeout: PT10S, onFailure: fail-open }
signals: [pause, resume, cancel]
do:
  - id: leg
    slot: scheme-leg
    handle:
      rejected: { end: rejected }
      pending: { end: review }
  - end: settled
finally:
  - id: notify
    call: p.notify.channel.v1
  - hook: on-close
provenance: { origin: factory, status: confirmed }
