# The temporal engine binding at 1.1.0. Settings here are placeholders. Engine bindings are released like every other
# artefact (owner's decision of 2026-11-22, Issue I-83): a change is a new release, never an edit of this file.
# 1.1.0: forEachConcurrency, the items of a forEach that holds no state run side by side (R-09-45).
kind: engine-binding
name: p.binding.temporal.v1
release: 1.1.0
target: temporal
strategy: interpreter
queues:
  p: th-p
  uae.p: th-uae-p
  uae.wps: th-uae-wps
  b: th-bank
taskNaming: "<name>@<release>"
defaults:
  queueTimeout: PT30S
  heartbeat: PT10S
  forEachChunk: 500
  forEachConcurrency: 64
  historyLimit: 10000
