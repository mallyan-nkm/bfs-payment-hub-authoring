# Written by hand (spec/CLAUDE.md, "Generated files"): reference data, effective-dated (R-01-25). A new edition is a new minor release.
kind: reference-table
name: b.ref.cut-offs.v1
release: 1.0.0
title: The bank's cut-off times
description: The time of a business day after which the bank takes a file of a scheme and direction for the next business
  day, or refuses it. Edited by the Bank Configurator and approved by the Bank Approver; it goes out in the bank's
  configuration release (R-11-52). Synthetic.
domain: cut-offs
key:
  - scheme
  - direction
columns:
  - id: scheme
    type: code
    title: Scheme
    required: true
    pattern: ^[a-z][a-z0-9]*\.[a-z][a-z0-9-]*$
  - id: direction
    type: code
    title: Direction
    required: true
    allowed:
      - inward
      - outward
  - id: cutOff
    type: code
    title: Cut-off (local time)
    required: true
    pattern: ^([01]\d|2[0-3]):[0-5]\d$
  - id: timeZone
    type: code
    title: Time zone
    required: true
    pattern: ^[A-Za-z]+/[A-Za-z_]+$
  - id: afterCutOff
    type: code
    title: After the cut-off
    required: true
    allowed:
      - next-business-day
      - refuse
editions:
  - validFrom: '2026-10-01'
    rows:
      - scheme: uae.wps
        direction: outward
        cutOff: '14:00'
        timeZone: Asia/Dubai
        afterCutOff: next-business-day
provenance:
  origin: authored
  status: confirmed
  note: Synthetic cut-off times of the example bank.
