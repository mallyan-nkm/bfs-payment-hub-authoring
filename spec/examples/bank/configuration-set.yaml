kind: configuration-set
tenant: example-bank
release: 1.4.0
title: Example bank configuration
accepts:
  - { scope: p, release: 1.4.0 }
  - { scope: uae.p, release: 1.4.0 }
  - { scope: uae.wps, release: 1.4.0 }
values:
  # A value, not a definition. The rule's bounds allow at most 1000000, so each value here tightens it.
  # The bank lowers its limit from 2027: a lookup by date (BANK-LIM-001 and BANK-LIM-002).
  - parameter: b.rule.internal-limit.v1#internalLimit
    value: 250000
    validFrom: "2026-01-01"
    validTo: "2026-12-31"
  - parameter: b.rule.internal-limit.v1#internalLimit
    value: 100000
    validFrom: "2027-01-01"
  - parameter: p.table.rail-choice.v1#enabledRails
    value: [uae.wps]
    validFrom: "2026-01-01"
  - parameter: uae.wps.rule.agent-is-this-bank.v1#ownRoutingCodes
    value: ["302620122"]
    validFrom: "2026-01-01"
  # The bank waits ten business days for WPS to acknowledge a returns file, not the default thirty calendar days
  # (Issues I-41, I-51): its own wait and its own calendar.
  - parameter: uae.wps.exchange.return-credits.v1#replyWait
    value: P10D
    validFrom: "2026-01-01"
  - parameter: uae.wps.exchange.return-credits.v1#replyWaitCalendar
    value: business
    validFrom: "2026-01-01"
  # The scheme's participant directory as the example bank knows it (Issue I-115): synthetic routing codes and names. A real
  # bank's directory names other banks, so it is set here, in the bank's configuration, never in shared content (L09).
  - parameter: uae.wps.table.participant-names.v1#participants
    value:
      - { routingCode: "203320101", name: Example Bank One }
      - { routingCode: "302620122", name: Example Bank Two }
    validFrom: "2026-01-01"
  # The refund order (R-12-20, Issue I-133): the bank's exchange rates and charges, synthetic values for the example bank only. A
  # real bank's charge slabs are its own and wait on the bank (Issue I-58); shared content sets none.
  - parameter: p.enrich.fx-rate.v1#rates
    value:
      - { from: AED, to: USD, rate: 0.2723 }
    validFrom: "2026-01-01"
  - parameter: p.enrich.charges.v1#chargeSlabs
    value:
      - { upTo: 1000, fixed: 5, percent: 0.1 }
      - { upTo: 1000000, fixed: 10, percent: 0.05 }
    validFrom: "2026-01-01"
  - parameter: p.enrich.charges.v1#minCharge
    value: 5
    validFrom: "2026-01-01"
  - parameter: p.enrich.charges.v1#maxCharge
    value: 250
    validFrom: "2026-01-01"
  - parameter: p.enrich.charges.v1#vatPercent
    value: 5
    validFrom: "2026-01-01"
  # The example bank's agent code in the names of the refund request instructions WPS sends it (synthetic).
  - parameter: uae.wps.map.rri-in.v1#fileNameAgentCode
    value: "999"
    validFrom: "2026-01-01"
bindings:
  - hookPoint: p.wf.corporate.v1#before-release
    hook: b.hook.pre-release-approval.v1
    release: 1.0.0
    validFrom: "2026-01-01"
  - hookPoint: p.seg.check-and-screen.v1#enrich-before-screen
    hook: b.hook.add-cost-centre.v1
    release: 1.0.0
    validFrom: "2026-01-01"
  - hookPoint: p.wf.corporate.v1#on-close
    hook: b.hook.treasury-notify.v1
    release: 1.0.0
    validFrom: "2026-01-01"
approval:
  maker: example.maker
  checker: example.checker
