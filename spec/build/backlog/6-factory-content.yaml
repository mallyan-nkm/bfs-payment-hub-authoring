group: Factory content
components:
  - id: C24
    title: Factory content, p and uae.p
    phase: 3
    purpose: Complete the platform and UAE cluster platform packs with scripts-behind and tests until they are publishable.
    design: [Part 12, Annex D, Part 3]
    schemas: [activity, rule, simulator, test-case, workflow]
    dependsOn: [C06, C07, C09, C10, C11, C23]
    dos: Packs p and uae.p meet R-12-06 and R-12-07 and publish through the release flow.
    stories:
      - id: C24-S1
        title: Scripts-behind for pure and read activities in p
        sp: 5
        story: As a shared designer, I want scripts-behind for the validate, enrich, decide and screen activities of p, so that the platform lifecycle runs in the studio.
        dod:
          - Each script uses the injected interface only and passes the authoring gates.
          - One test per outcome exists for each activity.
        dos: Every pure and read activity of p has green tests for every declared outcome.
      - id: C24-S2
        title: Scripts-behind for write and external activities in p
        sp: 5
        story: As a shared designer, I want scripts-behind for reserve, post, notify, hold and reconcile, so that money movement and its compensation are testable.
        needs: [C24-S1]
        dod:
          - Each script passes its idempotency key to the port; each compensation is tested after its forward step.
        dos: P-RES-001 and 002 pass, and a repeat call with the same key causes no second reservation in the simulator.
      - id: C24-S3
        title: Scripts-behind and tests for uae.p
        sp: 3
        story: As a shared designer, I want scripts-behind for the UAE cluster activities, so that both schemes share one tested set of UAE checks.
        needs: [C24-S1]
        dod:
          - The business date and participant lookup activities are scripted; the IBAN activity runs on the rule service. Each has a test per outcome.
          - No script names a scheme.
        dos: uae.p.validate.iban.v1 accepts a valid UAE IBAN and rejects a wrong check digit, a wrong length and a wrong country.
      - id: C24-S4
        title: Platform workflow tests
        sp: 5
        story: As a shared designer, I want at least one test per exit outcome of each platform workflow, so that the common lifecycle is proven with a stub leg.
        needs: [C24-S2]
        dod:
          - Corporate, commercial, inward and request workflows each have tests for settled, rejected, returned and review where they declare them.
          - Tests use a stub leg in the reserved cluster ck, so p depends on no scheme.
        dos: The publish check of C11-S5 reports no missing exit outcome for any workflow of p.
      - id: C24-S5
        title: Close the open points of Annex D
        sp: 3
        story: As a platform owner, I want each open point of Annex D decided or raised, so that p and uae.p stop being a draft.
        needs: [C24-S4]
        dod:
          - Each open point has a decision recorded in the annex or an owner and a date.
          - Budgets replace the placeholder timeouts where the owning system has stated them.
        dos: Annex D lists no open point without an owner, and both packs are published at 1.0.0.

  - id: C25
    title: Factory content, uae.wps
    phase: 3
    purpose: Take the WPS scheme pack from provisional contracts to a confirmed, tested pack.
    design: [Part 12, Annex A, Part 7]
    schemas: [scheme, activity, rule, simulator, test-case, workflow, extension]
    dependsOn: [C24, C13]
    dos: Every WPS message group in scope has a tested leg, and every provisional mark in Annex A is confirmed or corrected against the rulebook.
    stories:
      - id: C25-S1
        title: Confirm the pack against the current rulebook
        sp: 5
        story: As a scheme owner, I want every WPS record layout, file name rule and reason code checked against the current rulebook, so that the pack stops being provisional.
        dod:
          - Each provisional item of Annex A is marked confirmed or corrected, with the clause.
          - A correction is made as a new release, never as an edit of a published one.
        dos: Annex A lists no provisional item for the message groups in scope.
      - id: C25-S2
        title: Maps and round-trip tests
        sp: 5
        story: As a shared designer, I want scripts-behind for every WPS map with round-trip tests, so that file content is canonical inside and exact outside.
        needs: [C25-S1]
        dod:
          - Each inbound and outbound map has a script and a round-trip test from a real-shaped sample with no personal data.
        dos: WPS-MAP-001 and 002 pass, and each other map has a green round trip.
      - id: C25-S3
        title: Salary file out, end to end
        sp: 5
        story: As a shared designer, I want the employer-bank salary leg scripted and tested for every exit outcome, so that the largest WPS flow is proven.
        needs: [C25-S2]
        dod:
          - Scripts for the leg's map and exchange activities; tests for acknowledged, refused by WPS, no acknowledgement within the wait, a control total that does not match and a record with an invalid IBAN.
          - The submit composite and its subflow are tested alone.
        dos: WPS-OUT-001 to 005 pass with p.wf.corporate.v1, and WPS-EXC-001 and 002 pass.
      - id: C25-S4
        title: Agent payment in and returns
        sp: 5
        story: As a shared designer, I want the agent-side inward leg and the return leg scripted and tested, so that inward WPS always answers the scheme.
        needs: [C25-S2]
        dod:
          - The payment file and its supplementary file are paired by await, and the supplementary file gets its map; a refused file takes the refuse leg and is handed to operations.
        dos: WPS-IN-001 passes, and a test for a payment file addressed to another agent ends in the refuse leg with nothing sent.
      - id: C25-S5
        title: Refund request and settlement
        sp: 3
        story: As a shared designer, I want the refund leg scripted and tested, so that a refund order that is not a payment still runs as a governed request.
        needs: [C25-S3]
        dod:
          - The leg runs under p.wf.request.v1 and awaits the settlement file.
        dos: A refund test ends settled when the settlement file arrives and review when it does not.
      - id: C25-S6
        title: Planned message groups
        sp: 3
        story: As a scheme owner, I want each planned WPS message group decided as build, defer or out of scope, so that dispatch coverage is a decision and not a gap.
        needs: [C25-S1]
        dod:
          - Each of the four planned entries has a decision in Annex A; a build decision creates a story.
        dos: tools/validate.py shows no L10 warning for uae.wps, or each remaining one names its decision.
