            by: uae.wps.sub.return-credits.v1
            do:
              - id: return-credits.upload-hold
                wait:
                  parameter: uae.wps.exchange.return-credits.v1#uploadHold
                  default: PT0S
              - id: return-credits.send
                call: uae.wps.exchange.send-returns-file.v1
                handle:
                  rejected:
                    return: rejected
                  unknown:
                    return: pending
              - id: return-credits.await-ack
                await:
                  message: uae.wps.ack
                  correlateBy: header.fileId
                  family: rfa
                  timeout: P30D
                  timeoutParameter: uae.wps.exchange.return-credits.v1#replyWait
                  calendar: elapsed
                  calendarParameter: uae.wps.exchange.return-credits.v1#replyWaitCalendar
                  onTimeout:
                    return: pending
              - id: return-credits.read-ack
                call: uae.wps.map.ack-in.v1
                handle:
                  nak:
                    return: rejected
              - return: accepted
          handle:
            rejected:
