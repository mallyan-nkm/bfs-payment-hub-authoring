                  rejected:
                    end: pending
                  expired:
                    end: pending
              - end: pending
            unknown:
              - id: return-posting-unknown-operations
                call: p.hold.repair.v1
                handle:
                  rejected:
                    end: pending
                  expired:
                    end: pending
              - end: pending
  - switch:
      by:
        outcomeOf: report-disbursement
      cases:
        rejected:
          - end: pending
  - switch:
      by:
        decision: returnScope
      cases:
        whole-file:
          - end: returned
  - end: settled
provenance:
  origin: factory
  status: provisional
  clauses:
    - CBUAE WPS responsibility guide 2018
  note: From public sources. Items that fail to credit are reported in the disbursement file. A credit whose outcome
    is unknown is asked about before the returns are decided (Issue I-39). A credit the core system refused, or
    that the inquiry found not posted, is returned in one returns file (RFA); on ACK the return is recorded, on
    NAK it goes to operations. A partial return ends settled, a whole-file return ends returned (Issue I-40). Which
    credits are returned, and whether a payment file may have more than one returns file, still need the rulebook
    (D10). The supplementary file is held by reference; its map and the wait are to be confirmed.
