name: uae.wps.wf.agent-payment-in.v2
release: 2.0.0
dsl: 1.0.0
title: WPS payment file, bank as the agent
description: Waits for the supplementary file that pairs with the payment file, confirms receipt, waits for core
  banking's posting window, credits each employee and reports disbursement. Reports are exchanges that move no money.
  A credit whose outcome is unknown is asked about before the returns are decided. Credits that were refused go
  back to WPS in one returns file, after the disbursement file's ACK or its NAK; once WPS accepts it, the return
  is recorded. A partial return ends settled, a whole-file return ends returned.
direction: inward
implements:
  slot: scheme-leg
  of:
    - p.wf.inward.v1
entry:
  reads:
    - header
    - batch
    - items[]
    - ext.uae.wps
    - facts.disposition
exit:
  writes:
    - status
    - facts.posting
    - facts.returns
    - messages
  outcomes:
    - settled
    - rejected
    - returned
    - pending
do:
  - id: supplement
    block:
      of: uae.wps.exchange.receive-supplement.v1
      by: uae.wps.sub.receive-supplement.v1
      do:
        - id: supplement.await-supplement
          await:
            message: uae.wps.psi
            correlateBy: header.fileId
            timeout: PT4H
            onTimeout:
              return: missing
        - return: received
    handle:
      missing:
        end: pending
  - id: file-checks
    call: uae.wps.validate.payment-file.v1
    handle:
      reject:
        end: pending
  - id: render-receipt
    call: uae.wps.map.prc-out.v2
    handle:
      unmappable:
        end: pending
  - id: confirm-receipt
    block:
      of: uae.wps.exchange.confirm-receipt.v1
      by: uae.wps.sub.confirm-receipt.v1
      do:
        - id: confirm-receipt.send
          call: uae.wps.exchange.send-receipt-confirmation.v1
          handle:
            rejected:
              return: rejected
            unknown:
              return: pending
        - id: confirm-receipt.await-ack
          await:
            message: uae.wps.ack
            correlateBy: header.fileId
            family: prc
            timeout: P1D
            calendar: business
            onTimeout:
              return: pending
        - id: confirm-receipt.read-ack
          call: uae.wps.map.ack-in.v1
          handle:
            nak:
              return: rejected
        - return: accepted
    handle:
      rejected:
        end: pending
      pending:
        end: pending
  - id: posting-window
    block:
      of: p.decide.await-posting-window.v1
      by: p.sub.await-posting-window.v1
      do:
        - loop:
            max: 96
            every: PT15M
            until:
              outcomeOf: posting-window.window
              in:
                - open
            do:
              - id: posting-window.window
                call: p.decide.posting-window.v1
                handle:
                  closed:
                    continue: true
        - switch:
            by:
              outcomeOf: posting-window.window
            cases:
              closed:
                - return: closed
        - return: open
    handle:
      closed:
        end: pending
  - forEach:
      in: items[]
      onItemFailure: continue
      do:
        - id: credit
          call: p.post.accounting.v1
          level: item
          handle:
            rejected:
              continue: true
            unknown:
              - id: verify-credit
                call: p.post.verify.v1
                level: item
                handle:
                  mismatch:
                    continue: true
  - id: render-disbursement
    call: uae.wps.map.dif-out.v2
    handle:
      unmappable:
        end: pending
  - id: report-disbursement
    block:
      of: uae.wps.exchange.report-disbursement.v1
      by: uae.wps.sub.report-disbursement.v1
      do:
        - id: report-disbursement.send
          call: uae.wps.exchange.send-disbursement-file.v1
          handle:
            rejected:
              return: rejected
            unknown:
              return: pending
        - id: report-disbursement.await-ack
          await:
            message: uae.wps.ack
            correlateBy: header.fileId
            family: dif
            timeout: P1D
            calendar: business
            onTimeout:
              return: pending
        - id: report-disbursement.read-ack
          call: uae.wps.map.ack-in.v1
          handle:
            nak:
              return: rejected
        - return: accepted
    handle:
      rejected:
        continue: true
      pending:
        end: pending
  - id: returns
    call: uae.wps.decide.returns.v2
    handle:
      unverified:
        - id: unverified-operations
          call: p.hold.repair.v1
          handle:
            rejected:
