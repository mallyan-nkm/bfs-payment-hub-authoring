name: uae.wps.wf.salary-file-out.v1
release: 1.0.0
dsl: 1.0.0
title: WPS salary file, bank as the employer's bank
description: Sets the business date, validates the file and each record, and submits the file to WPS. The submit
  step is a composite. It sends, waits for the acknowledgement and reads it.
direction: outward
implements:
  slot: scheme-leg
  of:
    - p.wf.corporate.v1
entry:
  reads:
    - header
    - batch
    - items[]
    - ext.uae.wps
    - facts.reservation
exit:
  writes:
    - status
    - messages
  outcomes:
    - settled
    - rejected
    - returned
    - pending
do:
  - id: business-date
    call: uae.p.enrich.business-date.v1
  - id: file-checks
    call: uae.wps.validate.salary-file.v1
    handle:
      repair:
        end: rejected
      reject:
        end: rejected
  - forEach:
      in: items[]
      onItemFailure: stop
      do:
        - id: record-checks
          call: uae.wps.validate.salary-record.v1
          level: item
          handle:
            reject:
              end: rejected
        - id: record-iban
          call: uae.p.validate.iban.v1
          level: item
          handle:
            reject:
              end: rejected
  - id: render
    call: uae.wps.map.sif-out.v1
    handle:
      unmappable:
        end: rejected
  - id: submit
    block:
      of: uae.wps.exchange.submit-salary-file.v1
      by: uae.wps.sub.submit-salary-file.v1
      do:
        - id: submit.send
          call: uae.wps.exchange.send-salary-file.v1
          handle:
            rejected:
              return: rejected
            unknown:
              return: pending
        - id: submit.await-ack
          await:
            message: uae.wps.ack
            correlateBy: header.fileId
            family: sif
            timeout: P1D
            timeoutParameter: uae.wps.exchange.submit-salary-file.v1#ackWait
            calendar: business
            calendarParameter: uae.wps.exchange.submit-salary-file.v1#ackWaitCalendar
            onTimeout:
              return: pending
        - id: submit.read-ack
          call: uae.wps.map.ack-in.v1
          handle:
            nak:
              return: rejected
        - return: accepted
    handle:
      rejected:
        end: rejected
      pending:
        end: pending
  - end: settled
