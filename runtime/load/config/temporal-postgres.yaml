# enable-template
# The load harness's Temporal server on PostgreSQL (runtime/load, R-09-30): the same server binary, shards, connection
# pools, ports and dynamic config as temporal-mssql/config/development-sqlserver.yaml, with Temporal's own postgres12
# plugin in place of ours, so the two persistence stores are compared on equal terms.
#
# Set by environment (defaults in brackets):
#   TEMPORAL_PG_ADDR             host:port of PostgreSQL [127.0.0.1:5432]
#   TEMPORAL_PG_USER             [postgres]
#   TEMPORAL_PG_PASSWORD         (no default; required)
#   TEMPORAL_DB / TEMPORAL_VISIBILITY_DB  database names [temporal / temporal_visibility]
#   TEMPORAL_PORT_OFFSET         added to every port, to run several servers on one host [0]:
#                                frontend gRPC 7233, HTTP 7243, history 7234, matching 7235,
#                                worker 7239, membership 6933 to 6939, metrics 8000
#   TEMPORAL_DYNAMIC_CONFIG      dynamic config file (required: temporal.sh passes temporal-mssql/config/dynamicconfig/development-sqlserver.yaml)
log:
  stdout: true
  level: {{ env "TEMPORAL_LOG_LEVEL" | default "info" }}

persistence:
  defaultStore: postgres-default
  visibilityStore: postgres-visibility
  numHistoryShards: 4
  datastores:
    postgres-default:
      sql:
        pluginName: "postgres12"
        databaseName: "{{ env "TEMPORAL_DB" | default "temporal" }}"
        connectAddr: "{{ env "TEMPORAL_PG_ADDR" | default "127.0.0.1:5432" }}"
        connectProtocol: "tcp"
        user: "{{ env "TEMPORAL_PG_USER" | default "postgres" }}"
        password: "{{ env "TEMPORAL_PG_PASSWORD" }}"
        maxConns: 20
        maxIdleConns: 20
        maxConnLifetime: "1h"
    postgres-visibility:
      sql:
        pluginName: "postgres12"
        databaseName: "{{ env "TEMPORAL_VISIBILITY_DB" | default "temporal_visibility" }}"
        connectAddr: "{{ env "TEMPORAL_PG_ADDR" | default "127.0.0.1:5432" }}"
        connectProtocol: "tcp"
        user: "{{ env "TEMPORAL_PG_USER" | default "postgres" }}"
        password: "{{ env "TEMPORAL_PG_PASSWORD" }}"
        maxConns: 10
        maxIdleConns: 10
        maxConnLifetime: "1h"

global:
  membership:
    maxJoinDuration: 30s
    broadcastAddress: "127.0.0.1"
  metrics:
    prometheus:
      framework: "tally"
      timerType: "histogram"
      listenAddress: "127.0.0.1:{{ add 8000 (env "TEMPORAL_PORT_OFFSET" | default "0" | atoi) }}"

services:
  frontend:
    rpc:
      grpcPort: {{ add 7233 (env "TEMPORAL_PORT_OFFSET" | default "0" | atoi) }}
      membershipPort: {{ add 6933 (env "TEMPORAL_PORT_OFFSET" | default "0" | atoi) }}
      bindOnIP: "{{ env "TEMPORAL_BIND_IP" | default "127.0.0.1" }}"
      httpPort: {{ add 7243 (env "TEMPORAL_PORT_OFFSET" | default "0" | atoi) }}

  matching:
    rpc:
      grpcPort: {{ add 7235 (env "TEMPORAL_PORT_OFFSET" | default "0" | atoi) }}
      membershipPort: {{ add 6935 (env "TEMPORAL_PORT_OFFSET" | default "0" | atoi) }}
      bindOnLocalHost: true

  history:
    rpc:
      grpcPort: {{ add 7234 (env "TEMPORAL_PORT_OFFSET" | default "0" | atoi) }}
      membershipPort: {{ add 6934 (env "TEMPORAL_PORT_OFFSET" | default "0" | atoi) }}
      bindOnLocalHost: true

  worker:
    rpc:
      grpcPort: {{ add 7239 (env "TEMPORAL_PORT_OFFSET" | default "0" | atoi) }}
      membershipPort: {{ add 6939 (env "TEMPORAL_PORT_OFFSET" | default "0" | atoi) }}
      bindOnLocalHost: true

clusterMetadata:
  enableGlobalNamespace: false
  failoverVersionIncrement: 10
  masterClusterName: "active"
  currentClusterName: "active"
  clusterInformation:
    active:
      enabled: true
      initialFailoverVersion: 1
      rpcName: "frontend"
      rpcAddress: "127.0.0.1:{{ add 7233 (env "TEMPORAL_PORT_OFFSET" | default "0" | atoi) }}"

dcRedirectionPolicy:
  policy: "noop"

dynamicConfigClient:
  filepath: "{{ env "TEMPORAL_DYNAMIC_CONFIG" }}"
  pollInterval: "10s"
