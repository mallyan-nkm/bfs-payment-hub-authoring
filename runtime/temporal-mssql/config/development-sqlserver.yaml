# enable-template
# A single-node development Temporal server with persistence and visibility on SQL Server 2022.
# After config/development-postgres12.yaml of go.temporal.io/server v1.32.2.
#
# Set by environment (defaults in brackets):
#   TEMPORAL_SQLSERVER_ADDR      host:port of SQL Server [127.0.0.1:1433]
#   TEMPORAL_SQLSERVER_USER      [sa]
#   TEMPORAL_SQLSERVER_PASSWORD  (no default; required)
#   TEMPORAL_SQLSERVER_ATTRS     extra go-mssqldb URL parameters, for example "encrypt=true" [none]
#   TEMPORAL_DB / TEMPORAL_VISIBILITY_DB  database names [temporal / temporal_visibility]
#   TEMPORAL_PORT_OFFSET         added to every port, to run several servers on one host [0]:
#                                frontend gRPC 7233, HTTP 7243, history 7234, matching 7235,
#                                worker 7239, membership 6933 to 6939, metrics 8000
#   TEMPORAL_DYNAMIC_CONFIG      dynamic config file [config/dynamicconfig/development-sqlserver.yaml]
log:
  stdout: true
  level: {{ env "TEMPORAL_LOG_LEVEL" | default "info" }}

persistence:
  defaultStore: sqlserver-default
  visibilityStore: sqlserver-visibility
  numHistoryShards: 4
  datastores:
    sqlserver-default:
      sql:
        pluginName: "sqlserver"
        databaseName: "{{ env "TEMPORAL_DB" | default "temporal" }}"
        connectAddr: "{{ env "TEMPORAL_SQLSERVER_ADDR" | default "127.0.0.1:1433" }}"
        connectProtocol: "tcp"
        user: "{{ env "TEMPORAL_SQLSERVER_USER" | default "sa" }}"
        password: "{{ env "TEMPORAL_SQLSERVER_PASSWORD" }}"
        {{- with env "TEMPORAL_SQLSERVER_ATTRS" }}
        connectAttributes:
          {{- range splitList "&" . }}
          {{ (splitList "=" .) | first }}: "{{ (splitList "=" .) | last }}"
          {{- end }}
        {{- end }}
        maxConns: 20
        maxIdleConns: 20
        maxConnLifetime: "1h"
    sqlserver-visibility:
      sql:
        pluginName: "sqlserver"
        databaseName: "{{ env "TEMPORAL_VISIBILITY_DB" | default "temporal_visibility" }}"
        connectAddr: "{{ env "TEMPORAL_SQLSERVER_ADDR" | default "127.0.0.1:1433" }}"
        connectProtocol: "tcp"
        user: "{{ env "TEMPORAL_SQLSERVER_USER" | default "sa" }}"
        password: "{{ env "TEMPORAL_SQLSERVER_PASSWORD" }}"
        {{- with env "TEMPORAL_SQLSERVER_ATTRS" }}
        connectAttributes:
          {{- range splitList "&" . }}
          {{ (splitList "=" .) | first }}: "{{ (splitList "=" .) | last }}"
          {{- end }}
        {{- end }}
        maxConns: 10
        maxIdleConns: 10
        maxConnLifetime: "1h"

global:
  membership:
    maxJoinDuration: 30s
    broadcastAddress: "127.0.0.1"
  metrics:
    prometheus:
      framework: "tally"
      timerType: "histogram"
      listenAddress: "127.0.0.1:{{ add 8000 (env "TEMPORAL_PORT_OFFSET" | default "0" | atoi) }}"

services:
  frontend:
    rpc:
      grpcPort: {{ add 7233 (env "TEMPORAL_PORT_OFFSET" | default "0" | atoi) }}
      membershipPort: {{ add 6933 (env "TEMPORAL_PORT_OFFSET" | default "0" | atoi) }}
      bindOnIP: "{{ env "TEMPORAL_BIND_IP" | default "127.0.0.1" }}"
      httpPort: {{ add 7243 (env "TEMPORAL_PORT_OFFSET" | default "0" | atoi) }}

  matching:
    rpc:
      grpcPort: {{ add 7235 (env "TEMPORAL_PORT_OFFSET" | default "0" | atoi) }}
      membershipPort: {{ add 6935 (env "TEMPORAL_PORT_OFFSET" | default "0" | atoi) }}
      bindOnLocalHost: true

  history:
    rpc:
      grpcPort: {{ add 7234 (env "TEMPORAL_PORT_OFFSET" | default "0" | atoi) }}
      membershipPort: {{ add 6934 (env "TEMPORAL_PORT_OFFSET" | default "0" | atoi) }}
      bindOnLocalHost: true

  worker:
    rpc:
      grpcPort: {{ add 7239 (env "TEMPORAL_PORT_OFFSET" | default "0" | atoi) }}
      membershipPort: {{ add 6939 (env "TEMPORAL_PORT_OFFSET" | default "0" | atoi) }}
      bindOnLocalHost: true

clusterMetadata:
  enableGlobalNamespace: false
  failoverVersionIncrement: 10
  masterClusterName: "active"
  currentClusterName: "active"
  clusterInformation:
    active:
      enabled: true
      initialFailoverVersion: 1
      rpcName: "frontend"
      rpcAddress: "127.0.0.1:{{ add 7233 (env "TEMPORAL_PORT_OFFSET" | default "0" | atoi) }}"

dcRedirectionPolicy:
  policy: "noop"

dynamicConfigClient:
  filepath: "{{ env "TEMPORAL_DYNAMIC_CONFIG" | default "config/dynamicconfig/development-sqlserver.yaml" }}"
  pollInterval: "10s"
