# Generated by runtime/observability/slo/build_rules.py from targets.yaml. Edit the targets, then run it again.
groups:
- name: transacthub-slo-recording
  interval: 30s
  rules:
  - record: th:payment_lines:rate5m
    expr: sum(rate(th_payment_lines_total[5m]))
  - record: th:payments_open:by_distribution
    expr: max by (th_distribution) (th_payments_open)
- name: transacthub-slo-alerts
  interval: 30s
  rules:
  - alert: TransactHubLineThroughputBelowTarget
    expr: sum(rate(th_payment_lines_total[5m])) < 50 and sum(th_queue_in_flight) > 0
    for: 15m
    labels:
      severity: warning
      slo: throughput
    annotations:
      summary: Lines end slower than 50 a second while attempts wait on the queues
      description: The agreed target is 50 lines a second sustained, each runtime node at 4 or more cores (I-108). Check the workers' queues,
        the engine's and the store's dashboards, and the nodes' cores.
      runbook: '#/service/errors/TransientError'
  - alert: TransactHubAckDue
    expr: max by (th_tenant, th_scheme, th_message) (th_await_oldest_seconds{th_scheme="uae.wps",th_message="uae.wps.sif"}) > 64800
    for: 5m
    labels:
      severity: warning
      slo: ack-wait
      scheme: uae.wps
    annotations:
      summary: A uae.wps.sif file has waited more than 75% of its wait for its acknowledgement
      description: The wait is the bank's value of uae.wps.exchange.submit-salary-file.v1#ackWait, by default P1D (R-05-47); the payment goes
        pending when it passes.
      runbook: '#/service/errors/Timeout'
  - alert: TransactHubAckOverdue
    expr: max by (th_tenant, th_scheme, th_message) (th_await_oldest_seconds{th_scheme="uae.wps",th_message="uae.wps.sif"}) > 86400
    for: 5m
    labels:
      severity: critical
      slo: ack-wait
      scheme: uae.wps
    annotations:
      summary: A uae.wps.sif file has waited past its wait for its acknowledgement
      description: The wait is the bank's value of uae.wps.exchange.submit-salary-file.v1#ackWait, by default P1D (R-05-47); the payment goes
        pending when it passes.
      runbook: '#/service/errors/Timeout'
  - alert: TransactHubHoldDue
    expr: max by (th_tenant, th_hold_kind) (th_holds_oldest_seconds) > 69120
    for: 5m
    labels:
      severity: warning
      slo: hold-expiry
    annotations:
      summary: A hold has waited more than 80% of its expiry for a decision
      description: The expiry is p.hold.approval.v1#expiry, by default P1D (R-05-56). Decide the hold in the operations console before it expires.
      runbook: '#/service/errors/ops.HoldClosed'
  - alert: TransactHubHoldExpired
    expr: sum by (th_tenant) (increase(th_holds_expired_total[1h])) > 0
    labels:
      severity: critical
      slo: hold-expiry
    annotations:
      summary: A hold reached its expiry with no decision
      description: A hold is decided before its expiry (R-05-56). The payment took its expired path.
      runbook: '#/service/errors/ops.HoldClosed'
