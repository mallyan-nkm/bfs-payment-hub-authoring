# The local monitoring stack for development (R-09-29, I-66; docs/north-star/guidelines/observability.md). It is not an
# installation's: a bank runs its own collector and backends, and the hosts reach them by the standard OTEL_* variables.
#
#   docker compose -f runtime/observability/docker-compose.yml up -d
#   export OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:14318 OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
#   ... run the studio, a deployment, the release API or the load harness ...
#   Grafana http://127.0.0.1:13000 (dashboards Payments, Engines, Ports, Store), Jaeger http://127.0.0.1:16686,
#   Prometheus http://127.0.0.1:19090
#   docker compose -f runtime/observability/docker-compose.yml down -v
#
# The collector takes OTLP on 127.0.0.1:14317 (gRPC) and 14318 (HTTP), so it never clashes with the studio's 4317.
# Prometheus runs on the host's network so it can scrape the Temporal servers' own metrics (127.0.0.1:8000 plus each
# server's port offset), the persistence metrics of our SQL Server plugin among them; Grafana does too, to reach it.
# Every image is pinned by tag and digest. Nothing here holds a secret: Grafana's admin password is for this local
# stack only and anonymous viewing is on.
name: th-observability
services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:14317:4317"
      - "127.0.0.1:14318:4318"
      - "127.0.0.1:18889:8889"
    depends_on: [jaeger, loki]
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    ports:
      - "127.0.0.1:16686:16686"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "127.0.0.1:13100:3100"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    network_mode: host
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.listen-address=127.0.0.1:19090", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.5@sha256:9f7aa1e1e3246aade5792d35a738049f7f32f89cd51d1956cf426a4e86268a84
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "13000"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: local-stack-only
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    restart: unless-stopped
