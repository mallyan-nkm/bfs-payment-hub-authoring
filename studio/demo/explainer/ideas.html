<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The ideas, explained</title>
<style>
/* A 1280 by 720 stage for recording. The narration drives it through window.K: each line of the
   voice clears or adds cards, arrows, notes and a moving order ticket. */
/* The look follows the apps' Fluent UI 2 theme (docs/adr/0003-ui-fluent.md): a deep navy top bar with the teal mark,
   Fluent's neutral page and card surfaces, and the navy brand colour for recipes and titles. */
:root {
  --bg: #f5f5f5; --ink: #242424; --muted: #616161; --line: #c7cfd9; --card: #ffffff; --navy: #0f4c81; --bar: #0f2d4f; --teal: #5fd3c5;
  --station: #0b7a6e; --rule: #b26b00; --recipe: #0f4c81; --door: #5c4bb0; --scheme: #b8432f;
  --bank: #2f7d32; --safety: #4f5b6b; --test: #a23a74; --run: #1b6fa8; --ticket: #e8a33d;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Segoe UI", "Noto Sans", system-ui, -apple-system, sans-serif; }
#bar { position: absolute; left: 0; top: 0; width: 1280px; height: 40px; background: var(--bar); color: #fff; display: flex; align-items: center; gap: 10px; padding: 0 20px;
  font: 600 15px/1 "Segoe UI", "Noto Sans", system-ui, sans-serif; letter-spacing: .01em; z-index: 1; }
#bar .mark { background: var(--teal); color: var(--bar); border-radius: 4px; padding: 5px 6px; font: 700 12px/1 system-ui; }
#bar .what { color: #c9d9ec; font-weight: 400; }
#title { position: absolute; left: 60px; top: 58px; right: 60px; display: flex; align-items: baseline; gap: 16px; }
#title .num { font: 700 18px/1 system-ui; color: #fff; background: var(--navy); border-radius: 4px; padding: 6px 10px; box-shadow: inset 0 -3px 0 var(--teal); }
#title h1 { font: 600 30px/1.1 "Segoe UI", "Noto Sans", system-ui, sans-serif; margin: 0; color: var(--bar); }
#title .sub { font-size: 18px; color: var(--muted); }
#stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
svg#lines { position: absolute; inset: 0; width: 1280px; height: 720px; pointer-events: none; }
.card { position: absolute; background: var(--card); border-radius: 8px; box-shadow: 0 0 2px rgba(0,0,0,.12), 0 4px 8px rgba(0,0,0,.10);
  padding: 14px 16px 14px 16px; display: flex; gap: 14px; align-items: center; border-left: 5px solid var(--c);
  opacity: 0; transform: translateY(14px) scale(.96); transition: opacity .7s ease, transform .7s ease, box-shadow .4s ease; }
.card.on { opacity: 1; transform: none; }
.card.lit { box-shadow: 0 0 0 4px var(--ticket), 0 8px 16px rgba(0,0,0,.16); }
.card.dim { opacity: .35; }
.card svg { width: 46px; height: 46px; flex: none; color: var(--c); }
.card .k { font: 600 21px/1.2 "Segoe UI", "Noto Sans", system-ui, sans-serif; }
.card .r { margin-top: 5px; display: inline-block; font: 600 13px/1 system-ui; letter-spacing: .06em; text-transform: uppercase; color: #fff; background: var(--c); border-radius: 999px; padding: 5px 9px; }
.card .d { margin-top: 6px; font-size: 15px; color: var(--muted); line-height: 1.35; }
.note { position: absolute; font: 500 20px/1.4 "Segoe UI", "Noto Sans", system-ui, sans-serif; color: var(--ink); background: #e8f8f6; border-left: 5px solid var(--teal); padding: 10px 14px; border-radius: 4px;
  opacity: 0; transition: opacity .7s ease; max-width: 560px; }
.note.on { opacity: 1; }
.pill { position: absolute; font: 600 15px/1 system-ui; padding: 7px 11px; border-radius: 999px; background: var(--c); color: #fff; opacity: 0; transition: opacity .6s; }
.pill.on { opacity: 1; }
#ticket { position: absolute; width: 44px; height: 30px; margin: -15px 0 0 -22px; background: var(--ticket); border-radius: 5px; box-shadow: 0 3px 8px rgba(0,0,0,.25);
  display: none; z-index: 5; }
#ticket::before { content: ""; position: absolute; left: 8px; right: 8px; top: 8px; height: 3px; background: rgba(255,255,255,.85); box-shadow: 0 6px 0 rgba(255,255,255,.85); border-radius: 2px; }
path.arrow { fill: none; stroke: var(--line); stroke-width: 3.5; stroke-linecap: round; transition: stroke-dashoffset 1.1s ease; }
path.arrow.lit { stroke: var(--ticket); }
text.alabel { font: 600 14px system-ui; fill: var(--muted); }
.legend { position: absolute; right: 40px; bottom: 112px; font: 500 14px system-ui; color: var(--muted); }
</style>
</head>
<body>
<div id="stage">
  <div id="bar"><span class="mark">TH</span>TransactHub <span class="what">the ideas, explained</span></div>
  <svg id="lines"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c7cfd9"/></marker>
  <marker id="headlit" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8a33d"/></marker></defs></svg>
  <div id="title"></div>
  <div id="ticket"></div>
</div>
<script>
// Simple line icons, 24 by 24, drawn in the card's colour.
const I = {
  kitchen: '<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>',
  ticket: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  pot: '<path d="M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M2 10h20"/><path d="M9 6c0-1 1-2 1-3M13 6c0-1 1-2 1-3"/>',
  check: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2"/><path d="m8.5 12 2 2 4-4"/>',
  chart: '<rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 9h18M3 14h18M9 4v16M15 4v16"/>',
  dial: '<circle cx="12" cy="13" r="8"/><path d="M12 13l4-4"/><path d="M6 6.5 4.5 5M18 6.5 19.5 5"/>',
  recipe: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h1M11 8h5M8 12h1M11 12h5M8 16h1M11 16h5"/>',
  box: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 7l3-4h12l3 4"/><rect x="6" y="11" width="4" height="5"/><rect x="14" y="11" width="4" height="5"/>',
  door: '<rect x="6" y="3" width="12" height="18" rx="1"/><circle cx="15" cy="12" r="1"/><path d="M3 21h18"/>',
  actor: '<circle cx="12" cy="7" r="3.5"/><path d="M5 21c0-4 3-7 7-7s7 3 7 7"/><path d="M17 4l3-1v4"/>',
  talk: '<path d="M3 5h11v7H8l-3 3V12H3z"/><path d="M14 9h7v7h-2v3l-3-3h-5v-3"/>',
  allergy: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M12 8l4 7H8z"/><path d="M12 11v2"/>',
  desk: '<path d="M3 9h18v4H3z"/><path d="M5 13v7M19 13v7"/><path d="M8 9V5h8v4"/>',
  gap: '<rect x="3" y="5" width="18" height="14" rx="2" stroke-dasharray="3 3"/><path d="M9 12h6"/>',
  piece: '<path d="M4 8h4a2 2 0 1 1 4 0h4v4a2 2 0 1 1 0 4v4H4z"/>',
  network: '<circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M11 7 6 16M13 7l5 9M7.5 18h9"/>',
  store: '<path d="M3 9l2-5h14l2 5"/><path d="M4 9v11h16V9"/><path d="M3 9h18"/><path d="M10 20v-6h4v6"/>',
  plug: '<path d="M9 3v5M15 3v5"/><path d="M6 8h12v3a6 6 0 0 1-12 0z"/><path d="M12 17v4"/>',
  people: '<circle cx="8" cy="8" r="3"/><circle cx="17" cy="8" r="3"/><path d="M2 20c0-3 3-6 6-6s6 3 6 6M12 20c0-3 2-6 5-6s5 3 5 6"/>',
  books: '<rect x="3" y="4" width="5" height="16"/><rect x="9.5" y="4" width="5" height="16"/><path d="M16 5l4 1-3 15-4-1"/>',
  chain: '<path d="M10 14a4 4 0 0 1 0-5.7l2-2a4 4 0 0 1 5.7 5.7l-1 1"/><path d="M14 10a4 4 0 0 1 0 5.7l-2 2a4 4 0 0 1-5.7-5.7l1-1"/>',
  log: '<path d="M5 3h11l3 3v15H5z"/><path d="M9 9h6M9 13h6M9 17h3"/>',
  watch: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M10 2h4"/>',
  report: '<rect x="5" y="3" width="14" height="18" rx="1"/><path d="M8 7h8M8 11h8M8 15h5"/><path d="m13 17 2 2 3-4"/>',
  crate: '<path d="M3 8 12 4l9 4v9l-9 4-9-4z"/><path d="M3 8l9 4 9-4M12 12v9"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
  hat: '<path d="M6 14h12v6H6z"/><path d="M6 14c-3 0-4-3-2-5 1-1 3-1 4 0 0-3 2-5 4-5s4 2 4 5c1-1 3-1 4 0 2 2 1 5-2 5"/>',
  blueprint: '<rect x="3" y="4" width="18" height="16" rx="1"/><path d="M7 16V8h5v4h5v4z"/>',
  // Used by the architecture video (demo/architecture.ts).
  db: '<ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v13c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-13"/><path d="M4.5 12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8"/>',
  lock: '<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/>',
  file: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/>',
  branch: '<circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="8" r="2.2"/><path d="M6 7.2v9.6M18 10.2c0 4-6 3-11.2 7"/>',
  shield: '<path d="M12 3 4.5 6v6c0 4.5 3.2 7.7 7.5 9 4.3-1.3 7.5-4.5 7.5-9V6z"/><path d="m8.8 12 2.2 2.2 4.3-4.4"/>',
  globe: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.6 2.6 14.4 0 17M12 3.5c-2.6 2.6-2.6 14.4 0 17"/>',
  layers: '<path d="M12 3 3 8l9 5 9-5z"/><path d="m3 12.5 9 5 9-5"/><path d="m3 17 9 5 9-5"/>',
};
const svgIcon = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${I[n] || ''}</svg>`;
const COLORS = { station: 'var(--station)', rule: 'var(--rule)', recipe: 'var(--recipe)', door: 'var(--door)', scheme: 'var(--scheme)', bank: 'var(--bank)', safety: 'var(--safety)', test: 'var(--test)', run: 'var(--run)', ticket: 'var(--ticket)' };
const stage = document.getElementById('stage');
const lines = document.getElementById('lines');
const els = {};

const K = {
  /** Start a chapter: clear the stage and set its title. */
  chapter(num, title, sub = '') {
    for (const k of Object.keys(els)) { els[k].remove(); delete els[k]; }
    document.getElementById('ticket').style.display = 'none';
    document.getElementById('title').innerHTML = `<span class="num">${num}</span><h1>${title}</h1><span class="sub">${sub}</span>`;
  },
  /** A card: icon, the kitchen word, the real name, an optional line of description. */
  card(id, { x, y, w = 300, icon, k, r, d = '', c = 'station' }) {
    const el = document.createElement('div');
    el.className = 'card';
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px';
    el.style.setProperty('--c', COLORS[c] || c);
    el.innerHTML = `${svgIcon(icon)}<div><div class="k">${k}</div>${r ? `<div class="r">${r}</div>` : ''}${d ? `<div class="d">${d}</div>` : ''}</div>`;
    stage.appendChild(el); els[id] = el;
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
  },
  note(id, text, { x, y, w = 520 }) {
    const el = document.createElement('div');
    el.className = 'note'; el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.maxWidth = w + 'px';
    el.innerHTML = text; stage.appendChild(el); els[id] = el;
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
  },
  pill(id, text, { x, y, c = 'station' }) {
    const el = document.createElement('div');
    el.className = 'pill'; el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.setProperty('--c', COLORS[c] || c);
    el.textContent = text; stage.appendChild(el); els[id] = el;
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
  },
  /** An arrow from the edge of one card to the edge of another, drawn in. */
  arrow(id, from, to, { label = '', bend = 0, side = 'auto' } = {}) {
    const a = els[from].getBoundingClientRect(), b = els[to].getBoundingClientRect();
    const ac = { x: a.left + a.width / 2, y: a.top + a.height / 2 }, bc = { x: b.left + b.width / 2, y: b.top + b.height / 2 };
    const horiz = side === 'h' || (side === 'auto' && Math.abs(bc.x - ac.x) > Math.abs(bc.y - ac.y));
    const p1 = horiz ? { x: bc.x > ac.x ? a.right + 6 : a.left - 6, y: ac.y } : { x: ac.x, y: bc.y > ac.y ? a.bottom + 6 : a.top - 6 };
    const p2 = horiz ? { x: bc.x > ac.x ? b.left - 8 : b.right + 8, y: bc.y } : { x: bc.x, y: bc.y > ac.y ? b.top - 8 : b.bottom + 8 };
    const mx = (p1.x + p2.x) / 2 + (horiz ? 0 : bend), my = (p1.y + p2.y) / 2 + (horiz ? bend : 0);
    const d = `M${p1.x},${p1.y} Q${mx},${my} ${p2.x},${p2.y}`;
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d); p.setAttribute('class', 'arrow'); p.setAttribute('marker-end', 'url(#head)');
    lines.appendChild(p);
    const len = p.getTotalLength(); p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
    requestAnimationFrame(() => requestAnimationFrame(() => (p.style.strokeDashoffset = 0)));
    els[id] = p; p.__from = from; p.__to = to;
    if (label) {
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      const mid = p.getPointAtLength(len / 2);
      t.setAttribute('x', mid.x + 6); t.setAttribute('y', mid.y - 8); t.setAttribute('class', 'alabel'); t.textContent = label;
      lines.appendChild(t); els[id + ':l'] = t;
    }
  },
  light(...ids) { for (const id of ids) { const e = els[id]; if (!e) continue; if (e.tagName === 'path') { e.classList.add('lit'); e.setAttribute('marker-end', 'url(#headlit)'); } else e.classList.add('lit'); } },
  unlight(...ids) { for (const id of ids) { const e = els[id]; if (!e) continue; if (e.tagName === 'path') { e.classList.remove('lit'); e.setAttribute('marker-end', 'url(#head)'); } else e.classList.remove('lit'); } },
  dim(...ids) { for (const id of ids) els[id]?.classList.add('dim'); },
  remove(...ids) { for (const id of ids) { els[id]?.remove(); delete els[id]; els[id + ':l']?.remove(); delete els[id + ':l']; } },
  /** The order ticket travels along arrows, lighting each card it reaches. */
  async travel(arrowIds, ms = 1300) {
    const t = document.getElementById('ticket');
    t.style.display = 'block';
    for (const id of arrowIds) {
      const p = els[id]; if (!p) continue;
      const len = p.getTotalLength(); const t0 = performance.now();
      K.light(p.__from);
      await new Promise((done) => {
        const step = (now) => {
          const f = Math.min(1, (now - t0) / ms); const e = f < .5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2;
          const pt = p.getPointAtLength(len * e); t.style.left = pt.x + 'px'; t.style.top = pt.y + 'px';
          f < 1 ? requestAnimationFrame(step) : done();
        };
        requestAnimationFrame(step);
      });
      K.unlight(p.__from); K.light(p.__to);
      await new Promise((r) => setTimeout(r, 250));
    }
  },
  hideTicket() { document.getElementById('ticket').style.display = 'none'; },
};
window.K = K;
</script>
</body>
</html>
