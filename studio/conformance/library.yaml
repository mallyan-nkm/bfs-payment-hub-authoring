kind: ruleset
name: ck.kit.ruleset.money.v1
release: 1.0.0
title: Kit money checks
mode: validation
stages: [cross-field]
rules: [ck.kit.rule.control-total.v1, ck.kit.rule.large-amount.v1, ck.kit.rule.round-half-away.v1]
