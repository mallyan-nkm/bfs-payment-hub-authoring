# Conformance kit library: the blocks, ports, simulators and scheme manifest that the
# scenario workflows share. Content lives in the reserved cluster `ck` (R-C-02).
# Written by hand under build spec C23. Every activity here is driven by the kit runner's
# stubs or by the kit simulators; none carries production logic.
kind: activity
name: ck.kit.enrich.task.v1
release: 1.0.0
title: Kit task with several outcomes
type: enrich
reads: [header]
writes: [facts.kit]
outcomes:
  - { name: ok, primary: true }
  - { name: other }
  - { name: left }
  - { name: right }
  - { name: rejected }
errors:
  - { name: TransientError, retryable: true }
effect: read
implementation: { binding: script, language: typescript, script: scripts/ck.kit.enrich.task.v1.ts }
