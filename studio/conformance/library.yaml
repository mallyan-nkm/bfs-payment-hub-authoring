kind: workflow
wfKind: subflow
name: ck.kit.sub.request.v1
release: 1.0.0
dsl: 1.0.0
title: Kit subflow. Send, await the reply, read it
implements: { activity: ck.kit.exchange.request.v1 }
exit: { outcomes: [accepted, rejected, pending] }
do:
  - id: send
    call: ck.kit.exchange.send.v1
    handle:
      rejected: { return: rejected }
      unknown: { return: pending }
  - id: await
    await:
      message: ck.kit.reply
      correlateBy: header.endToEndId
      onTimeout: { return: pending }
  - id: read
    call: ck.kit.map.reply.v1
    handle:
      refused: { return: rejected }
  - return: accepted
---
# CK-AWAIT-06 and CK-AWAIT-07 (R-05-43, R-05-44): a second exchange with the same party, on the same reply message.
# Its send has its own idempotency key, so it is a new request, not a retry of the first.
kind: activity
name: ck.kit.exchange.send-b.v1
release: 1.0.0
title: Kit second send whose reply comes later
type: exchange
mode: send
reads: [header, messages]
writes: [status, messages]
outcomes:
  - { name: accepted, primary: true }
  - { name: rejected }
  - { name: unknown }
errors:
  - { name: TransientError, retryable: true }
  - { name: BusinessReject, retryable: false }
effect: external
idempotencyKey: concat(header.paymentId, ':send-b')
ports: [ck.kit.port.party.v1]
policy:
  attemptTimeout: PT3S
  totalTimeout: PT8S
  retry: { maxAttempts: 3, firstInterval: PT1S, backoff: 2, nonRetryable: [BusinessReject] }
implementation: { binding: script, language: typescript, script: scripts/ck.kit.exchange.send-b.v1.ts }
