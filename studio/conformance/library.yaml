kind: simulator
name: ck.kit.sim.party.v1
release: 1.0.0
title: Kit party, replies to the platform
direction: outward
port: ck.kit.port.party.v1
standsFor: external party
state: { keyedBy: message id }
scenarios:
  - name: accept
    steps:
      - expect: ck.kit.request
      - { send: ck.kit.reply, status: accepted, after: PT1M }
  - name: reject
    steps:
      - expect: ck.kit.request
      - { send: ck.kit.reply, status: rejected, reasonCode: AC04 }
  - name: pending-then-final
    steps:
      - expect: ck.kit.request
      - { send: ck.kit.reply, status: pending }
      - { send: ck.kit.reply, status: accepted, after: PT30S }
  - name: no-reply
    steps:
      - expect: ck.kit.request
      - noReply: true
  - name: late-reply
    steps:
      - expect: ck.kit.request
      - { send: ck.kit.reply, status: accepted, after: PT2H }
  - name: duplicate-reply
    steps:
      - expect: ck.kit.request
      - { send: ck.kit.reply, status: accepted, after: PT1M, duplicate: true }
  - name: fail-twice-then-accept
    steps:
      - { expect: ck.kit.request, failTimes: 2 }
      - { send: ck.kit.reply, status: accepted, after: PT1M }
  - name: malformed-reply
    steps:
      - expect: ck.kit.request
      - { send: ck.kit.reply, status: accepted }
    malformed: true
  - name: accept-now
    steps:
      - expect: ck.kit.request
      - { send: ck.kit.reply, status: accepted }
  - name: fail-twice-then-accept-now
    steps:
      - { expect: ck.kit.request, failTimes: 2 }
      - { send: ck.kit.reply, status: accepted }
  # CK-AWAIT-06 (R-05-43): a second, stale reply to the first request arrives between the two exchanges.
  - name: stale-reply-between
    steps:
      - expect: ck.kit.request
      - { send: ck.kit.reply, status: accepted, after: PT1S }
      - { send: ck.kit.reply, status: rejected, reasonCode: AC04, after: PT10S }
      - expect: ck.kit.request
      - { send: ck.kit.reply, status: accepted, after: PT1S }
  # CK-AWAIT-07 (R-05-44): a late reply of family a arrives while the second exchange waits for family b.
  - name: late-a-during-b
    steps:
      - expect: ck.kit.request
      - { send: ck.kit.reply, family: a, status: accepted, after: PT1S }
      - expect: ck.kit.request
      - { send: ck.kit.reply, family: a, status: rejected, reasonCode: AC04, after: PT2S }
      - { send: ck.kit.reply, family: b, status: accepted, after: PT5S }
  - name: no-reply-then-status-accepted
    steps:
      - expect: ck.kit.request
      - noReply: true
      - expect: ck.kit.status-request
      - { send: ck.kit.status, status: accepted }
implementation: { binding: script, language: typescript, script: scripts/ck.kit.sim.party.v1.ts }
