kind: rule
name: ck.kit.rule.control-total.v1
release: 1.0.0
title: The control total equals the exact sum of the lines
ruleKind: cross-field
level: batch
repeatability: non-repeatable
when:
  - match: { fact: Batch, as: b }
  - query: { as: items, match: { fact: Item, where: item.batchId == b.id }, collect: true }
  - let: { total: "sum(items, i => i.payment.instructedAmount.value)" }
  - having: total != b.controlSum
then:
  - yield:
      finding: { severity: reject, path: batch.controlSum, reasonCode: AM10, message: "Control total {b.controlSum} does not equal the sum of lines {total}" }
examples:
  - name: passes
    given:
      Batch: { id: F-1, controlSum: 7894.87 }
      Item:
        - { batchId: F-1, payment: { instructedAmount: { value: 0.1 } } }
        - { batchId: F-1, payment: { instructedAmount: { value: 0.2 } } }
        - { batchId: F-1, payment: { instructedAmount: { value: 0.05 } } }
        - { batchId: F-1, payment: { instructedAmount: { value: 0.2 } } }
        - { batchId: F-1, payment: { instructedAmount: { value: 2697.81 } } }
        - { batchId: F-1, payment: { instructedAmount: { value: 1395.44 } } }
        - { batchId: F-1, payment: { instructedAmount: { value: 3801.07 } } }
    expect: { findings: [] }
  - name: fails
    given:
      Batch: { id: F-1, controlSum: 7894.86 }
      Item:
        - { batchId: F-1, payment: { instructedAmount: { value: 0.1 } } }
        - { batchId: F-1, payment: { instructedAmount: { value: 0.2 } } }
        - { batchId: F-1, payment: { instructedAmount: { value: 0.05 } } }
        - { batchId: F-1, payment: { instructedAmount: { value: 0.2 } } }
        - { batchId: F-1, payment: { instructedAmount: { value: 2697.81 } } }
        - { batchId: F-1, payment: { instructedAmount: { value: 1395.44 } } }
        - { batchId: F-1, payment: { instructedAmount: { value: 3801.07 } } }
    expect: { findings: [{ reasonCode: AM10 }] }
---
kind: rule
name: ck.kit.rule.large-amount.v1
release: 1.0.0
title: An amount beyond the exact range of a double is computed exactly
ruleKind: cross-field
level: batch
repeatability: non-repeatable
when:
  - match: { fact: Payment, as: p }
  - let: { minor: p.instructedAmount.value * 100 }
  - having: minor != 9007199254740993
then:
  - yield:
      finding: { severity: reject, path: payment.instructedAmount.value, reasonCode: AM10, message: "Amount {p.instructedAmount.value} is {minor} in minor units" }
examples:
  - name: passes
    given: { Payment: { instructedAmount: { value: "90071992547409.93" } } }
    expect: { findings: [] }
  - name: fails
    given: { Payment: { instructedAmount: { value: "90071992547409.92" } } }
    expect: { findings: [{ reasonCode: AM10 }] }
---
kind: rule
name: ck.kit.rule.round-half-away.v1
release: 1.0.0
title: round2 rounds the exact decimal half away from zero
ruleKind: cross-field
level: batch
repeatability: non-repeatable
when:
  - query: { as: items, match: { fact: Item }, collect: true }
  - let: { small: "sumWhere(items, i => i.payment.instructedAmount.value < 0.1, i => i.payment.instructedAmount.value)" }
  - having: round2(small * 2.5) != 0.13 or round2(0 - small * 2.5) != -0.13 or round2(small * 53.5) != 2.68
then:
  - yield:
      finding: { severity: reject, path: "items[].payment.instructedAmount.value", reasonCode: AM10, message: "round2 of {small} is not half away from zero" }
examples:
  - name: passes
    given: { Item: [ { payment: { instructedAmount: { value: 0.05 } } }, { payment: { instructedAmount: { value: 10 } } } ] }
    expect: { findings: [] }
  - name: fails
    given: { Item: [ { payment: { instructedAmount: { value: 0.06 } } } ] }
    expect: { findings: [{ reasonCode: AM10 }] }
