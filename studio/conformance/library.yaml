kind: table
name: ck.kit.table.money.v1
release: 1.0.0
title: Kit amounts computed for the context
hitPolicy: first
inputs:
  - { name: total, expression: "sum(items, i => i.payment.instructedAmount.value)" }
  - { name: debit, expression: payment.instructedAmount.value + 0.01 }
outputs: [total, debit]
rows:
  - { when: {}, then: { total: total, debit: debit }, reason: Every file }
