kind: rule
name: ck.kit.rule.within-limit.v1
release: 1.0.0
title: Amount is within the kit limit
ruleKind: policy
parameters:
  limit:
    type: amount
    default: 1000
    bounds: { max: 1000 }
    description: A looked-up value. It may change while a payment waits.
repeatability: non-repeatable
when:
  - match: { fact: Payment, as: p }
  - match: { fact: Param, as: limit, where: "limit.name == 'limit'" }
  - having: p.instructedAmount.value > limit.value
then:
  - yield:
      finding: { severity: reject, path: payment.instructedAmount.value, reasonCode: AM02 }
examples:
  - name: passes
    given: { Payment: { instructedAmount: { value: 100 } }, Param: { name: limit, value: 1000 } }
    expect: { findings: [] }
  - name: fails
    given: { Payment: { instructedAmount: { value: 100 } }, Param: { name: limit, value: 50 } }
    expect: { findings: [{ reasonCode: AM02 }] }
---
kind: ruleset
name: ck.kit.ruleset.limit.v1
release: 1.0.0
title: Kit limit checks
mode: validation
stages: [policy]
rules: [ck.kit.rule.within-limit.v1]
