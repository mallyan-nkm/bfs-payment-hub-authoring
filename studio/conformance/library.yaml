kind: scheme
scope: ck.kit
release: 1.0.0
title: Conformance kit scheme
wire: iso20022
messages:
  - { id: ck.kit.request, title: Request the platform sends, direction: out, confirmed: true, disposition: { sentBy: ck.kit.exchange.send.v1 } }
  - { id: ck.kit.reply, title: Reply that belongs to a running payment, direction: in, confirmed: true, disposition: { deliver: { correlateBy: end-to-end id, families: [a, b] } } }
  - { id: ck.kit.status-request, title: Status request the platform sends, direction: out, confirmed: true, disposition: { sentBy: ck.kit.exchange.inquire.v1 } }
  - { id: ck.kit.request-in, title: Request the platform answers without state, direction: in, confirmed: true, disposition: { handler: ck.kit.handler.answer.v1 } }
  - { id: ck.kit.answer, title: Answer the platform sends, direction: out, confirmed: true, disposition: { sentBy: ck.kit.exchange.answer.v1 } }
legs: [ck.kit.wf.leg.v1]
handlers: [ck.kit.handler.answer.v1]
ports: [ck.kit.port.party.v1]
provenance: { origin: factory, status: confirmed }
