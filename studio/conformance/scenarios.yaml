        name: ck.kit.enrich.a.v1
        release: 1.0.0
        title: Kit block a
        type: enrich
        reads: [header]
        writes: [facts.kit]
        outcomes: [ { name: ok, primary: true } ]
        effect: read
        implementation: { binding: script, language: typescript, script: scripts/ck.kit.enrich.a.v1.ts }
      - &blockb
        <<: *blocka
        name: ck.kit.enrich.b.v1
        title: Kit block b
        implementation: { binding: script, language: typescript, script: scripts/ck.kit.enrich.b.v1.ts }
      - <<: *blockb
