# The TransactHub studio and one bank's runtime on a laptop, as separate services (deploy/laptop/README.md, spec R-09-80).
#
#   docker compose -f deploy/laptop/compose.yaml up -d --wait                       studio, runtime, Temporal on SQL Server
#   docker compose -f deploy/laptop/compose.yaml --profile dtfx --profile elsa up -d    and an engine host supervisor per engine
#   docker compose -f deploy/laptop/compose.yaml --profile flowable up -d              and the Flowable REST server with its supervisor
#   docker compose -f deploy/laptop/compose.yaml --profile observability up -d         and the OpenTelemetry collector and Prometheus
#   docker compose -f deploy/laptop/compose.yaml -f deploy/laptop/compose.postgres.yaml up -d --wait
#                                                    the store, the read model and Temporal on PostgreSQL 16 instead (R-09-140)
#
# One runtime serves one bank (TH_LAPTOP_BANK, R-09-76); the studio is multi-tenant. Every secret comes from the environment
# (a password or a client secret, required below with :?) or a file in a volume (the keys keys-init makes on first start); no
# image holds one. Ports are published on 127.0.0.1 only.

name: th-laptop

x-runtime: &runtime
  image: th-laptop-runtime:${TH_LAPTOP_TAG:-dev}
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  volumes:
    - keys:/var/lib/transacthub/keys:ro
    - jwks:/var/lib/transacthub/jwks:ro

x-store: &store
  Store__Provider: SqlServer
  Store__Connection: "Server=sqlserver,1433;Database=th_store;User Id=th_runtime;Password=${TH_LAPTOP_RUNTIME_DB_PASSWORD:?set TH_LAPTOP_RUNTIME_DB_PASSWORD};TrustServerCertificate=true"
  Operations__Connection: "Server=sqlserver,1433;Database=th_ops;User Id=th_runtime;Password=${TH_LAPTOP_RUNTIME_DB_PASSWORD:?set TH_LAPTOP_RUNTIME_DB_PASSWORD};TrustServerCertificate=true"
  Store__Migrate: "false"
  TH_BANK: ${TH_LAPTOP_BANK:-adib}
  TH_TRUSTED_SIGNERS: file:/var/lib/transacthub/keys/trusted-signers.json
  Operations__Views: /opt/th/content-configurations/artefacts
  ASPNETCORE_ENVIRONMENT: Development
  OTEL_SERVICE_NAMESPACE: th-laptop
  OTEL_EXPORTER_OTLP_ENDPOINT: ${TH_LAPTOP_OTLP:-}

x-auth: &auth
  # Files a host reads by reference: the keys and JWKS volumes, and the role maps in the image.
  TH_SECRET_FILE_ROOTS: /var/lib/transacthub:/opt/th/deploy/laptop/identity
  Auth__Oidc__Issuer: ${TH_LAPTOP_IDP_URL:-http://localhost:8480}
  Auth__Oidc__Authority: ${TH_LAPTOP_IDP_URL:-http://localhost:8480}
  Auth__Oidc__Audience: transacthub-runtime
  Auth__Oidc__SigningKeys: file:/var/lib/transacthub/jwks/jwks.json
  Auth__Oidc__RequireHttpsMetadata: "false"
  Auth__Oidc__ClientId: transacthub-runtime-ui
  TH_STUDIO_ISSUER: ${TH_LAPTOP_STUDIO_URL:-http://localhost:4317}/auth/dev

# The references the laptop's binding of the bank's file transfer names (deploy/laptop/banks/<bank>/file-transfer.yaml, which reaches
# the runtime inside the bank's signed configuration release, R-09-105, R-09-110): the stack's SFTP server's login and host keys.
x-sftp: &sftp-refs
  TH_LAPTOP_SFTP_LOGIN: "th:${TH_LAPTOP_SFTP_PASSWORD:?set TH_LAPTOP_SFTP_PASSWORD}"
  TH_LAPTOP_SFTP_HOST_KEY: ${TH_LAPTOP_SFTP_HOST_KEY:-}

# Every file a host puts on the bank's file-transfer port goes through the File API's outbox (R-09-84, R-09-105), with a token of the
# front door's client by reference, which the tokens service keeps fresh in its volume.
x-file-api: &file-api-client
  TH_FILE_API_URL: http://file-api:8080
  TH_FILE_API_TOKEN_REF: file:/var/lib/transacthub/tokens/th-front-door.jwt
  TH_SECRET_FILE_ROOTS: /var/lib/transacthub:/opt/th/deploy/laptop/identity

x-github: &github
  # The studio's content branch, read only: its in-memory fake GitHub by default, the real one when TH_CONTENT_REPO is set.
  PackageSource__GitHub__Repository: ${TH_CONTENT_REPO:-local/content}
  PackageSource__GitHub__Api: ${TH_LAPTOP_GITHUB_API:-http://studio:4318/}
  PackageSource__GitHub__TokenRef: env:TH_LAPTOP_GITHUB_READ_TOKEN
  TH_LAPTOP_GITHUB_READ_TOKEN: ${TH_LAPTOP_GITHUB_READ_TOKEN:-local-development-token}

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:4525e3efac9f3e241cb003bb2ff2a82818b502f37e12049d788b1a9fa7e13b7f
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${TH_LAPTOP_SA_PASSWORD:?set TH_LAPTOP_SA_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: "2048"
      TH_SA: ${TH_LAPTOP_SA_PASSWORD:?set TH_LAPTOP_SA_PASSWORD}
    volumes: [sql:/var/opt/mssql]
    ports: ["127.0.0.1:${TH_LAPTOP_SQL_PORT:-14330}:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$TH_SA\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # The bank's SFTP partners on a laptop (R-09-105, Issue I-161): one SFTP server for the channel's pick-up, the Central Bank and the
  # results. Its login is made at the stack's start (TH_LAPTOP_SFTP_PASSWORD, from the environment only); its host keys are made by
  # the server on first start, kept in its volume, read out of band (ssh-keygen -lf) and pinned by reference in the File API's binding
  # (TH_LAPTOP_SFTP_HOST_KEY): until they are, no session opens.
  sftp:
    image: atmoz/sftp:alpine@sha256:c5fb9e4beb8b7054a4c0b65c5e11df47cc20da95ad6002e88aecff62bab06372
    restart: unless-stopped
    command: ["th:${TH_LAPTOP_SFTP_PASSWORD:?set TH_LAPTOP_SFTP_PASSWORD}:1001::upload"]
    volumes: ["sftp-host:/etc/ssh"]
    ports: ["127.0.0.1:${TH_LAPTOP_SFTP_PORT:-12222}:22"]
    healthcheck:
      test: ["CMD-SHELL", "test -s /etc/ssh/ssh_host_ed25519_key.pub && pidof sshd >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40

  keys-init:
    <<: *runtime
    restart: "no"
    command: ["keys"]
    volumes: [keys:/var/lib/transacthub/keys]
    healthcheck: { disable: true }

  db-init:
    <<: *runtime
    restart: "no"
    command: ["migrate"]
    depends_on: { sqlserver: { condition: service_healthy } }
    environment:
      TH_STORE_PROVIDER: SqlServer
      TH_STORE_CONNECTION_REF: env:TH_OWNER_STORE
      TH_OPS_CONNECTION_REF: env:TH_OWNER_OPS
      TH_OWNER_STORE: "Server=sqlserver,1433;Database=th_store;User Id=sa;Password=${TH_LAPTOP_SA_PASSWORD};TrustServerCertificate=true"
      TH_OWNER_OPS: "Server=sqlserver,1433;Database=th_ops;User Id=sa;Password=${TH_LAPTOP_SA_PASSWORD};TrustServerCertificate=true"
      Operations__Views: /opt/th/content-configurations/artefacts
      # Temporal's two databases, brought to the server's schema by the same step, as the owner, once (R-09-141).
      TH_TEMPORAL_SCHEMA_PLUGIN: sqlserver
      TH_TEMPORAL_SCHEMA_ADDR: sqlserver:1433
      TH_TEMPORAL_SCHEMA_USER: sa
      TH_TEMPORAL_SCHEMA_PASSWORD_REF: env:TH_OWNER_PASSWORD
      TH_OWNER_PASSWORD: ${TH_LAPTOP_SA_PASSWORD}
    healthcheck: { disable: true }

  db-grants:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:4525e3efac9f3e241cb003bb2ff2a82818b502f37e12049d788b1a9fa7e13b7f
    restart: "no"
    depends_on:
      db-init: { condition: service_completed_successfully }
    environment:
      TH_SA: ${TH_LAPTOP_SA_PASSWORD}
      RUNTIME_PASSWORD: ${TH_LAPTOP_RUNTIME_DB_PASSWORD:?set TH_LAPTOP_RUNTIME_DB_PASSWORD}
      TESTBENCH_PASSWORD: ${TH_LAPTOP_TESTBENCH_DB_PASSWORD:?set TH_LAPTOP_TESTBENCH_DB_PASSWORD}
      TEMPORAL_PASSWORD: ${TH_LAPTOP_TEMPORAL_DB_PASSWORD:?set TH_LAPTOP_TEMPORAL_DB_PASSWORD}
    volumes: ["./sql:/grants:ro"]
    entrypoint: ["/bin/sh", "-c", "/opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P \"$$TH_SA\" -b -i /grants/grants.sql"]
    healthcheck: { disable: true }

  temporal:
    image: th-laptop-temporal:${TH_LAPTOP_TAG:-dev}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    command: ["server"]
    depends_on: { db-grants: { condition: service_completed_successfully } }
    environment:
      TEMPORAL_DB_PLUGIN: sqlserver
      TEMPORAL_SQLSERVER_ADDR: sqlserver:1433
      TEMPORAL_SQLSERVER_USER: th_temporal
      TEMPORAL_SQLSERVER_PASSWORD: ${TH_LAPTOP_TEMPORAL_DB_PASSWORD}
    ports: ["127.0.0.1:${TH_LAPTOP_TEMPORAL_PORT:-17233}:7233"]

  temporal-namespace:
    image: temporalio/temporal:1.5.1@sha256:597a5dbbcc6e7716b326dde4a51622d5ea0879eb0cf06ff8a94381361d0a987d
    restart: "no"
    depends_on: { temporal: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c", "temporal operator namespace describe --namespace default --address temporal:7233 >/dev/null 2>&1 || temporal operator namespace create --namespace default --retention 72h --address temporal:7233"]

  bank-idp:
    <<: *runtime
    command: ["idp"]
    depends_on: { keys-init: { condition: service_completed_successfully } }
    volumes: [idp:/var/lib/transacthub/idp, jwks:/var/lib/transacthub/jwks]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DevIdp__Issuer: ${TH_LAPTOP_IDP_URL:-http://localhost:8480}
      DevIdp__Audience: transacthub-runtime
      DevIdp__Bank: ${TH_LAPTOP_BANK:-adib}
      DevIdp__Directory: /opt/th/deploy/laptop/identity/directory.json
      DevIdp__KeyFile: /var/lib/transacthub/idp/signing-key.pem
      DevIdp__JwksOut: /var/lib/transacthub/jwks/jwks.json
      DevIdp__UserPasswordRef: env:TH_LAPTOP_USER_PASSWORD
      DevIdp__CorsOrigins: http://localhost:8482,http://localhost:8483,http://localhost:8484
      TH_LAPTOP_USER_PASSWORD: ${TH_LAPTOP_USER_PASSWORD:?set TH_LAPTOP_USER_PASSWORD}
      TH_LAPTOP_PIPELINE_SECRET: ${TH_LAPTOP_PIPELINE_SECRET:?set TH_LAPTOP_PIPELINE_SECRET}
      TH_LAPTOP_FRONTDOOR_SECRET: ${TH_LAPTOP_FRONTDOOR_SECRET:?set TH_LAPTOP_FRONTDOOR_SECRET}
      TH_LAPTOP_CHANNEL_SECRET: ${TH_LAPTOP_CHANNEL_SECRET:?set TH_LAPTOP_CHANNEL_SECRET}
      TH_LAPTOP_OPERATIONS_SECRET: ${TH_LAPTOP_OPERATIONS_SECRET:?set TH_LAPTOP_OPERATIONS_SECRET}
      TH_HEALTH_URL: http://127.0.0.1:8080/health
    ports: ["127.0.0.1:${TH_LAPTOP_IDP_PORT:-8480}:8080"]

  # Fresh client-credentials tokens in the tokens volume, for the hosts that call the File API with a token by reference (R-09-105).
  machine-auth:
    <<: *runtime
    command: ["tokens"]
    depends_on: { bank-idp: { condition: service_healthy } }
    volumes: [auth-files:/var/lib/transacthub/tokens]
    environment:
      TH_IDP_TOKEN_URL: http://bank-idp:8080/token
      TH_MACHINE_CLIENTS: '{"th-front-door":"env:TH_LAPTOP_FRONTDOOR_SECRET","th-operations":"env:TH_LAPTOP_OPERATIONS_SECRET"}'
      TH_LAPTOP_FRONTDOOR_SECRET: ${TH_LAPTOP_FRONTDOOR_SECRET}
      TH_LAPTOP_OPERATIONS_SECRET: ${TH_LAPTOP_OPERATIONS_SECRET}
      TH_HEALTH_FILE: /var/lib/transacthub/tokens/th-operations.jwt

  studio:
    image: th-laptop-studio:${TH_LAPTOP_TAG:-dev}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on: { keys-init: { condition: service_completed_successfully } }
    volumes: ["keys:/var/lib/transacthub/keys:ro"]
    environment:
      PORT: "4317"
      NODE_ENV: development
      TH_PUBLIC_URL: ${TH_LAPTOP_STUDIO_URL:-http://localhost:4317}
      # The studio's sign-in: its built-in development provider (the platform vendor's identity provider on a laptop), or
      # TH_OIDC_ISSUER and TH_OIDC_CLIENT_ID for the vendor's real one (R-11-29).
      TH_AUTH_DEV: ${TH_LAPTOP_STUDIO_AUTH_DEV:-1}
      TH_OIDC_ISSUER: ${TH_OIDC_ISSUER:-}
      TH_OIDC_CLIENT_ID: ${TH_OIDC_CLIENT_ID:-}
      TH_BANKS: ${TH_LAPTOP_STUDIO_BANKS:-adib,dib}
      TH_CONTENT_REPO: ${TH_CONTENT_REPO:-}
      TH_CONTENT_BRANCH: ${TH_CONTENT_BRANCH:-main}
      TH_GITHUB_TOKEN: ${TH_GITHUB_TOKEN:-}
      TH_FAKE_GITHUB_PORT: "4318"
      TH_FAKE_GITHUB_HOST: 0.0.0.0
      TH_SIGNING_KEY: file:/var/lib/transacthub/keys/studio-signing.pem
      TH_TRUSTED_SIGNERS: file:/var/lib/transacthub/keys/trusted-signers.json
      TH_SECRET_FILE_ROOTS: /var/lib/transacthub/keys
    ports: ["127.0.0.1:${TH_LAPTOP_STUDIO_PORT:-4317}:4317"]

  runtime-api:
    <<: *runtime
    command: ["api"]
    depends_on:
      db-grants: { condition: service_completed_successfully }
      bank-idp: { condition: service_healthy }
      studio: { condition: service_healthy }
    environment:
      <<: [*store, *auth, *github]
      Releases__TestEnvironments: test
      # The environment this runtime is (R-09-111): a test one, so the pipeline puts a configuration release in force by itself.
      Releases__Environment: test
      TH_FILE_SIGNING_KEY_REF: file:/var/lib/transacthub/keys/file-signing.pem
      Auth__RoleMap: file:/opt/th/deploy/laptop/identity/role-map-api.json
    ports: ["127.0.0.1:${TH_LAPTOP_API_PORT:-8481}:8080"]

  service-api:
    <<: *runtime
    command: ["service"]
    depends_on:
      db-grants: { condition: service_completed_successfully }
      bank-idp: { condition: service_healthy }
      studio: { condition: service_healthy }
    environment:
      <<: [*store, *auth, *github]
      Service__Environment: test
      Releases__TestEnvironments: test
      Service__Project: "false"
      Service__Console: /opt/th/runtime/ops-console/dist
      Service__Errors: /opt/th/content-configurations/artefacts
      Service__Docs: /opt/th/docs/north-star
      # No bank folder: the bank's bindings are its configuration release's in force, from the store (R-09-112, R-09-113).
      Service__Installation: laptop-${TH_LAPTOP_BANK:-adib}
      TH_BACKUP_SIGNING_KEY: file:/var/lib/transacthub/keys/backup-signing.pem
      TH_TEMPORAL_ADDRESS: temporal:7233
      Auth__RoleMap: file:/opt/th/deploy/laptop/identity/role-map-service.json
      # The service console's resend goes through the File API's outbox, onto the bank's binding (R-09-84).
      Service__FileApi__Url: http://file-api:8080
      Service__FileApi__Folder: centralBank/upload/cb/wps/sif
      Service__FileApi__TokenRef: file:/var/lib/transacthub/tokens/th-operations.jwt
      # The replies the gauge watches are the installation's to name, not the platform's (R-09-142, Issue I-235).
      Service__Gauges__AwaitedReplies: '[{"scheme":"uae.wps","sent":"uae.wps.sif","replies":["uae.wps.ack"]}]'
    volumes:
      - keys:/var/lib/transacthub/keys:ro
      - jwks:/var/lib/transacthub/jwks:ro
      - auth-files:/var/lib/transacthub/tokens:ro
    ports: ["127.0.0.1:${TH_LAPTOP_SERVICE_PORT:-8482}:8080"]

  ops-api:
    <<: *runtime
    command: ["ops"]
    depends_on:
      db-grants: { condition: service_completed_successfully }
      bank-idp: { condition: service_healthy }
    environment:
      <<: [*store, *auth]
      Operations__Console: /opt/th/runtime/ops-console/dist
      Auth__RoleMap: file:/opt/th/deploy/laptop/identity/role-map-ops.json
      TH_HEALTH_URL: http://127.0.0.1:8080/ops/api/health
      # The operations console's resend goes through the File API's outbox, onto the bank's binding (R-09-84, R-09-105).
      Operations__FileApi__Url: http://file-api:8080
      Operations__FileApi__Folder: centralBank/upload/cb/wps/sif
      Operations__FileApi__TokenRef: file:/var/lib/transacthub/tokens/th-operations.jwt
      # The upload page (R-05-73): the messages of the distribution active in the File API's environment, a person's file to the
      # File API's POST /files/ui with their own token; a refusal's code links to its runbook in the service console.
      Operations__Environment: test
      Operations__ServiceConsole: http://localhost:${TH_LAPTOP_SERVICE_PORT:-8482}
    volumes:
      - keys:/var/lib/transacthub/keys:ro
      - jwks:/var/lib/transacthub/jwks:ro
      - auth-files:/var/lib/transacthub/tokens:ro
    ports: ["127.0.0.1:${TH_LAPTOP_OPS_PORT:-8483}:8080"]

  testbench:
    <<: *runtime
    command: ["testbench"]
    depends_on:
      db-grants: { condition: service_completed_successfully }
      bank-idp: { condition: service_healthy }
      temporal-namespace: { condition: service_completed_successfully }
    volumes:
      - keys:/var/lib/transacthub/keys:ro
      - jwks:/var/lib/transacthub/jwks:ro
      - work:/var/lib/transacthub/work
    environment:
      <<: [*auth]
      ASPNETCORE_ENVIRONMENT: Development
      Auth__RoleMap: file:/opt/th/deploy/laptop/identity/role-map-testbench.json
      TH_SECRET_FILE_ROOTS: /var/lib/transacthub:/opt/th/deploy/laptop/identity
      # Temporal is the default engine, on the SQL Server plugin (R-09-79); DTFx and Elsa run in the bench's harnesses, Flowable
      # on its REST server with the flowable profile.
      TH_TEMPORAL_ADDRESS: temporal:7233
      TH_FLOWABLE_URL: ${TH_LAPTOP_FLOWABLE_URL:-http://flowable:8080/flowable-rest}
      TH_FLOWABLE_USER: th-laptop
      TH_FLOWABLE_PASSWORD: ${TH_LAPTOP_FLOWABLE_PASSWORD:-}
      TH_TESTBENCH_SQLSERVER: "Server=sqlserver,1433;User Id=th_testbench;Password=${TH_LAPTOP_TESTBENCH_DB_PASSWORD};TrustServerCertificate=true"
      TH_TESTBENCH_LOCAL: /var/lib/transacthub/work/testbench
      TH_TRUSTED_SIGNERS: file:/var/lib/transacthub/keys/trusted-signers.json
      TH_BANK: ${TH_LAPTOP_BANK:-adib}
      # The front door's one-off runs (run-pinned) in this container reach the release API and the bank's provider.
      TH_RUNTIME_API: http://runtime-api:8080
      TH_IDP_TOKEN_URL: http://bank-idp:8080/token
      TH_LAPTOP_FRONTDOOR_SECRET: ${TH_LAPTOP_FRONTDOOR_SECRET}
      TH_STORE_PROVIDER: SqlServer
      TH_STORE_CONNECTION: "Server=sqlserver,1433;Database=th_store;User Id=th_runtime;Password=${TH_LAPTOP_RUNTIME_DB_PASSWORD};TrustServerCertificate=true"
      # The migrate step migrated the store as its owner; the runtime's login may not change the schema (R-09-141).
      Store__Migrate: "false"
      TH_HEALTH_URL: http://127.0.0.1:8080/testbench/api/health
      HOME: /var/lib/transacthub/work
    ports: ["127.0.0.1:${TH_LAPTOP_TESTBENCH_PORT:-8484}:8080"]

  native:
    <<: *runtime
    command: ["native"]
    depends_on:
      db-grants: { condition: service_completed_successfully }
      bank-idp: { condition: service_healthy }
    volumes:
      - keys:/var/lib/transacthub/keys:ro
      - jwks:/var/lib/transacthub/jwks:ro
      - auth-files:/var/lib/transacthub/tokens:ro
    environment:
      <<: [*store, *auth, *sftp-refs, *file-api-client]
      TH_NATIVE_URLS: http://0.0.0.0:7300
      # The bank's bindings: its configuration release in force, from the store, read at each attempt (R-09-112, R-09-113).
      TH_BANK: ${TH_LAPTOP_BANK:-adib}
      TH_FILE_SIGNING_KEY_REF: file:/var/lib/transacthub/keys/file-signing.pem
      Auth__RoleMap: file:/opt/th/deploy/laptop/identity/role-map-native.json
      TH_HEALTH_URL: http://127.0.0.1:7300/health

  # The File API (R-09-82 to R-09-86, I-158): every file the runtime receives or sends, the front door behind its intake. On a laptop
  # the bank's file-transfer binding is a folder: the inbox and the outbox are the `files` volume (TH_LAPTOP_FILES_ROOT inside it).
  file-api:
    <<: *runtime
    command: ["file-api"]
    depends_on:
      db-grants: { condition: service_completed_successfully }
      bank-idp: { condition: service_healthy }
    volumes:
      - keys:/var/lib/transacthub/keys:ro
      - jwks:/var/lib/transacthub/jwks:ro
      - files:/var/lib/transacthub/files
    environment:
      <<: [*store, *auth, *sftp-refs]
      FileApi__Environment: test
      FileApi__PollSeconds: "3"
      # The intake maps run on the workers of the distribution the payment is pinned to (I-158, R-09-105).
      FileApi__Workers__uae.wps: http://workers:7700/{distribution}/_/any
      FileApi__Workers__p: http://workers:7700/{distribution}/_/any
      # The bank's bindings, its inboxes among them: its configuration release in force, from the store (R-09-112, R-09-113).
      # The front door starts and correlates payments on the bank's engine host (R-09-85, R-09-95), on the compose network.
      TH_BANK: ${TH_LAPTOP_BANK:-adib}
      FileApi__EngineHost: http://enginehost:7600
      FileApi__EngineHostTokenRef: env:TH_LAPTOP_ENGINE_HOST_TOKEN
      TH_LAPTOP_ENGINE_HOST_TOKEN: ${TH_LAPTOP_ENGINE_HOST_TOKEN:?set TH_LAPTOP_ENGINE_HOST_TOKEN}
      TH_FILE_SIGNING_KEY_REF: file:/var/lib/transacthub/keys/file-signing.pem
      Auth__RoleMap: file:/opt/th/deploy/laptop/identity/role-map-file-api.json
    ports: ["127.0.0.1:${TH_LAPTOP_FILE_API_PORT:-8485}:8080"]

  # Every distribution's activity workers (R-09-105): the engine hosts' plans and the File API's front door name them by distribution.
  # The laptop is a test environment, so the workers carry the simulators TH_LAPTOP_WORKERS_BENCH names (R-07-12).
  workers:
    <<: *runtime
    command: ["workers"]
    depends_on:
      runtime-api: { condition: service_healthy }
      native: { condition: service_healthy }
      bank-idp: { condition: service_healthy }
      machine-auth: { condition: service_healthy }
    volumes:
      - keys:/var/lib/transacthub/keys:ro
      - work:/var/lib/transacthub/work
      - auth-files:/var/lib/transacthub/tokens:ro
    environment:
      TH_BANK: ${TH_LAPTOP_BANK:-adib}
      TH_RUNTIME_API: http://runtime-api:8080
      TH_IDP_TOKEN_URL: http://bank-idp:8080/token
      TH_LAPTOP_FRONTDOOR_SECRET: ${TH_LAPTOP_FRONTDOOR_SECRET}
      TH_TRUSTED_SIGNERS: file:/var/lib/transacthub/keys/trusted-signers.json
      TH_SECRET_FILE_ROOTS: /var/lib/transacthub
      TH_WORKERS_HOME: /var/lib/transacthub/work/workers
      # The bank's values from its installed configuration release, read by each worker at each attempt's time (R-12-28).
      TH_RUNTIME_URL: http://runtime-api:8080
      TH_RUNTIME_TOKEN: file:/var/lib/transacthub/tokens/th-front-door.jwt
      # The salary file's render, send and acknowledgement run in the native host (R-09-162, Issue I-192): the SIF is written by the
      # source's writer and kept, and leaves on the bank's binding of the WPS port, the File API's outbox to the Central Bank's folder.
      TH_NATIVE_HOST: http://native:7300
      TH_NATIVE_ACTIVITIES: uae.wps.map.sif-out.v1,uae.wps.exchange.send-salary-file.v1,uae.wps.map.ack-in.v1
      TH_NATIVE_TOKEN: file:/var/lib/transacthub/tokens/th-front-door.jwt
      # The Central Bank's ACK or NAK the File API received and its front door delivered: the map that reads it gets its content
      # from the File API, which kept it (R-09-162).
      TH_FILE_API_URL: http://file-api:8080
      TH_FILE_API_TOKEN: file:/var/lib/transacthub/tokens/th-front-door.jwt
      # The WPS port is the runtime's (the bank's binding, the File API); the rest are the test distribution's simulators.
      TH_WORKERS_BENCH: ${TH_LAPTOP_WORKERS_BENCH:-[{"port":"p.port.core-banking.v1","simulator":"p.sim.core-banking.v1","scenario":"accept"},{"port":"p.port.sanctions.v1","simulator":"p.sim.sanctions.v1","scenario":"accept"},{"port":"p.port.fraud.v1","simulator":"p.sim.fraud.v1","scenario":"accept"},{"port":"p.port.channel.v1","simulator":"p.sim.channel.v1","scenario":"accept"},{"port":"p.port.payment-record.v1","simulator":"p.sim.payment-record.v1","scenario":"accept"},{"port":"p.port.facts-out.v1","simulator":"p.sim.facts-out.v1","scenario":"accept"},{"port":"p.port.party-register.v1","simulator":"p.sim.party-register.v1","scenario":"accept"},{"port":"p.port.operations-queue.v1","simulator":"p.sim.operations.v1","scenario":"release"},{"port":"p.port.encryption.v1","simulator":"p.sim.encryption.v1","scenario":"accept"},{"port":"uae.wps.port.wps.v1","simulator":"runtime"},{"port":"uae.wps.port.labour-ministry.v1","simulator":"uae.wps.sim.labour-ministry.v1","scenario":"accept"},{"port":"uae.p.port.calendar.v1","simulator":"uae.p.sim.calendar.v1","scenario":"accept"},{"port":"b.port.aml-screening.v1","simulator":"b.sim.aml-screening.v1","scenario":"accept"},{"port":"b.port.labour-ministry.v1","simulator":"b.sim.labour-ministry.v1","scenario":"accept"}]}
      TH_HEALTH_URL: http://127.0.0.1:7700/health
      HOME: /var/lib/transacthub/work

  # The long-running engine host: a supervisor per engine for the runtime's bank, Temporal by default (R-09-66, R-09-79).
  enginehost: &enginehost
    <<: *runtime
    command: ["enginehost"]
    depends_on:
      db-grants: { condition: service_completed_successfully }
      temporal-namespace: { condition: service_completed_successfully }
    volumes:
      - keys:/var/lib/transacthub/keys:ro
      - work:/var/lib/transacthub/work
      - auth-files:/var/lib/transacthub/tokens:ro
    environment:
      <<: *file-api-client
      TH_ENGINE: temporal
      TH_BANK: ${TH_LAPTOP_BANK:-adib}
      TH_ENVIRONMENT: test
      TH_STORE_PROVIDER: SqlServer
      TH_STORE_CONNECTION: "Server=sqlserver,1433;Database=th_store;User Id=th_runtime;Password=${TH_LAPTOP_RUNTIME_DB_PASSWORD};TrustServerCertificate=true"
      # The migrate step migrated the store as its owner; the runtime's login may not change the schema (R-09-141).
      Store__Migrate: "false"
      TH_TEMPORAL_ADDRESS: temporal:7233
      TH_HOST_PLANS: /var/lib/transacthub/work/plans/temporal
      # The supervisor answers the File API's front door on the compose network, with its token (R-09-95, I-158 (3)); a call
      # without the token is refused, so the health check only connects.
      TH_HOST_URLS: http://0.0.0.0:7600/
      TH_ENGINE_HOST_TOKEN: env:TH_LAPTOP_ENGINE_HOST_TOKEN
      TH_LAPTOP_ENGINE_HOST_TOKEN: ${TH_LAPTOP_ENGINE_HOST_TOKEN:?set TH_LAPTOP_ENGINE_HOST_TOKEN}
      # Each distribution's host is served by that distribution's own workers (R-09-105).
      TH_HOST_WORKERS_URL: http://workers:7700/{distribution}/{workflow}/{queue}
      TH_HEALTH_TCP: 127.0.0.1:7600
      HOME: /var/lib/transacthub/work

  enginehost-dtfx:
    <<: *enginehost
    profiles: [dtfx]
    environment:
      <<: *file-api-client
      TH_ENGINE: dtfx
      TH_BANK: ${TH_LAPTOP_BANK:-adib}
      TH_ENVIRONMENT: test
      TH_STORE_PROVIDER: SqlServer
      TH_STORE_CONNECTION: "Server=sqlserver,1433;Database=th_store;User Id=th_runtime;Password=${TH_LAPTOP_RUNTIME_DB_PASSWORD};TrustServerCertificate=true"
      # The migrate step migrated the store as its owner; the runtime's login may not change the schema (R-09-141).
      Store__Migrate: "false"
      TH_HOST_PLANS: /var/lib/transacthub/work/plans/dtfx
      # The supervisor answers the File API's front door on the compose network, with its token (R-09-95, I-158 (3)); a call
      # without the token is refused, so the health check only connects.
      TH_HOST_URLS: http://0.0.0.0:7600/
      TH_ENGINE_HOST_TOKEN: env:TH_LAPTOP_ENGINE_HOST_TOKEN
      TH_LAPTOP_ENGINE_HOST_TOKEN: ${TH_LAPTOP_ENGINE_HOST_TOKEN:?set TH_LAPTOP_ENGINE_HOST_TOKEN}
      # Each distribution's host is served by that distribution's own workers (R-09-105).
      TH_HOST_WORKERS_URL: http://workers:7700/{distribution}/{workflow}/{queue}
      TH_HEALTH_TCP: 127.0.0.1:7600
      HOME: /var/lib/transacthub/work

  enginehost-elsa:
    <<: *enginehost
    profiles: [elsa]
    environment:
      <<: *file-api-client
      TH_ENGINE: elsa
      TH_BANK: ${TH_LAPTOP_BANK:-adib}
      TH_ENVIRONMENT: test
      TH_STORE_PROVIDER: SqlServer
      TH_STORE_CONNECTION: "Server=sqlserver,1433;Database=th_store;User Id=th_runtime;Password=${TH_LAPTOP_RUNTIME_DB_PASSWORD};TrustServerCertificate=true"
      # The migrate step migrated the store as its owner; the runtime's login may not change the schema (R-09-141).
      Store__Migrate: "false"
      TH_HOST_PLANS: /var/lib/transacthub/work/plans/elsa
      # The supervisor answers the File API's front door on the compose network, with its token (R-09-95, I-158 (3)); a call
      # without the token is refused, so the health check only connects.
      TH_HOST_URLS: http://0.0.0.0:7600/
      TH_ENGINE_HOST_TOKEN: env:TH_LAPTOP_ENGINE_HOST_TOKEN
      TH_LAPTOP_ENGINE_HOST_TOKEN: ${TH_LAPTOP_ENGINE_HOST_TOKEN:?set TH_LAPTOP_ENGINE_HOST_TOKEN}
      # Each distribution's host is served by that distribution's own workers (R-09-105).
      TH_HOST_WORKERS_URL: http://workers:7700/{distribution}/{workflow}/{queue}
      TH_HEALTH_TCP: 127.0.0.1:7600
      HOME: /var/lib/transacthub/work

  enginehost-flowable:
    <<: *enginehost
    profiles: [flowable]
    depends_on:
      db-grants: { condition: service_completed_successfully }
      flowable: { condition: service_healthy }
    environment:
      <<: *file-api-client
      TH_ENGINE: flowable
      TH_BANK: ${TH_LAPTOP_BANK:-adib}
      TH_ENVIRONMENT: test
      TH_STORE_PROVIDER: SqlServer
      TH_STORE_CONNECTION: "Server=sqlserver,1433;Database=th_store;User Id=th_runtime;Password=${TH_LAPTOP_RUNTIME_DB_PASSWORD};TrustServerCertificate=true"
      # The migrate step migrated the store as its owner; the runtime's login may not change the schema (R-09-141).
      Store__Migrate: "false"
      TH_FLOWABLE_URL: http://flowable:8080/flowable-rest
      TH_FLOWABLE_USER: th-laptop
      TH_FLOWABLE_PASSWORD: ${TH_LAPTOP_FLOWABLE_PASSWORD:-}
      TH_HOST_PLANS: /var/lib/transacthub/work/plans/flowable
      # The supervisor answers the File API's front door on the compose network, with its token (R-09-95, I-158 (3)); a call
      # without the token is refused, so the health check only connects.
      TH_HOST_URLS: http://0.0.0.0:7600/
      TH_ENGINE_HOST_TOKEN: env:TH_LAPTOP_ENGINE_HOST_TOKEN
      TH_LAPTOP_ENGINE_HOST_TOKEN: ${TH_LAPTOP_ENGINE_HOST_TOKEN:?set TH_LAPTOP_ENGINE_HOST_TOKEN}
      # Each distribution's host is served by that distribution's own workers (R-09-105).
      TH_HOST_WORKERS_URL: http://workers:7700/{distribution}/{workflow}/{queue}
      TH_HEALTH_TCP: 127.0.0.1:7600
      HOME: /var/lib/transacthub/work

  flowable:
    image: flowable/flowable-rest:7.1.0@sha256:b7ae287502cd5c243b577a0ca2894172e1c18cd75aea4fd67dc7d58f1b40db44
    profiles: [flowable]
    restart: unless-stopped
    environment:
      FLOWABLE_REST_APP_CREATE_DEMO_DEFINITIONS: "false"
      FLOWABLE_REST_APP_ADMIN_USER_ID: th-laptop
      FLOWABLE_REST_APP_ADMIN_PASSWORD: ${TH_LAPTOP_FLOWABLE_PASSWORD:-}
      FLOWABLE_ASYNC_EXECUTOR_ACTIVATE: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/flowable-rest/actuator/health || curl -fs http://127.0.0.1:8080/flowable-rest/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    profiles: [observability]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["../../runtime/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:4318:4318"]

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    profiles: [observability]
    restart: unless-stopped
    volumes:
      - "../../runtime/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "../../runtime/observability/alerts:/etc/prometheus/alerts:ro"
    ports: ["127.0.0.1:9090:9090"]

volumes:
  sftp-host:
  auth-files:
  sql:
  keys:
  idp:
  jwks:
  files:
  work:
