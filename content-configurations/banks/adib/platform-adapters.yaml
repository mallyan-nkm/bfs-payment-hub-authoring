# The platform's production adapters as port bindings (R-09-90, owner's direction of 23 November 2026): sanctions screening, fraud,
# the channel's notices, the outward facts, the business calendar and the participant directory; and, from 23 November 2026,
# the operators' alerts (p.port.notification.v1, R-09-150) and the payment events (p.port.event-stream.v1, R-09-152). Read by
# runtime/src/TransactHub.Ports/PortBindings.cs and runtime/src/TransactHub.Ports/PlatformAdapters.cs.
#
# This is the bindings' shape only. The source names none of these services, so every host is a placeholder under .invalid and
# every credential a reference the installation fills: a call fails until the bank gives its hosts in a new binding with a later
# validFrom (README.md, Issue I-163). The calendar and the directory read the reference tables the bank's configuration release
# installs (R-09-75), so they need no host.
kind: port-bindings
tenant: adib
bindings:
  - port: p.port.sanctions.v1
    adapter: gateway-rest
    validFrom: 2026-11-23T00:00:00Z
    settings:
      baseUrl: https://sanctions-screening.adib.invalid/
      screenPath: /screen
      secretRef: env:TH_ADIB_SANCTIONS_TOKEN
  - port: p.port.fraud.v1
    adapter: gateway-rest
    validFrom: 2026-11-23T00:00:00Z
    settings:
      baseUrl: https://fraud-screening.adib.invalid/
      screenPath: /screen
      secretRef: env:TH_ADIB_FRAUD_TOKEN
  - port: p.port.channel.v1
    adapter: email
    validFrom: 2026-11-23T00:00:00Z
    settings:
      host: smtp-relay.adib.invalid
      port: "587"
      from: payments-notices@adib.invalid
      to: channel-desk@adib.invalid
      # The relay's login, user:password, by reference only.
      secretRef: env:TH_ADIB_SMTP_LOGIN
  - port: p.port.facts-out.v1
    adapter: webhook
    validFrom: 2026-11-23T00:00:00Z
    settings:
      baseUrl: https://payment-events.adib.invalid/
      publishPath: /facts
      signingKeyRef: env:TH_ADIB_FACTS_SIGNING_KEY
      secretRef: env:TH_ADIB_FACTS_TOKEN
  - port: uae.p.port.calendar.v1
    adapter: reference
    validFrom: 2026-11-23T00:00:00Z
  - port: uae.p.port.participant-directory.v1
    adapter: reference
    validFrom: 2026-11-23T00:00:00Z
  # The operators' alerts, the operations console's turnaround breaches among them (R-05-80), to the bank's MQTT broker: TLS,
  # QoS 1, a login by reference. A placeholder broker until the bank names its own (Issue I-163).
  - port: p.port.notification.v1
    adapter: mqtt
    validFrom: 2026-11-23T00:00:00Z
    settings:
      host: alerts-broker.adib.invalid
      port: "8883"
      tls: "true"
      qos: "1"
      topic: transacthub/{tenant}/alerts/{kind}
      secretRef: env:TH_ADIB_ALERTS_BROKER_LOGIN
  # The payment events from the store's outbox, to the bank's Kafka cluster: an idempotent producer with acks all, SASL over TLS,
  # the login by reference. A placeholder cluster until the bank names its own (Issue I-163).
  - port: p.port.event-stream.v1
    adapter: kafka
    validFrom: 2026-11-23T00:00:00Z
    settings:
      bootstrapServers: events-kafka.adib.invalid:9093
      topic: transacthub.payment-events
      acks: all
      idempotent: "true"
      securityProtocol: sasl_ssl
      saslMechanism: SCRAM-SHA-512
      secretRef: env:TH_ADIB_EVENTS_KAFKA_LOGIN
  # The bank's exchange-rate service, which the rates feed asks every refreshMinutes and publishes as a configuration release
  # (R-09-177): its REST interface, the token by reference. A placeholder host until the bank names its own (Issue I-163).
  - port: p.port.fx-rates.v1
    adapter: gateway-rest
    validFrom: 2026-11-23T00:00:00Z
    settings:
      baseUrl: https://fx-rates.adib.invalid/
      ratesPath: /rates
      refreshMinutes: "60"
      secretRef: env:TH_ADIB_FX_RATES_TOKEN
