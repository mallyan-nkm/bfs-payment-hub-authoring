# The bank's acknowledgement wait (Issue I-116): its WPS workflow waits twenty minutes for WPS to acknowledge the salary file
# (wps-outward.v2, 20 polls 60 seconds apart), elapsed time. With no acknowledgement the leg is pending after twenty minutes, not
# after the factory's one business day. The file is invented.
kind: test
id: BANK-WPS-003
title: With no acknowledgement the salary file is pending after the bank's twenty minutes
target: uae.wps.wf.salary-file-out.v1
level: leg
evaluationDate: "2026-11-24"
tenant: adib
bench:
  - port: uae.wps.port.wps.v1
    simulator: uae.wps.sim.wps-outward.v1
    scenario: no-reply
  - port: uae.p.port.calendar.v1
    simulator: uae.p.sim.calendar.v1
    scenario: accept
  - port: p.port.encryption.v1
    simulator: p.sim.encryption.v1
    scenario: accept
  - port: uae.wps.port.labour-ministry.v1
    simulator: uae.wps.sim.labour-ministry.v1
    scenario: accept
  # The bank's party register (R-12-27): the employer is registered.
  - port: p.port.party-register.v1
    simulator: p.sim.party-register.v1
    scenario: accept
given:
  inbound: samples/wps-sif-valid.sif
expect:
  outcome: pending
  virtualElapsed: PT20M
  detail:
    - submit.encrypt:encrypted
    - submit.send:accepted
    - submit.await-ack:timeout
