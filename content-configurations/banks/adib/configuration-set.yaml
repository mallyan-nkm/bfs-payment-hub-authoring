# The bank's values for factory parameters, and its hook bindings (plan W6). Values, not definitions: each one
# sets a parameter the factory declares, inside its bounds, from its validFrom. README.md gives the source of each.
# The bank runs WPS by the owner's decision of 2026-11-22 (Issue I-86). Its WPS values are the ones the source holds for
# it: the WPS outward workflow only ADIB's activities serve (dsl/workflows/wps-outward.v2.workflow.json 2.0.0) and the
# bank's WPS plugin (PaymentHub.Activities.Bank.Adib.Wps). The source holds no WPS routing code for the bank, so none is set.
kind: configuration-set
tenant: adib
release: 1.4.0
title: Bank configuration for WPS
accepts:
  - { scope: p, release: 1.4.0 }
  - { scope: uae.p, release: 1.4.0 }
  - { scope: uae.wps, release: 1.4.0 }
values:
  # The rails the bank runs among the factory's: WPS. The source's base seed subscribes the tenant to WPS
  # (infra/docker/mssql/init.sql, TenantSubscriptions adib WPS); the owner decided on 2026-11-22 that it runs it here.
  - parameter: p.table.rail-choice.v1#enabledRails
    value: [uae.wps]
    validFrom: "2026-11-22"
  # VAT on a charge, 5 per cent (wps-outward.v2, variable vatPercentage 5.0). The source seeds no charge slab for the bank
  # (chargesConfigured true, no slab), so the slabs stay the factory's default, none.
  - parameter: p.post.accounting.v1#vatPercent
    value: 5
    validFrom: "2026-11-22"
  # The accounts the WPS postings move between (wps-outward.v2: cbNostroAccount, sifSuspenseAccount, chargeGlAccount,
  # vatGlAccount). They read as the workflow's names for the bank's general-ledger accounts, not account numbers: a
  # deployment confirms them with the bank (README.md, "What a deployment must set").
  - parameter: p.post.accounting.v1#settlementAccount
    value: CB-NOSTRO-WPS
    validFrom: "2026-11-22"
  - parameter: p.post.accounting.v1#suspenseAccount
    value: WPS-SUSPENSE-GL
    validFrom: "2026-11-22"
  - parameter: p.post.accounting.v1#chargeIncomeAccount
    value: WPS-CHARGE-GL
    validFrom: "2026-11-22"
  - parameter: p.post.accounting.v1#vatAccount
    value: WPS-VAT-GL
    validFrom: "2026-11-22"
  # The id this folder's encryption binding (encryption.yaml) gives the Central Bank's WPS public key (Issue I-87). The
  # source has no encryption profile for the bank's outgoing files; the key itself is set at deployment, by reference.
  # The acknowledgement wait of the bank's WPS workflow: 20 minutes (wps-outward.v2, 20 polls 60 seconds apart; the step's
  # 1200-second timeout), elapsed time. The factory's bound starts at fifteen minutes from uae.wps 1.3.0 (Issue I-116).
  - parameter: uae.wps.exchange.submit-salary-file.v1#ackWait
    value: PT20M
    validFrom: "2026-11-22"
  - parameter: uae.wps.exchange.submit-salary-file.v1#ackWaitCalendar
    value: elapsed
    validFrom: "2026-11-22"
  - parameter: p.protect.encrypt-file.v1#recipientKey
    value: cbuae-wps
    validFrom: "2026-11-22"
# The labour ministry notification is bound: the bank's WPS workflow calls it (wps-outward.v2, steps
# mohre_salary_notification, mohre_salary_completion and mohre_nak_notification, mohreNotificationEnabled true), and the
# bank runs WPS. The employer AML check stays unbound: no workflow of the source calls AdibWpsEmployerAmlCheck (README.md).
bindings:
  - hookPoint: p.wf.corporate.v1#on-close
    hook: b.hook.labour-ministry-notify.v1
    release: 1.0.0
    validFrom: "2026-11-22"
approval:
  maker: bank.maker
  checker: bank.checker
