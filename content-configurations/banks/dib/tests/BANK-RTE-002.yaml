      - payment:
          instructedAmount:
            value: 1500
            currency: AED
          creditorAccount:
            iban: AE570330000000000000002
          creditorAgent:
            clearingMemberId: "302620122"
      - payment:
          instructedAmount:
            value: 2000
            currency: AED
          creditorAccount:
            iban: AE110260000000000000003
          creditorAgent:
            clearingMemberId: "302620122"
expect:
