# The bank's values for factory parameters, and its hook bindings (plan W6). Values, not definitions: each one
# sets a parameter the factory declares, inside its bounds, from its validFrom. README.md gives the source of each.
# The bank does not run WPS in the source, so only the platform is configured: no routing code, no WPS dial.
kind: configuration-set
tenant: enbd
release: 1.9.0
title: Bank configuration (platform only)
accepts:
  - { scope: p, release: 1.8.0 }
  - { scope: uae.p, release: 1.8.0 }
  - { scope: uae.wps, release: 1.8.0 }
values:
  # The bank takes its rates from the rates feed (platform-adapters.yaml binds p.port.fx-rates.v1), so every rate must carry its
  # asOf and a rate typed by hand is refused like a stale one (owner's decision of 24 November 2026, Issue I-278, R-09-247; lint L60).
  - parameter: p.enrich.fx-rate.v1#requireAsOf
    value: true
    validFrom: "2026-11-24"
  # The rails the bank runs among the factory's: none. The source has no deployment of the bank: no customer overlay and no
  # licence. Its forks are stubs; none of its rails is licensed anywhere in the source.
  - parameter: p.table.rail-choice.v1#enabledRails
    value: []
    validFrom: "2026-11-22"
# The employer AML check and the labour ministry notification are carried as hooks, not bound: no live workflow of
# the bank in the source calls them (README.md). Binding one is a line here with its validFrom.
bindings: []
approval:
  maker: bank.maker
  checker: bank.checker
