          payment:
            instructedAmount:
              value: 100
    expect:
      findings: []
  - name: fails
    evaluationDate: '2026-11-17'
    given:
      Batch:
        id: B1
      Item:
        - batchId: B1
          payment:
            instructedAmount:
              value: 100
    expect:
      findings:
        - reasonCode: AM03
  - name: each line names its own
    evaluationDate: '2026-11-17'
