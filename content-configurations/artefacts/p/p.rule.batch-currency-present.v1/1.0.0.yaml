kind: rule
name: p.rule.batch-currency-present.v1
release: 1.0.0
title: A file names its currency on its batch or on each line
ruleKind: cross-field
level: batch
repeatability: non-repeatable
when:
  - match:
      fact: Batch
      as: b
      where: isBlank(b.currency)
  - query:
      as: unpriced
      match:
        fact: Item
        where: item.batchId == b.id and isBlank(item.payment.instructedAmount.currency)
      collect: true
  - having: count(unpriced) > 0
then:
  - yield:
      finding:
        severity: reject
        path: batch.currency
        reasonCode: AM03
