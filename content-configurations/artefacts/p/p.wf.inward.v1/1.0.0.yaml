# Generated by `npm run studio -- seed-content` from spec/factory/p/workflows/p.wf.inward.v1.yaml. Edit the source and seed again; never edit this file.
kind: workflow
wfKind: platform
name: p.wf.inward.v1
release: 1.0.0
dsl: 1.0.0
title: Inward payments
description: Inward lifecycle for every rail. Checks record their outcomes and carry on, because the scheme must always be answered by a leg.
direction: inward
entry:
  reads: [header, payment, batch, "items[]"]
exit:
  writes: [status, facts.disposition, facts.posting]
  outcomes: [settled, rejected, returned, review]
slots:
  - name: scheme-leg
    contract:
      reads: [header, payment, batch, "items[]", facts.disposition]
      writes: [status, facts.posting, messages]
      outcomes: [settled, rejected, returned, pending]
      primaryOutcome: settled
  - name: scheme-refuse
    contract:
      reads: [header, payment, batch, facts.disposition, facts.validation]
      writes: [status, messages]
      outcomes: [refused, pending]
      primaryOutcome: refused
hookPoints:
  - name: on-close
    type: notify
    description: A bank may be told that an inward payment has closed.
    contract:
      reads: [header, status, payment.instructedAmount]
    policy: { timeout: PT10S, onFailure: fail-open }
signals: [pause, resume, cancel, re-screen]
do:
  - id: validate
    call: p.validate.canonical.v1
    handle:
      repair: { continue: true }
      reject: { continue: true }
  - id: duplicate
    call: p.validate.duplicate.v1
    handle:
      duplicate: { continue: true }
  - parallel:
      join: all
      branches:
        - - id: sanctions
            call: p.screen.sanctions.v1
            handle:
              hit: { continue: true }
              pending: { continue: true }
        - - id: fraud
            call: p.screen.fraud.v1
            handle:
              suspect: { continue: true }
  - id: disposition
    call: p.decide.inward-disposition.v1
    handle:
      refuse:
        - id: refuse
          slot: scheme-refuse
          handle:
            pending: { end: review }
        - end: rejected
      review:
        - id: review
          call: p.hold.approval.v1
          handle:
            declined:
              - id: refuse-after-review
                slot: scheme-refuse
                handle:
                  pending: { end: review }
              - end: rejected
            expired: { end: review }
  - id: leg
    slot: scheme-leg
    handle:
      rejected: { end: rejected }
      returned: { end: returned }
      pending: { end: review }
  - end: settled
finally:
  - id: notify
    call: p.notify.channel.v1
  - id: publish
    call: p.notify.publish-fact.v1
  - hook: on-close
provenance: { origin: factory, status: confirmed }
