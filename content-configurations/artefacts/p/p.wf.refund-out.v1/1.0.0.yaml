# Generated by `npm run studio -- seed-content` from spec/factory/p/workflows/p.wf.refund-out.v1.yaml. Edit the source and seed again; never edit this file.
kind: workflow
wfKind: platform
name: p.wf.refund-out.v1
release: 1.0.0
dsl: 1.0.0
title: Refund orders, outward
description: >-
  The outward direction of the refund order (p.wf.refund.v1 is the inward one): the bank asks a scheme to refund an earlier payment
  for its customer, for example an employer's salary lines (ISO 20022 camt.056 out, the funds back as pacs.004). It is an order of its
  own, pinned to the distribution active when it is accepted, that names the earlier payment by id (header.originalPaymentId). The
  platform owns its lifecycle and its money: it finds the earlier payment, has the scheme leg ask for the refund and wait for its
  settlement, then converts the settled amount at the bank's rate, prices the bank's charge, posts the credit to its customer with the
  charge and the VAT as entries of their own (p.post.accounting.v2), and verifies it. The leg only builds, encrypts, sends and reads
  the scheme's answers; it moves no money (L47).
direction: outward
entry:
  reads: [header, payment, batch, "items[]"]
exit:
  writes: [status, facts.record, facts.settlement, facts.fx, facts.charges, facts.posting]
  outcomes: [settled, rejected, review]
slots:
  - name: scheme-leg
    contract:
      reads: [header, batch, "items[]", facts.record]
      writes: [status, facts.settlement, messages]
      outcomes: [settled, rejected, pending]
      primaryOutcome: settled
hookPoints:
  - name: on-close
    type: notify
    description: A bank may be told that an outward refund order has closed.
    contract:
      reads: [header, status]
    policy: { timeout: PT10S, onFailure: fail-open }
signals: [pause, resume, cancel]
do:
  # The earlier payment, by the id the order names (R-02-20).
  - id: original
    call: p.enrich.payment-record.v1
    handle:
      not-found: { end: rejected }
  # The scheme asks for the refund and reads its settlement; nothing is posted before the scheme settles.
  - id: leg
    slot: scheme-leg
    handle:
      rejected: { end: rejected }
      pending: { end: review }
  # FX and charges are the platform's, on the bank's values (R-12-20). A settled refund the bank cannot convert goes to review.
  - id: fx
    call: p.enrich.fx-rate.v1
    handle:
      no-rate: { end: review }
  - id: charges
    call: p.enrich.charges.v1
    handle:
      none: { continue: true }
  # The credit may run again (it carries an idempotency key), so a failed attempt parks for a business day (R-05-55).
  - id: post
    call: p.post.accounting.v2
    policy: { park: P1D }
    handle:
      rejected: { end: review }
      unknown: { continue: true }
  - id: verify
    call: p.post.verify.v1
    handle:
      mismatch: { end: review }
  - end: settled
finally:
  - id: notify
    call: p.notify.channel.v1
  - id: publish
    call: p.notify.publish-fact.v1
  - hook: on-close
provenance: { origin: factory, status: confirmed }
