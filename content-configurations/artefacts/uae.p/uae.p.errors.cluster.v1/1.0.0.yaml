name: uae.p.errors.cluster.v1
release: 1.0.0
title: UAE cluster error dictionary
description: The reason codes the UAE cluster platform's rules and ports raise that the platform's dictionary does not hold
  (R-05-51).
entries:
  - code: DT01
    title: Invalid date
    category: business
    retryable: false
    isoReasonCode: DT01
    raisedBy:
      - rule
      - port
    meaning: 'A date is not valid for the rail: a holiday, a date in the past, or not a business day.'
    causes:
      - The requested execution date is not a business day of the cluster's calendar.
    runbook:
      checks:
        - Open the payment in the operations console and read the step that gave the reason code.
        - Check the cluster's calendar for the date.
      safeActions:
        - 'Do not retry: the same data gives the same answer. Correct the data at its source.'
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
  - code: RC01
    title: Bank identifier incorrect
    category: business
    retryable: false
    isoReasonCode: RC01
    raisedBy:
      - rule
      - port
    meaning: The bank identifier (routing code or BIC) is not valid or not known.
    causes:
      - The routing code is badly formed or not in the participant directory.
    runbook:
      checks:
        - Open the payment in the operations console and read the step that gave the reason code.
      safeActions:
        - 'Do not retry: the same data gives the same answer. Correct the data at its source.'
      escalation: Escalate to the bank's payment operations supervisor with the payment id and the step.
