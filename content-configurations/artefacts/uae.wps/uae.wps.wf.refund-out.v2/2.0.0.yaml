kind: workflow
wfKind: leg
name: uae.wps.wf.refund-out.v2
release: 2.0.0
dsl: 1.0.0
title: WPS refund request, bank as the employer's bank
description: >-
  The scheme side of an outward refund order (p.wf.refund-out.v1). Builds the refund request (RFR), and the request block encrypts
  it for WPS, sends it, reads its acknowledgement and waits for the refund settlement (RSU). The leg moves no money: the credit to
  the employer, its FX, charge and VAT are the platform's. It replaces uae.wps.wf.refund-out.v1, which posted the employer's credit
  itself on p.wf.request.v1; that release stays published, and requests started on it finish on it (Issue I-137).
direction: outward
implements:
  slot: scheme-leg
  of: [p.wf.refund-out.v1]
entry:
  reads: [header, batch, "items[]", facts.record]
exit:
  writes: [status, facts.settlement, messages]
  outcomes: [settled, rejected, pending]
do:
  - id: render
    call: uae.wps.map.rfr-out.v1
    handle:
      unmappable: { end: rejected }
  - id: request
    call: uae.wps.exchange.request-refund.v1
    handle:
      rejected: { end: rejected }
      pending: { end: pending }
  - end: settled
provenance:
  origin: factory
  status: provisional
