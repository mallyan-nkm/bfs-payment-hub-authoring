# Generated by `npm run studio -- seed-content` from spec/factory/uae.wps/workflows/uae.wps.wf.agent-payment-in.v1.yaml. Edit the source and seed again; never edit this file.
kind: workflow
wfKind: leg
name: uae.wps.wf.agent-payment-in.v1
release: 1.0.0
dsl: 1.0.0
title: WPS payment file, bank as the agent
description: Waits for the supplementary file that pairs with the payment file, confirms receipt, credits each employee and reports disbursement. Reports are exchanges that move no money. Credits that were refused go back to WPS in a returns file; once WPS accepts it, the return is recorded.
direction: inward
implements:
  slot: scheme-leg
  of: [p.wf.inward.v1]
entry:
  reads: [header, batch, "items[]", ext.uae.wps, facts.disposition]
exit:
  writes: [status, facts.posting, messages]
  outcomes: [settled, rejected, returned, pending]
do:
  - id: supplement
    call: uae.wps.exchange.receive-supplement.v1
    policy: { replyTimeout: PT4H }
    handle:
      missing: { end: pending }
  - id: file-checks
    call: uae.wps.validate.payment-file.v1
    handle:
      reject: { end: pending }
  - id: render-receipt
    call: uae.wps.map.prc-out.v1
    handle:
      unmappable: { end: pending }
  - id: confirm-receipt
    call: uae.wps.exchange.confirm-receipt.v1
    handle:
      rejected: { end: pending }
      pending: { end: pending }
  - forEach:
      in: "items[]"
      onItemFailure: continue
      do:
        - id: credit
          call: p.post.accounting.v1
          level: item
          handle:
            rejected: { continue: true }
            unknown: { continue: true }
  - id: render-disbursement
    call: uae.wps.map.dif-out.v1
    handle:
      unmappable: { end: pending }
  - id: report-disbursement
    call: uae.wps.exchange.send-disbursement-file.v1
    handle:
      rejected: { end: pending }
      unknown: { end: pending }
  - id: returns
    call: uae.wps.decide.returns.v1
    handle:
      returns:
        - id: render-returns
          call: uae.wps.map.rfa-out.v1
          handle:
            unmappable: { end: pending }
        - id: return-credits
          call: uae.wps.exchange.return-credits.v1
          handle:
            rejected:
              - id: returns-operations
                call: p.hold.repair.v1
                handle:
                  rejected: { end: pending }
                  expired: { end: pending }
              - end: pending
            pending: { end: pending }
        - id: record-return
          call: uae.wps.post.return.v1
          handle:
            rejected: { end: pending }
            unknown: { end: pending }
  - end: settled
provenance:
  origin: factory
  status: provisional
  clauses: [CBUAE WPS responsibility guide 2018]
  note: From public sources. Items that fail to credit are reported in the disbursement file. A credit the core system refused is returned in a returns file (RFA); on ACK the return is recorded, on NAK it goes to operations. Which credits are returned, and the leg's outcome after a return, are Issues I-39 and I-40. The supplementary file is held by reference; its map and the wait are to be confirmed.
