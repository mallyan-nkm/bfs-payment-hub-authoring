# Generated by `npm run studio -- seed-content` from spec/factory/uae.wps/workflows/uae.wps.wf.salary-file-out.v1.yaml. Edit the source and seed again; never edit this file.
kind: workflow
wfKind: leg
name: uae.wps.wf.salary-file-out.v1
release: 1.4.0
dsl: 1.0.0
title: WPS salary file, bank as the employer's bank
description: Sets the business date, asks the labour ministry for the employer's status, validates the file and each record, and submits the file to WPS. The submit step is a composite. It sends, waits for the acknowledgement and reads it. Release 1.2.0 lets the steps that may run again park for a business day when they fail, for an operator's retry, instead of ending the file (R-12-26, Issue I-125). They are the business date, the employer's status, the file checks and the render. Release 1.3.0 first looks the employer up in the bank's party register, as the source's pre-check did, and refuses a file whose employer the bank has not registered, or registered with other details than the channel supplied (R-12-27). Release 1.4.0 applies the bank's cut-off after the business date. A file accepted after the cut-off of its scheme and direction counts for the next business day, or is refused, as the bank's row says (R-12-28, Issue I-191).
direction: outward
implements:
  slot: scheme-leg
  of: [p.wf.corporate.v1]
entry:
  reads: [header, batch, "items[]", ext.uae.wps, facts.reservation]
exit:
  writes: [status, messages]
  outcomes: [settled, rejected, returned, pending]
do:
  - id: business-date
    call: uae.p.enrich.business-date.v1
    policy: { park: P1D }
  - id: cut-off
    call: p.decide.cut-off.v1
    handle:
      refused: { end: rejected }
  - id: corporate
    call: p.enrich.party-register.v1
    policy: { park: P1D }
    handle:
      not-registered: { end: rejected }
      mismatch: { end: rejected }
  - id: employer-status
    call: uae.wps.enrich.employer-status.v1
    policy: { park: P1D }
    handle:
      not-found: { continue: true }
  - id: file-checks
    call: uae.wps.validate.salary-file.v1
    policy: { park: P1D }
    handle:
      repair: { end: rejected }
      reject: { end: rejected }
  - forEach:
      in: "items[]"
      onItemFailure: stop
      do:
        - id: record-checks
          call: uae.wps.validate.salary-record.v1
          level: item
          handle:
            reject: { end: rejected }
        - id: record-iban
          call: uae.p.validate.iban.v1
          level: item
          handle:
            reject: { end: rejected }
  - id: render
    call: uae.wps.map.sif-out.v1
    policy: { park: P1D }
    handle:
      unmappable: { end: rejected }
  - id: submit
    call: uae.wps.exchange.submit-salary-file.v1
    handle:
      rejected: { end: rejected }
      pending: { end: pending }
  - end: settled
provenance:
  origin: factory
  status: provisional
  clauses: [CBUAE WPS responsibility guide 2018]
  note: From public sources. Confirm against the current CBUAE WPS rulebook.
