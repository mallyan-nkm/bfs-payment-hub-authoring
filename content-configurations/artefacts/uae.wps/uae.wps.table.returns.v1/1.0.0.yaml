kind: table
name: uae.wps.table.returns.v1
release: 1.0.0
title: Which employee credits go back to WPS in a returns file
hitPolicy: first
inputs:
  - name: refused
    expression: sum(items, i => i.facts.posting.outcome == 'rejected' or (i.facts.posting.outcome == 'unknown' and
      i.facts.postingVerified.outcome == 'mismatch'))
  - name: stillUnknown
    expression: sum(items, i => i.facts.posting.outcome == 'unknown' and not (i.facts.postingVerified.outcome in
      ['verified', 'mismatch']))
  - name: allRefused
    expression: count(items) > 0 and sum(items, i => i.facts.posting.outcome == 'rejected' or (i.facts.posting.outcome
      == 'unknown' and i.facts.postingVerified.outcome == 'mismatch')) == count(items)
  - name: amount
    expression: sumWhere(items, i => i.facts.posting.outcome == 'rejected' or (i.facts.posting.outcome == 'unknown'
      and i.facts.postingVerified.outcome == 'mismatch'), i => round2(i.ext.uae.wps.fixedPay + i.ext.uae.wps.variablePay))
outputs:
  - returns
  - returnScope
  - count
  - amount
rows:
  - when:
      stillUnknown:
        gt: 0
    then:
      returns: unverified
      returnScope: none
      count: refused
      amount: amount
    reason: A credit's outcome is still unknown after the inquiry; nothing is returned until every credit is known
  - when:
      allRefused: true
    then:
      returns: returns
      returnScope: whole-file
      count: refused
      amount: amount
    reason: Every credit was refused; the whole file is returned
  - when:
      refused:
        gt: 0
    then:
      returns: returns
      returnScope: partial
      count: refused
      amount: amount
    reason: Some credits were refused and are returned; the others were paid
  - when: {}
    then:
      returns: none
      returnScope: none
      count: refused
      amount: amount
    reason: Every credit posted
