kind: workflow
wfKind: subflow
name: uae.wps.sub.request-refund.v1
release: 1.3.0
dsl: 1.0.0
title: Request a refund, read the acknowledgement, wait for the settlement
description: What the request-refund block does underneath. Two waits. The first takes the reply time of the calling step. The second is the scheme wait for settlement and is fixed here. The file is encrypted for WPS before it is sent, and a file the encryption service refuses is never sent (Issue I-117, R-12-17). From 1.3.0 the send reads the encryption step's fact and sends the encrypted file where the bank's binding encrypted it, never the plain one (Issue I-293, R-09-232).
implements:
  activity: uae.wps.exchange.request-refund.v1
exit:
  outcomes: [accepted, rejected, pending]
do:
  - id: encrypt
    call: p.protect.encrypt-file.v1
    handle:
      refused: { return: rejected }
  - id: send
    call: uae.wps.exchange.send-refund-request.v2
    handle:
      rejected: { return: rejected }
      unknown: { return: pending }
  - id: await-ack
    await:
      message: uae.wps.ack
      correlateBy: header.fileId
      family: rfr
      onTimeout: { return: pending }
  - id: read-ack
    call: uae.wps.map.ack-in.v1
    handle:
      nak: { return: rejected }
  - id: await-settlement
    await:
      message: uae.wps.rsu
      correlateBy: header.fileId
      timeout: P10D
      calendar: business
      onTimeout: { return: pending }
  - id: read-settlement
    call: uae.wps.map.rsu-in.v1
    handle:
      declined: { return: rejected }
  - return: accepted
provenance:
  origin: factory
  status: provisional
  clauses: [CBUAE WPS responsibility guide 2018]
  note: From public sources. Waiting times are placeholders.
