    fields:
      - { id: supplement, label: Supplementary file (PSI), group: files, source: "step:supplement.outcome", format: status }
      - { id: fileChecks, label: File checks, group: files, source: "step:file-checks.outcome", format: status }
      - { id: prcSentAt, label: PRC sent at, group: files, source: "step:confirm-receipt.send.at", format: datetime }
      - { id: prcStatus, label: PRC ACK or NAK, group: files, source: "step:confirm-receipt.read-ack.outcome", format: status, oldScreen: "WPS dashboard, ACK and NAK received per file type (PRC)" }
      - { id: difSentAt, label: DIF sent at, group: files, source: "step:report-disbursement.send.at", format: datetime }
      - { id: difStatus, label: DIF ACK or NAK, group: files, source: "step:report-disbursement.read-ack.outcome", format: status, oldScreen: "WPS dashboard, DIF, Direct Instruction File status" }
      - { id: returnsDecision, label: Returns, group: returns, source: "step:returns.outcome", format: status, oldScreen: "WPS dashboard, Returned" }
      - { id: returnsCount, label: Returned credits, group: returns, source: "step:returns.writes.facts.returns.count", format: count, oldScreen: "WPS dashboard, Returned; Failed Credits" }
      - { id: returnsAmount, label: Returned amount, group: returns, source: "step:returns.writes.facts.returns.amount", format: amount }
      - { id: rfaStatus, label: RFA ACK or NAK, group: returns, source: "step:return-credits.read-ack.outcome", format: status, oldScreen: "WPS dashboard, RFA, Return File Acknowledgement status" }
