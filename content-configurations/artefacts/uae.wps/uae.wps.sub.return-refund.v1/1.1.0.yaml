title: Send the disbursement cancellation request and read the acknowledgement
description: What the return-refund block does underneath. The DCR is encrypted for WPS, sent, and its acknowledgement awaited for the calling step's reply time and read. A file the encryption service refuses is never sent (R-12-17). From 1.1.0 the send reads the encryption step's fact and sends the encrypted file where the bank's binding encrypted it, never the plain one (Issue I-293, R-09-232).
implements:
  activity: uae.wps.exchange.return-refund.v1
exit:
  outcomes: [accepted, rejected, pending]
do:
  - id: encrypt
    call: p.protect.encrypt-file.v1
    handle:
      refused: { return: rejected }
  - id: send
    call: uae.wps.exchange.send-disbursement-cancellation.v2
    handle:
      rejected: { return: rejected }
      unknown: { return: pending }
  - id: await-ack
    await:
      message: uae.wps.ack
      correlateBy: header.fileId
      family: dcr
      onTimeout: { return: pending }
  - id: read-ack
    call: uae.wps.map.ack-in.v1
    handle:
      nak: { return: rejected }
  - return: accepted
