kind: configuration-set
tenant: example-bank
release: 1.7.0
title: Example bank configuration, with its routing code for the source's CBX checks
accepts:
- scope: p
  release: 1.6.0
- scope: uae.p
  release: 1.6.0
- scope: uae.wps
  release: 1.6.0
values:
- parameter: b.rule.internal-limit.v1#internalLimit
  value: 250000
  validFrom: '2026-01-01'
  validTo: '2026-12-31'
- parameter: b.rule.internal-limit.v1#internalLimit
  value: 100000
  validFrom: '2027-01-01'
- parameter: p.table.rail-choice.v1#enabledRails
  value:
  - uae.wps
  validFrom: '2026-01-01'
- parameter: uae.wps.rule.agent-is-this-bank.v1#ownRoutingCodes
  value:
  - '302620122'
  validFrom: '2026-01-01'
- parameter: uae.wps.exchange.return-credits.v1#replyWait
  value: P10D
  validFrom: '2026-01-01'
- parameter: uae.wps.exchange.return-credits.v1#replyWaitCalendar
  value: business
  validFrom: '2026-01-01'
- parameter: uae.wps.table.participant-names.v1#participants
  value:
  - routingCode: '203320101'
    name: Example Bank One
  - routingCode: '302620122'
    name: Example Bank Two
  validFrom: '2026-01-01'
- parameter: p.enrich.fx-rate.v1#rates
  value:
  - from: AED
    to: USD
    rate: 0.2723
  validFrom: '2026-01-01'
- parameter: p.enrich.charges.v1#chargeSlabs
  value:
  - upTo: 1000
    fixed: 5
    percent: 0.1
  - upTo: 1000000
    fixed: 10
    percent: 0.05
  validFrom: '2026-01-01'
- parameter: p.enrich.charges.v1#minCharge
  value: 5
  validFrom: '2026-01-01'
- parameter: p.enrich.charges.v1#maxCharge
  value: 250
  validFrom: '2026-01-01'
- parameter: p.enrich.charges.v1#vatPercent
  value: 5
  validFrom: '2026-01-01'
- parameter: uae.wps.map.rri-in.v1#fileNameAgentCode
  value: '999'
  validFrom: '2026-01-01'
- parameter: uae.wps.map.cb-sif-out.v1#bankRoutingCode
  value: '302620122'
  validFrom: '2026-11-01'
bindings:
- hookPoint: p.wf.corporate.v1#before-release
  hook: b.hook.pre-release-approval.v1
  release: 1.0.0
  validFrom: '2026-01-01'
- hookPoint: p.seg.check-and-screen.v1#enrich-before-screen
  hook: b.hook.add-cost-centre.v1
  release: 1.0.0
  validFrom: '2026-01-01'
- hookPoint: p.wf.corporate.v1#on-close
  hook: b.hook.treasury-notify.v1
  release: 1.0.0
  validFrom: '2026-01-01'
approval:
  maker: example.maker
  checker: example.checker
